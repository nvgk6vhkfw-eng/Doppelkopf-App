
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123429">
<title>Doppelkopf Club</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;background:#102d24;color:#f5eddf}
*{box-sizing:border-box}
body{margin:0}
header{padding:19px;background:#183b2e;border-bottom:2px solid #b68b56}
h1{margin:0;color:#e9bd82;font-size:25px}
header small{color:#d1bda0}
main{max-width:1100px;margin:auto;padding:14px}
nav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:15px}
button{background:#315342;color:#fff5e7;border:1px solid #9b805b;border-radius:11px;padding:12px 9px;font:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary,button.active{background:#a47748;color:white}
button.danger{background:#633c36}
.card{background:#1d3d30;border:1px solid #76674f;border-radius:16px;padding:16px;margin-bottom:15px}
h2,h3{color:#e9bd82;margin-top:0}
h2{font-size:21px}
p{line-height:1.5}
.muted{color:#cbbba4;font-size:13px}
input,select{width:100%;padding:12px;background:#102d24;color:white;border:1px solid #ab9067;border-radius:9px;font:inherit;margin:7px 0 13px}
label{display:block;margin-top:10px}
.check{display:flex;align-items:center;gap:10px;padding:8px 0}
.check input{width:auto;margin:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:9px;padding:11px 0;border-bottom:1px solid #536e59}
.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}
.actions button{flex:1}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tile{min-height:115px}
.tile b{display:block;color:#edc48d;font-size:30px}
.good{color:#b9e2b0}
.bad{color:#f4afa1}
.big{font-size:29px;color:#edc48d;font-weight:700}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:10px 5px;border-bottom:1px solid #526b58}
.scroll{overflow-x:auto}
.pill{background:#9d754b;border-radius:25px;padding:7px 12px;font-size:12px}
.name-pool{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}
.chip{background:#20513a;border:2px solid #aa885b;border-radius:11px;text-align:center;padding:13px 4px;font-weight:650;cursor:grab;touch-action:none;user-select:none}
.chip.chosen{background:#a47748}
.chip.used{opacity:.3;pointer-events:none}
.setup{background:#092c21;padding:10px;border-radius:17px}
.layout{display:grid;grid-template-columns:minmax(68px,1fr) minmax(0,3fr) minmax(68px,1fr);grid-template-rows:78px 180px 78px;gap:7px;align-items:center}
.top,.bottom{grid-column:2;display:flex;justify-content:center;gap:8px;height:100%}
.top{grid-row:1}.bottom{grid-row:3}
.left{grid-column:1;grid-row:2}
.right{grid-column:3;grid-row:2}
.top .seat,.bottom .seat{width:47%;height:100%}
.left .seat,.right .seat{width:100%;min-height:150px}
.seat{border:2px dashed #a9c9ad;background:#194332;border-radius:12px;padding:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;cursor:pointer;overflow-wrap:anywhere}
.seat .plus{font-size:27px}
.seat .name{font-weight:700;font-size:13px}
.seat .hint{font-size:10px}
.seat.first{border-color:#efbf7b}
.seat.filled{border-style:solid;background:#335c44}
.seat.out{opacity:.4}
.seat.mixer{background:#765536;border-color:#f4c583}
.felt{grid-column:2;grid-row:2;height:100%;background:linear-gradient(140deg,#087349,#06452f);border:8px solid #a66e3e;border-radius:30px;box-shadow:inset 0 0 0 3px #d5a66c;display:flex;flex-direction:column;align-items:center;justify-content:center}
.felt strong{font:700 clamp(14px,3vw,26px) Georgia,serif;color:#f0c88e}
.cards{font-size:35px;background:#fff8e8;color:#b23e36;border-radius:8px;padding:5px 10px;transform:rotate(-5deg);margin-bottom:12px}
.winners{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:14px 0}
.winner{min-height:70px;border:2px solid #819d7f}
.winner.selected{background:#a47748;border-color:#efc68d}
.preview{background:#102d24;border:1px solid #63836b;border-radius:12px;padding:14px;margin:15px 0}
.preview .row:last-child{border:0}
@media(min-width:700px){
 .tiles{grid-template-columns:repeat(4,1fr)}
 .name-pool{grid-template-columns:repeat(6,1fr)}
 .layout{grid-template-columns:155px minmax(0,1fr) 155px;grid-template-rows:95px 270px 95px;gap:14px}
 .top .seat,.bottom .seat{max-width:220px}
 .left .seat,.right .seat{min-height:170px}
}
@media(max-width:500px){
 nav button{font-size:11px;padding:10px 2px}
 .card{padding:12px}
 .setup{padding:6px}
 .layout{grid-template-columns:minmax(65px,1fr) minmax(0,2.5fr) minmax(65px,1fr);grid-template-rows:73px 155px 73px;gap:5px}
 .seat .name{font-size:11px}
 .seat .hint{font-size:9px}
 .felt{border-width:5px;border-radius:20px}
 .cards{font-size:23px}
}
 .bockbar{background:#493b27;border:1px solid #d2a66b;border-radius:12px;padding:13px;margin:12px 0;color:#f7d39c;text-align:center;font-weight:750}
 .bockbar.off{background:#244435;border-color:#6a8a70;color:#d1e1d1}
 .triggers{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}
 .triggers label{margin:0;display:flex;align-items:center;justify-content:center;text-align:center;gap:5px;min-height:70px;padding:7px;border:1px solid #a8895e;border-radius:10px;background:#284a38;font-size:12px}
 .triggers input{width:auto;margin:0}
 .mini{font-size:12px;color:#d1bda0}
 .locked{opacity:.8}
 </style>
</head>
<body>
<header>
<h1>♠ Doppelkopf Club</h1>
<small>Spielabende · Tacken · Clubkasse</small>
</header>
<main>
<nav id="nav"></nav>
<div id="app"></div>
</main>
<script>
"use strict";
const KEY="doko-bronze-v3";
const STAMM=["Tom","Patrick","Manuel","Lukas E.","Lukas T.","Andre"];
const fresh=()=>({
 players:STAMM.map((name,i)=>({id:"s"+i,name,guest:false})),
 evenings:[],cash:[],
 settings:{tack:.2,startFee:5,soloFee:5}
});
let db;
try{db=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{db=fresh()}
if(!Array.isArray(db.players)||!Array.isArray(db.evenings)||!Array.isArray(db.cash))db=fresh();
db.settings={tack:.2,startFee:5,soloFee:5,...db.settings};
db.evenings.forEach(e=>{
 if(!Array.isArray(e.specials))e.specials=[];
 if(!Array.isArray(e.soloPlayers))e.soloPlayers=[];
 if(!Array.isArray(e.rounds))e.rounds=[];
});
let page="home",eveningId=null,pending=null,selected=null;
let winners=[],dragId=null,dragStart=null;
const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=v=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const euro=n=>Number(n||0).toLocaleString("de-DE",{style:"currency",currency:"EUR"});
const name=id=>db.players.find(p=>p.id===id)?.name||"Unbekannt";
const current=()=>db.evenings.find(e=>e.id===eveningId);
const button=(label,action,cls="")=>`<button class="${cls}" onclick="${action}">${label}</button>`;
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert("Speichern fehlgeschlagen: "+e.message)}}
function go(p){page=p;if(p==="round")winners=[];render()}
function render(){
 const tabs=[["home","⌂ Start"],["evening","♠ Spiel"],["players","♣ Spieler"],["cash","€ Kasse"],["settings","⚙ Mehr"]];
 $("nav").innerHTML=page==="seating"?"":tabs.map(([p,t])=>button(t,`go('${p}')`,page===p?"active":"")).join("");
 const views={home,evening,players,cash,settings,seating,round,hochzeit,results,solo,debt};
 $("app").innerHTML=(views[page]||home)();
 if(page==="round")previewRound();if(page==="solo")previewSolo();
}

/* Tisch und Mischer */

function sequence(n){
 if(n===4)return["right","bottom1","left","top1"];
 if(n===5)return["right","bottom1","left","top1","top2"];
 return["right","bottom2","bottom1","left","top1","top2"];
}
function positions(n){
 if(n===4)return["top1","left","right","bottom1"];
 if(n===5)return["top1","top2","left","right","bottom1"];
 return["top1","top2","left","right","bottom1","bottom2"];
}
function orderOf(e){
 if(Array.isArray(e.seats)&&e.seats.length===e.present.length)return e.seats;
 if(Array.isArray(e.seatOrder)&&e.seatOrder.length===e.present.length)return e.seatOrder;
 return e.present;
}
function rotation(e){
 const order=orderOf(e),n=order.length;
 const first=Math.max(0,order.indexOf(e.firstMixer));
 const i=(first+e.rounds.length)%n;
 const mixer=order[i],sitting=[];
 if(n===5)sitting.push(mixer);
 if(n===6)sitting.push(mixer,order[(i+3)%n]);
 return{mixer,sitting,playing:order.filter(id=>!sitting.includes(id)),number:e.rounds.length+1};
}
function seat(pos,id,mode,rot){
 const out=rot?.sitting.includes(id),mix=rot?.mixer===id;
 const classes=["seat",pos==="right"?"first":"",id?"filled":"",out?"out":"",mix?"mixer":""].join(" ");
 const action=mode==="setup"?`onclick="seatTap('${pos}')"`:"";
 return `<div class="${classes}" data-pos="${pos}" ${action}>
 ${id?`<span class="name">${esc(name(id))}</span>`:`<span class="plus">＋</span><span class="hint">HIER ABLEGEN</span>`}
 ${mode==="setup"&&pos==="right"?'<span class="hint">★ 1. MISCHER</span>':""}
 ${mode==="game"&&id?`<span class="hint">${mix?"★ MISCHER":out?"SETZT AUS":"SPIELT"}</span>`:""}
 </div>`;
}
function table(n,assigned,mode="setup",rot=null){
 const ps=positions(n),s=p=>ps.includes(p)?seat(p,assigned[p],mode,rot):"";
 return `<div class="setup"><div class="layout">
 <div class="top">${s("top1")}${s("top2")}</div>
 <div class="left">${s("left")}</div>
 <div class="felt"><div class="cards">♣ ♥ ♠ ♦</div><strong>Doppelkopf</strong></div>
 <div class="right">${s("right")}</div>
 <div class="bottom">${s("bottom1")}${s("bottom2")}</div>
 </div></div>`;
}

/* Start und Spieler */

function home(){
 return `<div class="tiles">
 ${button("<b>♠</b>Spielabend","go('evening')","tile")}
 ${button("<b>♣</b>Spieler","go('players')","tile")}
 ${button("<b>🏆</b>Ergebnisse","showResults()","tile")}
 ${button("<b>€</b>Kasse","go('cash')","tile")}
 </div><div class="card"><h2>Willkommen im Kartenclub</h2>
 <div class="row"><span>Stammspieler</span><b>${db.players.filter(p=>!p.guest).length}</b></div>
 <div class="row"><span>Spielabende</span><b>${db.evenings.length}</b></div>
 <div class="row"><span>Gespielte Runden</span><b>${db.evenings.reduce((a,e)=>a+e.rounds.length,0)}</b></div>
 </div><div class="card"><h2>Letzte Spielabende</h2>
 ${[...db.evenings].reverse().slice(0,8).map(e=>`<div class="row"><span>${esc(e.date)} · ${e.rounds.length} Runden</span>${button("Öffnen",`openEvening('${e.id}')`)}</div>`).join("")||"Noch kein Spielabend."}
 </div>`;
}
function players(){
 return `<div class="card"><h2>Spieler</h2>${db.players.map(p=>`<div class="row"><span>${esc(p.name)} ${p.guest?"(Gast)":""}</span>${p.guest?button("Entfernen",`removeGuest('${p.id}')`,"danger"):"<small>Stammspieler</small>"}</div>`).join("")}</div>
 <div class="card"><h2>Gast hinzufügen</h2><form onsubmit="addGuest(event)">
 <input id="guestName" placeholder="Name" maxlength="60" required>
 <button class="primary">Hinzufügen</button></form></div>`;
}
function addGuest(ev){
 ev.preventDefault();const n=$("guestName").value.trim();
 if(!n)return;
 if(db.players.some(p=>p.name.toLowerCase()===n.toLowerCase()))return alert("Name existiert bereits.");
 db.players.push({id:uid(),name:n,guest:true});save();render();
}
function removeGuest(id){
 if(db.evenings.some(e=>e.present.includes(id)))return alert("Dieser Gast wird bereits in einem Spielabend verwendet.");
 if(confirm("Gast entfernen?")){db.players=db.players.filter(p=>p.id!==id);save();render()}
}

/* Spielabend erstellen */

function evening(){
 const e=current();
 if(!e)return `<div class="card"><h2>Neuer Spielabend</h2>
 <form onsubmit="createEvening(event)">
 <label>Datum</label><input type="date" id="date" value="${new Date().toLocaleDateString("sv-SE")}" required>
 <h3>Anwesende Spieler</h3>
 ${db.players.map(p=>`<label class="check"><input type="checkbox" name="present" value="${p.id}" ${p.guest?"":"checked"}>${esc(p.name)}</label>`).join("")}
 <button class="primary">Weiter zum Kartentisch</button></form></div>
 <div class="card"><h2>Vergangene Abende</h2>
 ${[...db.evenings].reverse().map(x=>`<div class="row"><span>${esc(x.date)}</span>${button("Öffnen",`openEvening('${x.id}')`)}</div>`).join("")||"Noch keine Spielabende."}</div>`;
 const rot=rotation(e),order=orderOf(e),assigned={};
 sequence(order.length).forEach((p,i)=>assigned[p]=order[i]);
 const t=totals(e);
 const events=[
 ...e.rounds.map((r,i)=>({kind:"round",r,i})),
 ...e.specials.map(s=>({kind:"special",s}))
 ].sort((a,b)=>(b.kind==="special"?b.s.at||0:b.r.at||0)-(a.kind==="special"?a.s.at||0:a.r.at||0));
 return `<div class="card">
 <div class="row"><h2>Spielabend ${esc(e.date)}</h2>${button("Zurück","eveningId=null;render()")}</div>
 <div class="row"><span class="pill">Runde ${rot.number}</span><b>★ ${esc(name(rot.mixer))} mischt</b></div>
 ${table(e.present.length,assigned,"game",rot)}
 <p class="muted">${rot.sitting.length?"Setzen aus: "+rot.sitting.map(id=>esc(name(id))).join(", "):"Alle vier spielen."}</p>
 <div class="actions">
 ${button("＋ Neue Runde","go('round')","primary")}
 ${button("♛ Hochzeit","go('hochzeit')")}
 ${button("Abrechnung","go('results')")}
 </div></div>
 <div class="card"><h2>Aktueller Stand</h2><div class="scroll"><table>
 <tr><th>Spieler</th><th>Tacken</th><th>€</th></tr>
 ${e.present.map(id=>`<tr><td>${esc(name(id))}</td><td>${t[id]>0?"+":""}${t[id]}</td><td class="${t[id]>=0?"good":"bad"}">${euro(t[id]*db.settings.tack)}</td></tr>`).join("")}
 </table></div></div>
 <div class="card"><h2>Spielverlauf</h2>
 ${events.map(x=>x.kind==="special"
 ?`<div class="row"><div><b>♛ Hochzeit – ${esc(name(x.s.player))}</b><div class="muted">+3 für ${esc(name(x.s.player))}, je −1 für die anderen · kein Mischerwechsel</div></div>${button("✕",`removeSpecial('${x.s.id}')`,"danger")}</div>`
 :`<div class="row"><div><b>Runde ${x.i+1}</b><div class="muted">${x.r.bock?"Bock ×2 · ":""}${x.r.solo?"Solo · ":""}${Object.entries(x.r.points||{}).map(([id,n])=>esc(name(id))+": "+n).join(" · ")}</div></div>${button("✕",`removeRound('${x.r.id}')`,"danger")}</div>`
 ).join("")||"Noch keine Einträge."}</div>`;
}
function createEvening(ev){
 ev.preventDefault();
 const present=[...document.querySelectorAll('input[name="present"]:checked')].map(x=>x.value);
 if(present.length<4||present.length>6)return alert("Bitte 4 bis 6 Spieler wählen.");
 pending={date:$("date").value,present,assigned:{}};selected=null;go("seating");
}
function seating(){
 if(!pending)return `<div class="card">Kein neuer Spielabend.</div>`;
 const used=Object.values(pending.assigned),n=pending.present.length;
 return `<div class="card"><h2>Sitzordnung festlegen</h2>
 <p class="muted">Namen auf die Plätze ziehen oder erst den Namen, dann den Platz antippen.</p>
 <div class="name-pool">${pending.present.map(id=>`<div class="chip ${used.includes(id)?"used":""} ${selected===id?"chosen":""}" data-player="${id}" onclick="choose('${id}')">⠿ ${esc(name(id))}</div>`).join("")}</div>
 ${table(n,pending.assigned)}
 <div class="row"><span class="pill">${used.length} von ${n} Plätzen besetzt</span><span class="muted">Rechts: 1. Mischer</span></div>
 <div class="actions">${button("Zurück","pending=null;go('evening')")}${button("Leeren","resetSeats()")}
 <button class="primary" ${used.length===n?"":"disabled"} onclick="finishEvening()">Spielabend starten</button></div></div>`;
}
function choose(id){selected=selected===id?null:id;render()}
function seatTap(pos){
 if(!pending)return;
 if(selected){
  const old=Object.keys(pending.assigned).find(p=>pending.assigned[p]===selected);
  const displaced=pending.assigned[pos];
  if(old)delete pending.assigned[old];
  pending.assigned[pos]=selected;
  if(old&&displaced&&displaced!==selected)pending.assigned[old]=displaced;
  selected=null;render();
 }else if(pending.assigned[pos]){
  selected=pending.assigned[pos];delete pending.assigned[pos];render();
 }
}
function resetSeats(){if(confirm("Sitzplätze leeren?")){pending.assigned={};selected=null;render()}}
document.addEventListener("pointerdown",ev=>{
 if(page!=="seating")return;
 const chip=ev.target.closest(".chip");
 if(!chip||chip.classList.contains("used"))return;
 dragId=chip.dataset.player;dragStart=[ev.clientX,ev.clientY];
});
document.addEventListener("pointerup",ev=>{
 if(!dragId||!dragStart)return;
 const id=dragId,start=dragStart;dragId=null;dragStart=null;
 if(page!=="seating"||Math.hypot(ev.clientX-start[0],ev.clientY-start[1])<12)return;
 const slot=document.elementFromPoint(ev.clientX,ev.clientY)?.closest(".seat");
 if(slot){selected=id;seatTap(slot.dataset.pos)}
});
document.addEventListener("pointercancel",()=>{dragId=null;dragStart=null});
function finishEvening(){
 if(!pending)return;
 const seats=sequence(pending.present.length).map(p=>pending.assigned[p]);
 if(seats.some(x=>!x))return alert("Alle Plätze besetzen.");
 const e={id:uid(),date:pending.date,present:[...pending.present],seats,firstMixer:pending.assigned.right,rounds:[],specials:[],soloPlayers:[],payments:{}};
 db.evenings.push(e);eveningId=e.id;pending=null;save();go("evening");
}
function openEvening(id){eveningId=id;go("evening")}

/* Punkte inklusive Sonderbuchungen */

function totals(e){
 const t={};e.present.forEach(id=>t[id]=0);
 e.rounds.forEach(r=>Object.entries(r.points||{}).forEach(([id,n])=>t[id]=(t[id]||0)+Number(n||0)));
 (e.specials||[]).forEach(s=>Object.entries(s.points||{}).forEach(([id,n])=>t[id]=(t[id]||0)+Number(n||0)));
 return t;
}

/* Normale Runde */

function round(){
 const e=current();if(!e)return "Kein Spielabend geöffnet.";
 const rot=rotation(e);
 return `<div class="card"><h2>Runde ${rot.number} erfassen</h2>
 <p>Mischer: <b>${esc(name(rot.mixer))}</b></p>
 <h3>Die zwei Gewinner auswählen</h3>
 <div class="winners">${rot.playing.map(id=>`<button class="winner" id="win_${id}" onclick="toggleWinner('${id}')">${esc(name(id))}</button>`).join("")}</div>
 <label>Gewonnene Tacken je Gewinner</label>
 <input id="points" type="number" min="0" step="1" value="1" oninput="previewRound()">
 <label class="check"><input id="bock" type="checkbox" onchange="previewRound()">Bockrunde ×2</label>
 <label class="check"><input id="solo" type="checkbox" onchange="toggleSolo()">Solo gespielt</label>
 <div id="soloFields" style="display:none">
 <label>Solospieler</label><select id="soloPlayer"><option value="">Bitte wählen</option>${rot.playing.map(id=>`<option value="${id}">${esc(name(id))}</option>`).join("")}</select>
 <p class="muted">Vorläufig werden bei Solo weiterhin vier Einzelwerte eingetragen.</p>
 ${rot.playing.map((id,i)=>`<label>${esc(name(id))}: Solo-Tacken</label><input type="number" step="1" id="sv${i}" value="0" oninput="previewRound()">`).join("")}
 </div>
 <div class="preview" id="preview"></div>
 <div class="actions">${button("Abbrechen","go('evening')")}${button("Runde speichern","saveRound()","primary")}</div>
 </div>`;
}
function toggleWinner(id){
 if(winners.includes(id))winners=winners.filter(x=>x!==id);
 else{if(winners.length===2)winners.shift();winners.push(id)}
 previewRound();
}
function toggleSolo(){
 $("soloFields").style.display=$("solo").checked?"block":"none";
 previewRound();
}
function calcRound(){
 const e=current(),ids=rotation(e).playing,points={};
 const bock=$("bock").checked,solo=$("solo").checked;
 let soloPlayer=null;
 if(solo){
  soloPlayer=$("soloPlayer").value;
  if(!ids.includes(soloPlayer))throw Error("Solospieler auswählen.");
  const values=ids.map((_,i)=>Number($("sv"+i).value));
  if(values.some(n=>!Number.isInteger(n))||values.reduce((a,b)=>a+b,0)!==0)throw Error("Solo-Werte müssen ganze Zahlen sein und zusammen 0 ergeben.");
  ids.forEach((id,i)=>points[id]=values[i]*(bock?2:1));
 }else{
  if(winners.length!==2)throw Error("Genau zwei Gewinner auswählen.");
  const n=Number($("points").value);
  if(!Number.isInteger(n)||n<0)throw Error("Gültige Tackenzahl eingeben.");
  ids.forEach(id=>points[id]=(winners.includes(id)?n:-n)*(bock?2:1));
 }
 return{points,bock,solo,soloPlayer};
}
function previewRound(){
 const e=current();if(!e||!$("preview"))return;
 rotation(e).playing.forEach(id=>{
  const el=$("win_"+id);

function calcSolo(){const e=current(),ids=rotation(e).playing;if(!ids.includes(chosenSolo))throw Error('Solospieler auswählen.');const n=Number($('soloPoints').value);if(!Number.isInteger(n)||n<0)throw Error('Gültige Tackenzahl eingeben.');const bock=bockBefore(e),won=$('soloWon').value==='yes',points={};ids.forEach(id=>points[id]=(id===chosenSolo?(won?3:-3):(won?-1:1))*n*(bock?2:1));return {points,bock,solo:true,soloPlayer:chosenSolo,soloType:$('soloType').value,soloWon:won,triggers:selectedTriggers()}}
function previewSolo(){const e=current();if(!e||!$('soloPreview'))return;rotation(e).playing.forEach(id=>{const el=$('solo_'+id);if(el)el.classList.toggle('selected',chosenSolo===id)});try{const r=calcSolo();$('soloPreview').innerHTML='<h3>Automatische Verteilung</h3>'+Object.entries(r.points).map(([id,n])=>`<div class="row"><span>${esc(name(id))}</span><b class="${n>=0?'good':'bad'}">${n>0?'+':''}${n} Tacken</b></div>`).join('')}catch(err){$('soloPreview').innerHTML=`<p class="muted">${esc(err.message)}</p>`}}
function saveSolo(){const e=current();if(!assertOpen(e))return;let r;try{r=calcSolo()}catch(err){return alert(err.message)}const rot=rotation(e);e.rounds.push({id:uid(),at:Date.now(),...r,mixer:rot.mixer,playing:[...rot.playing],sitting:[...rot.sitting]});e.soloPlayers=[...new Set(e.rounds.filter(x=>x.solo).map(x=>x.soloPlayer))];chosenSolo=null;save();go('evening')}
function hochzeit(){const e=current();if(!assertOpen(e))return '<div class="card">Abend abgeschlossen.</div>';const rot=rotation(e);return `<div class="card"><h2>♛ Hochzeit erfassen</h2><p class="muted">Sonderbuchung vor der nächsten Runde. Kein Mischerwechsel. Ein Tipp auf den Namen bucht sofort.</p><h3>Wer hat die beiden Re-Damen?</h3><div class="winners">${rot.playing.map(id=>`<button class="winner" onclick="chooseHochzeit('${id}')">${esc(name(id))}</button>`).join('')}</div>${button('Abbrechen',"go('evening')")}</div>`}
function chooseHochzeit(id){const e=current();if(!assertOpen(e))return;const rot=rotation(e);if(!rot.playing.includes(id))return;const points={};rot.playing.forEach(p=>points[p]=p===id?3:-1);e.specials.push({id:uid(),type:'hochzeit',at:Date.now(),player:id,points,playing:[...rot.playing],mixer:rot.mixer,beforeRound:rot.number});save();go('evening')}
function removeSpecial(id){const e=current();if(!assertOpen(e)||!confirm('Hochzeit-Sonderbuchung löschen?'))return;e.specials=e.specials.filter(s=>s.id!==id);save();render()}
function removeRound(id){const e=current();if(!assertOpen(e)||!confirm('Runde löschen? Die Bockfolge wird anschließend neu berechnet.'))return;e.rounds=e.rounds.filter(r=>r.id!==id);e.soloPlayers=[...new Set(e.rounds.filter(x=>x.solo).map(x=>x.soloPlayer))];save();render()}
function outstandingByPlayer(){
 const out=new Map();
 db.evenings.forEach(e=>dueRows(e).forEach(r=>{const rest=Math.max(0,Math.round((r.fee-paidAmount(e,r.id))*100)/100);if(rest>0.001)out.set(r.id,Math.round(((out.get(r.id)||0)+rest)*100)/100)}));
 return [...out].map(([id,amount])=>({id,amount})).sort((a,b)=>b.amount-a.amount);
}
function recordPayment(e,id,amount){
 e.payments=e.payments||{};e.payments[id]=e.payments[id]||[];
 e.payments[id].push({id:uid(),at:Date.now(),amount:Math.round(amount*100)/100});
}
function payEveningFull(id){
 const e=current();if(!e)return;const r=dueRows(e).find(x=>x.id===id);if(!r)return;
 const rest=Math.max(0,Math.round((r.fee-paidAmount(e,id))*100)/100);
 if(rest<=0)return;
 recordPayment(e,id,rest);save();render();
}
function payEveningPartial(id){
 const e=current();if(!e)return;const r=dueRows(e).find(x=>x.id===id);if(!r)return;
 const rest=Math.max(0,Math.round((r.fee-paidAmount(e,id))*100)/100);
 const input=$('partial_'+id);if(!input)return;
 const amount=Math.round(Number(input.value.replace(',','.'))*100)/100;
 if(!Number.isFinite(amount)||amount<=0||amount>rest)return alert('Bitte einen gültigen Teilbetrag bis '+euro(rest)+' eingeben.');
 recordPayment(e,id,amount);save();render();
}
function payAllPlayer(id){
 const owed=outstandingByPlayer().find(x=>x.id===id);if(!owed)return;
 db.evenings.forEach(e=>{const r=dueRows(e).find(x=>x.id===id);if(!r)return;const rest=Math.max(0,Math.round((r.fee-paidAmount(e,id))*100)/100);if(rest>0)recordPayment(e,id,rest)});
 save();render();
}
function payPartialPlayer(id){
 const owed=outstandingByPlayer().find(x=>x.id===id);if(!owed)return;
 const input=$('totalPartial_'+id);if(!input)return;
 let remaining=Math.round(Number(input.value.replace(',','.'))*100)/100;
 if(!Number.isFinite(remaining)||remaining<=0||remaining>owed.amount)return alert('Bitte einen gültigen Betrag bis '+euro(owed.amount)+' eingeben.');
 // Älteste offene Spielabende zuerst begleichen.
 const ordered=[...db.evenings].sort((a,b)=>String(a.date).localeCompare(String(b.date)));
 for(const e of ordered){const r=dueRows(e).find(x=>x.id===id);if(!r)continue;const rest=Math.max(0,Math.round((r.fee-paidAmount(e,id))*100)/100);const part=Math.min(rest,remaining);if(part>0){recordPayment(e,id,part);remaining=Math.round((remaining-part)*100)/100}if(remaining<=0)break}
 save();render();
}
function showDebt(id){window.debtPlayer=id;go('debt')}
function debt(){
 const id=window.debtPlayer,owed=outstandingByPlayer().find(x=>x.id===id);
 if(!owed)return `<div class="card"><h2>Keine offenen Zahlungen</h2>${button('Zurück',"go('home')")}</div>`;
 return `<div class="card"><h2>Offene Zahlung · ${esc(name(id))}</h2><div class="big bad">${euro(owed.amount)}</div><p class="muted">Gesamtschuld aus allen Spielabenden. Ein Häkchen begleicht den vollständigen Betrag.</p>
 <label class="check"><input type="checkbox" onchange="if(this.checked)payAllPlayer('${id}')"> Bezahlt – gesamte Schuld</label>
 <label>Teil bezahlt (€)</label><div class="actions"><input id="totalPartial_${id}" type="number" step="0.01" min="0.01" max="${owed.amount.toFixed(2)}" placeholder="Betrag eingeben" style="flex:2;min-width:120px"><button class="primary" onclick="payPartialPlayer('${id}')">Teilzahlung buchen</button></div>
 <p class="mini">Teilzahlungen werden den ältesten offenen Spielabenden zuerst zugeordnet.</p>${button('Zurück',"go('home')")}</div>`;
}
function results(){
 const e=current();if(!e)return '<div class="card">Kein Spielabend geöffnet.</div>';
 const t=totals(e),rows=dueRows(e);
 const sum=rows.reduce((a,x)=>a+x.fee,0);
 const received=rows.reduce((a,x)=>a+paidAmount(e,x.id),0);
 const body=rows.map(x=>{
  const game=x.present?t[x.id]*db.settings.tack:null;
  const start=x.present?db.settings.startFee:null;
  const solo=x.present?(soloCount(e,x.id)?0:db.settings.soloFee):null;
  const paid=paidAmount(e,x.id),rest=Math.max(0,Math.round((x.fee-paid)*100)/100);
  return `<tr><td>${esc(name(x.id))}${x.present?'':'<small> (abwesend)</small>'}</td>
   <td class="${game===null?'':game>=0?'good':'bad'}">${game===null?'–':(game>0?'+':'')+euro(game)}</td>
   <td>${start===null?'–':euro(start)}</td><td>${solo===null?'–':euro(solo)}</td>
   <td><b>${euro(x.fee)}</b></td><td>${euro(paid)}</td><td>${euro(rest)}</td>
   <td>${!x.present?(rest>0?'Automatisch offen':'✓ Bezahlt'):rest>0?`<label class="check"><input type="checkbox" onchange="if(this.checked)payEveningFull('${x.id}')"> Bezahlt</label>`:'✓ Bezahlt'}</td>
   <td>${!x.present?'–':rest>0?`<div class="actions" style="flex-wrap:nowrap"><input id="partial_${x.id}" type="number" min="0.01" max="${rest.toFixed(2)}" step="0.01" placeholder="€" style="min-width:80px;width:90px"><button onclick="payEveningPartial('${x.id}')">Buchen</button></div>`:'–'}</td></tr>`;
 }).join('');
 return `<div class="card"><h2>Abrechnung ${esc(e.date)}</h2>
 <p class="mini">Gastgeber: ${esc(name(e.host))} · ${isClosed(e)?'Abgeschlossen':'Noch offen'} · Start ${stamp(e.startedAt)} · Ende ${stamp(e.endedAt)}</p>
 <div class="scroll"><table><tr><th>Spieler</th><th>Spiel +/−</th><th>Start</th><th>Solo</th><th>Gesamt</th><th>Bezahlt €</th><th>Offen</th><th>Bezahlt ✓</th><th>Teil bezahlt €</th></tr>${body}</table></div>
 <p class="muted">Nur Spielverluste erhöhen die Zahlung an die Kasse. Abwesende zahlen den höchsten Gesamtbetrag eines anwesenden Spielers.</p>
 <div class="preview"><h3>Kasse</h3>
 <div class="row"><span>Gesamt (Soll)</span><b>${euro(sum)}</b></div>
 <div class="row"><span>Bereits bezahlt</span><b class="good">${euro(received)}</b></div>
 <div class="row"><span>Noch offen</span><b class="bad">${euro(Math.max(0,sum-received))}</b></div></div>
 <div class="actions">${button('Zurück',"go('evening')")}${!isClosed(e)?button('Spielabend beenden','closeEvening()','danger'):''}</div></div>`;
}
function cashTransactions(){
 const tx=db.cash.map(c=>({id:c.id,at:c.at||0,amount:Number(c.amount||0),text:c.text||'Freie Buchung',kind:'free'}));
 db.evenings.forEach(e=>Object.entries(e.payments||{}).forEach(([id,arr])=>arr.forEach(p=>tx.push({id:p.id,at:p.at||0,amount:Number(p.amount||0),text:name(id)+' · Spielabend '+e.date,kind:'payment',player:id,evening:e.id}))));
 return tx.sort((a,b)=>b.at-a.at);
}
function cash(){
 const tx=cashTransactions(),years=[...new Set([...tx.map(t=>new Date(t.at||Date.now()).getFullYear()),...db.evenings.map(e=>Number((e.date||'').slice(0,4)))].filter(Number.isFinite))].sort((a,b)=>b-a);
 const selected=window.cashYear||'all';
 const filtered=tx.filter(t=>selected==='all'||String(new Date(t.at||Date.now()).getFullYear())===selected);
 const income=filtered.filter(t=>t.amount>0).reduce((a,t)=>a+t.amount,0),expenses=-filtered.filter(t=>t.amount<0).reduce((a,t)=>a+t.amount,0);
 const balance=tx.reduce((a,t)=>a+t.amount,0);
 const dues=db.evenings.filter(e=>selected==='all'||String((e.date||'').slice(0,4))===selected).reduce((a,e)=>a+dueRows(e).reduce((b,r)=>b+Math.max(0,r.fee-paidAmount(e,r.id)),0),0);
 const e=current();
 return `<div class="card"><h2>Kasse</h2><p class="muted">Tatsächlicher Kassenbestand aus erfassten Ein- und Auszahlungen</p><div class="big">${euro(balance)}</div></div>
 <div class="card"><h3>Jahresübersicht</h3><label>Zeitraum</label><select onchange="window.cashYear=this.value;render()"><option value="all" ${selected==='all'?'selected':''}>Alle Jahre</option>${years.map(y=>`<option value="${y}" ${selected===String(y)?'selected':''}>${y}</option>`).join('')}</select>
 <div class="row"><span>Einnahmen</span><b class="good">${euro(income)}</b></div><div class="row"><span>Ausgaben</span><b class="bad">${euro(expenses)}</b></div><div class="row"><span>Saldo im gewählten Zeitraum</span><b>${euro(income-expenses)}</b></div><div class="row"><span>Noch offene Spielabend-Beiträge</span><b>${euro(dues)}</b></div></div>
 ${e?`<div class="card"><h3>Zahlungen – ${esc(e.date)}</h3>${dueRows(e).map(x=>{const paid=paidAmount(e,x.id),rest=Math.max(0,x.fee-paid);return `<div class="row"><div><b>${esc(name(x.id))}</b><div class="mini">Soll ${euro(x.fee)} · Bezahlt ${euro(paid)} · Offen ${euro(rest)}</div></div>${rest>0?button('Zahlung',`payDialog('${x.id}')`,'primary'):'✓ Bezahlt'}</div>`}).join('')}</div>`:`<div class="card"><p>Öffne einen Spielabend, um die einzelnen Zahlungen zu erfassen.</p></div>`}
 <div class="card"><h3>Ein- oder Ausgabe buchen</h3><form onsubmit="addCash(event)"><label>Beschreibung</label><input id="ct" maxlength="150" placeholder="z. B. Getränke oder Spende" required><label>Betrag in €</label><input id="ca" type="number" step=".01" min="0.01" required><label>Art</label><select id="cashType"><option value="income">Einnahme (+)</option><option value="expense">Ausgabe (−)</option></select><button class="primary">Buchen</button></form></div>
 <div class="card"><h3>Kassenbuch · Zahlungsverlauf</h3>${filtered.length?filtered.map(t=>`<div class="row"><div><b>${esc(t.text)}</b><div class="mini">${stamp(t.at)} · ${t.kind==='payment'?'Spielerzahlung':'Freie Buchung'}</div></div><b class="${t.amount>=0?'good':'bad'}">${t.amount>0?'+':''}${euro(t.amount)}</b></div>`).join(''):'Noch keine Buchungen in diesem Zeitraum.'}</div>`;
}
function addCash(ev){
 ev.preventDefault();const label=$('ct').value.trim(),value=Number($('ca').value),type=$('cashType').value;
 if(!label||!Number.isFinite(value)||value<=0)return alert('Bitte einen gültigen positiven Betrag eingeben.');
 db.cash.push({id:uid(),at:Date.now(),text:label,amount:Math.round(value*100)/100*(type==='expense'?-1:1)});
 save();render();
}

function payDialog(id){const e=current();if(!e)return;const row=dueRows(e).find(x=>x.id===id);if(!row)return;const rest=Math.max(0,row.fee-paidAmount(e,id));if(rest<=0)return;const raw=prompt(`Zahlung von ${name(id)} in € (noch ${euro(rest)} offen):`,rest.toFixed(2).replace('.',','));if(raw===null)return;const amount=Number(raw.replace(',','.'));if(!Number.isFinite(amount)||amount<=0||amount>rest+.001)return alert('Bitte einen Betrag zwischen 0 und dem offenen Betrag eingeben.');e.payments=e.payments||{};e.payments[id]=e.payments[id]||[];e.payments[id].push({id:uid(),at:Date.now(),amount:Math.round(amount*100)/100});save();render()}
function showResults(){if(db.evenings.length){eveningId=db.evenings[db.evenings.length-1].id;go('results')}else go('evening')}
function home(){const debts=outstandingByPlayer();return `<div class="tiles">${button('<b>♠</b>Spielabend',"go('evening')",'tile')}${button('<b>♣</b>Spieler',"go('players')",'tile')}${button('<b>🏆</b>Ergebnisse','showResults()','tile')}${button('<b>€</b>Kasse',"go('cash')",'tile')}</div>
${debts.length?`<div class="card"><h2>Offene Zahlungen</h2><p class="muted">Gesamtschuld aus allen Spielabenden · Namen antippen, um die Zahlung zu erfassen.</p>${debts.map(d=>`<div class="row"><b>${esc(name(d.id))}</b><div class="actions"><b class="bad">${euro(d.amount)}</b>${button('Bezahlen',`showDebt('${d.id}')`,'primary')}</div></div>`).join('')}</div>`:''}
<div class="card"><h2>Willkommen im Kartenclub</h2><div class="row"><span>Stammspieler</span><b>${db.players.filter(p=>!p.guest).length}</b></div><div class="row"><span>Spielabende</span><b>${db.evenings.length}</b></div><div class="row"><span>Gespielte Runden</span><b>${db.evenings.reduce((a,e)=>a+e.rounds.length,0)}</b></div></div>
<div class="card"><h2>Letzte Spielabende</h2>${[...db.evenings].reverse().slice(0,8).map(e=>`<div class="row"><span>${esc(e.date)} · ${esc(name(e.host))} · ${e.endedAt?'Abgeschlossen':'Offen'}</span>${button('Öffnen',`openEvening('${e.id}')`)}</div>`).join('')||'Noch kein Spielabend.'}</div>`}


render();
</script>
</body>
</html>

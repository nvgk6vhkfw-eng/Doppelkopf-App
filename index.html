function outstandingByPlayer(){
 const out=new Map();
 db.evenings.forEach(e=>dueRows(e).forEach(r=>{const rest=Math.max(0,Math.round((r.fee-paidAmount(e,r.id))*100)/100);if(rest>0.001)out.set(r.id,Math.round(((out.get(r.id)||0)+rest)*100)/100)}));
 return [...out].map(([id,amount])=>({id,amount})).sort((a,b)=>b.amount-a.amount);
}
function recordPayment(e,id,amount){
 if(!Number.isFinite(amount)||amount<=0)return;
 e.payments=e.payments||{};e.payments[id]=e.payments[id]||[];
 e.payments[id].push({id:uid(),at:Date.now(),amount:Math.round(amount*100)/100});
}
function payEveningFull(id){
 const e=current();if(!e)return;const r=dueRows(e).find(x=>x.id===id);if(!r)return;
 const rest=Math.max(0,Math.round((r.fee-paidAmount(e,id))*100)/100);
 if(rest<=0)return;
 recordPayment(e,id,rest);save();render();
}
function payAllPlayer(id){
 const owed=outstandingByPlayer().find(x=>x.id===id);if(!owed)return;
 db.evenings.forEach(e=>{const r=dueRows(e).find(x=>x.id===id);if(!r)return;const rest=Math.max(0,Math.round((r.fee-paidAmount(e,id))*100)/100);if(rest>0)recordPayment(e,id,rest)});
 save();window.debtPlayer=null;go('home');
}
function debt(){
 const id=window.debtPlayer,owed=outstandingByPlayer().find(x=>x.id===id);
 if(!owed)return `<div class="card"><h2>Keine offenen Zahlungen</h2>${button('Zurück',"go('home')")}</div>`;
 return `<div class="card"><h2>Offene Zahlung · ${esc(name(id))}</h2><div class="big bad">${euro(owed.amount)}</div><p class="muted">Gesamtschuld aus allen Spielabenden. Ein Häkchen begleicht den vollständigen Betrag.</p>
 <label class="check"><input type="checkbox" onchange="if(this.checked)payAllPlayer('${id}')"> Bezahlt – gesamte Schuld</label>${button('Zurück',"go('home')")}</div>`;
}
function results(){
 const e=current();if(!e)return '<div class="card">Kein Spielabend geöffnet.</div>';
 const t=totals(e),rows=dueRows(e);
 const sum=rows.reduce((a,x)=>a+x.fee,0);
 const received=rows.reduce((a,x)=>a+paidAmount(e,x.id),0);
 const body=rows.map(x=>{
  const game=x.present?t[x.id]*db.settings.tack:null;
  const solo=x.present?(soloCount(e,x.id)?0:db.settings.soloFee):null;
  const paid=paidAmount(e,x.id),rest=Math.max(0,Math.round((x.fee-paid)*100)/100);
  const status=e.historical?'✓':!x.present?(rest>0?'Offen':'✓'):rest>0?`<label class="paid-check" title="Vollständig bezahlt"><input type="checkbox" aria-label="${esc(name(x.id))} vollständig bezahlt" onchange="if(this.checked)payEveningFull('${x.id}')"></label>`:'✓';
  return `<tr><td class="bill-name">${esc(name(x.id))}${x.present?'':'<small class="bill-absent">abwesend</small>'}</td>
   <td class="${game===null?'':game>=0?'good':'bad'}">${game===null?'–':(game>0?'+':'')+euro(game)}</td>
   <td>${solo===null?'–':euro(solo)}</td>
   <td class="bill-total"><b>${euro(x.fee)}</b></td>
   <td class="bill-paid">${status}</td></tr>`;
 }).join('');
 return `<div class="card"><h2>Abrechnung ${esc(e.date)}</h2>
 <p class="mini">${e.historical?'Historischer Nachtrag · bereits bezahlt · ':''}Gastgeber: ${esc(name(e.host))} · ${isClosed(e)?'Abgeschlossen':'Noch offen'} · Start ${stamp(e.startedAt)} · Ende ${stamp(e.endedAt)}</p>
 <div class="bill-caption">Startgebühr ${euro(db.settings.startFee)} pro anwesendem Spieler bereits im Gesamtbetrag enthalten.</div>
 <div class="bill-wrap"><table class="bill-table"><thead><tr><th>Spieler</th><th>Spiel +/−</th><th>Solo</th><th>Gesamt</th><th title="Vollständig bezahlt">✓</th></tr></thead><tbody>${body}</tbody></table></div>
 <p class="muted">Nur Spielverluste erhöhen die Zahlung an die Kasse. Abwesende zahlen den höchsten Gesamtbetrag eines anwesenden Spielers.</p>
 <div class="preview"><h3>Kasse</h3>
 <div class="row"><span>Gesamt (Soll)</span><b>${euro(sum)}</b></div>
 <div class="row"><span>${e.historical?'Historisch beglichen':'Bereits bezahlt'}</span><b class="good">${euro(received)}</b></div>
 <div class="row"><span>Noch offen</span><b class="bad">${euro(Math.max(0,sum-received))}</b></div></div>
 <div class="actions">${button('Zurück',"go('evening')")}${!isClosed(e)?button(e.historical?'Nachtrag abschließen':'Spielabend beenden','closeEvening()','danger'):''}</div></div>`;
}

function finishHistoricalEvening(){
 const a=pending;if(!a)return;
 const e={id:uid(),date:a.date,host:a.host,startedAt:Date.now(),endedAt:null,present:[...a.present],seats:[...a.present],firstMixer:a.present[0],rounds:[],specials:[],soloPlayers:[],payments:{},historical:true,historicalMode:a.historicalMode};
 db.evenings.push(e);eveningId=e.id;pending=null;historicalSetup=false;historicalWinners=[];historicalActive=a.present.slice(0,4);save();go('evening');
}
function historicalSetActive(el){if(el.checked){if(historicalActive.length>=4){el.checked=false;return}historicalActive.push(el.value)}else historicalActive=historicalActive.filter(x=>x!==el.value);historicalWinners=historicalWinners.filter(x=>historicalActive.includes(x))}
function historicalPick(id){const max=historicalKind.includes('Solo')?1:2;historicalWinners=historicalWinners.includes(id)?historicalWinners.filter(x=>x!==id):historicalWinners.length<max?[...historicalWinners,id]:max===1?[id]:[historicalWinners[1],id];render()}
function historicalSetKind(kind){historicalKind=kind;historicalWinners=[];render()}
function historicalToggleBock(){historicalBock=!historicalBock;render()}
function historicalAmount(v){let n=Number(String(v||'').trim().replace(',','.'));return Number.isFinite(n)&&n>=0&&Math.round(n*100)===n*100?Math.round(n*100):NaN}
function historicalRoundEditor(e){
 const closed=isClosed(e),solo=historicalKind.includes('Solo'),items=['Normal','Hochzeit','Damen-Solo','Buben-Solo','Stilles Solo'];
 const active=e.present.length===4?e.present:e.present.filter(id=>document.querySelector('[name="hist_active_'+id+'"]')?.checked);
 const old=e.rounds.map((r,i)=>`<div class="row"><div><b>Runde ${i+1} · ${esc(r.soloType||r.historicalKind||'Normal')}${r.bock?' · Bock':''}</b><div class="mini">${Object.entries(r.points||{}).map(([id,n])=>esc(name(id))+' '+euro(n*db.settings.tack)).join(' · ')}</div></div>${closed?'':button('Löschen',`historicalRemoveRound(${i})`,'danger')}</div>`).join('');
 return `<div class="card hist-card"><h3>Einzelrunden nachtragen</h3><p class="mini">Zwei Gewinner auswählen, Gewinn pro Gewinner eingeben. Solo: Solospieler auswählen. Alle Beträge in Euro.</p>
 ${!closed?`<div class="hist-picks">${items.map(k=>`<button type="button" class="${historicalKind===k?'active':''}" onclick="historicalSetKind('${k}')">${k}</button>`).join('')}</div>
 ${e.present.length>4?`<p class="mini">Vier Spieler dieser Runde auswählen:</p><div class="hist-picks">${e.present.map(id=>`<label class="hist-choice"><input type="checkbox" name="hist_active_${id}" value="${id}" ${historicalActive.includes(id)?'checked':''} onchange="historicalSetActive(this)">${esc(name(id))}</label>`).join('')}</div>`:''}
 <p class="mini">${solo?'Solospieler auswählen':'Zwei Gewinner auswählen'}</p><div class="hist-picks">${e.present.map(id=>`<button type="button" class="${historicalWinners.includes(id)?'active':''}" onclick="historicalPick('${id}')">${esc(name(id))}</button>`).join('')}</div>
 ${solo?'<label class="hist-choice"><input type="checkbox" id="histSoloLost"> Solo verloren</label>':''}
 <label>${solo?'Betrag pro Gegenspieler (€)':'Gewinn pro Gewinner (€)'}</label><input id="histRoundAmount" inputmode="decimal" placeholder="z. B. 1,20">
 <button type="button" class="hist-bock ${historicalBock?'active':''}" onclick="historicalToggleBock()">Bock ${historicalBock?'✓':''}</button>
 <label>Notiz (freiwillig)</label><input id="histRoundNote" placeholder="Bemerkung zur Runde"><p id="histRoundError" class="bad"></p>
 <button class="primary" onclick="historicalSaveRound()">Runde speichern & weiter</button>`:'<p class="mini">Nachtrag abgeschlossen.</p>'}
 <details open><summary>Erfasste Runden (${e.rounds.length})</summary>${old||'<p class="muted">Noch keine Runden erfasst.</p>'}</details></div>`;
}
function historicalSaveRound(){
 const e=current();if(!e?.historical||isClosed(e))return;
 const solo=historicalKind.includes('Solo');const active=e.present.length===4?[...e.present]:[...historicalActive];
 const chosen=historicalWinners.filter(x=>active.includes(x));const amount=historicalAmount($('histRoundAmount')?.value);const error=m=>{$('histRoundError').textContent=m};
 if(active.length!==4)return error('Bitte genau vier aktive Spieler auswählen.');
 if(chosen.length!==(solo?1:2))return error(solo?'Bitte einen Solospieler auswählen.':'Bitte genau zwei Gewinner auswählen.');
 if(!Number.isFinite(amount)||amount<=0)return error('Bitte einen gültigen Eurobetrag größer 0 eingeben.');
 const cents={};active.forEach(id=>cents[id]=0);
 const lost=solo&&$('histSoloLost')?.checked;
 if(solo){active.forEach(id=>cents[id]=id===chosen[0]?(lost?-3:3)*amount:(lost?1:-1)*amount)}
 else active.forEach(id=>cents[id]=(chosen.includes(id)?1:-1)*amount);
 const points={};Object.entries(cents).forEach(([id,n])=>points[id]=n/100/db.settings.tack);
 e.rounds.push({id:uid(),at:Date.now(),historical:true,points,playing:active,sitting:e.present.filter(x=>!active.includes(x)),solo,soloPlayer:solo?chosen[0]:null,soloType:solo?historicalKind:null,soloWon:solo?!lost:null,historicalKind,historicalNote:$('histRoundNote')?.value.trim()||'',bock:historicalBock,bockFactor:historicalBock?2:1,triggers:[]});
 e.soloPlayers=[...new Set(e.rounds.filter(r=>r.solo&&r.soloPlayer).map(r=>r.soloPlayer))];historicalWinners=[];historicalKind='Normal';historicalBock=false;save();render();
}
function historicalRemoveRound(i){const e=current();if(!e?.historical||isClosed(e)||!e.rounds[i])return;if(!confirm('Diese historische Runde löschen?'))return;e.rounds.splice(i,1);e.soloPlayers=[...new Set(e.rounds.filter(r=>r.solo&&r.soloPlayer).map(r=>r.soloPlayer))];save();render()}
function historicalSummaryEditor(e){
 const r=e.rounds[0],existing=r?.historicalSummaryCents||{};
 return `<div class="card hist-card"><h3>Endergebnisse nachtragen</h3><p class="mini">Endstand in Euro je Spieler, mit Plus oder Minus. Summe muss 0,00 € ergeben. Keine Kassenbuchung, keine erfundenen Solo- oder Bockstatistiken.</p>
 ${e.present.map(id=>`<label>${esc(name(id))}</label><input inputmode="decimal" name="hist_summary_${id}" value="${existing[id]!==undefined?(existing[id]/100).toFixed(2).replace('.',','):''}" placeholder="z. B. -2,40" ${isClosed(e)?'disabled':''}>`).join('')}
 <p id="histSummaryError" class="bad"></p>${!isClosed(e)?'<button class="primary" onclick="historicalSaveSummary()">Endergebnisse speichern</button>':'<p class="mini">Nachtrag abgeschlossen.</p>'}</div>`;
}
function historicalSaveSummary(){const e=current();if(!e?.historical||e.historicalMode!=='summary'||isClosed(e))return;const cents={},points={};let sum=0;
 for(const id of e.present){const raw=document.querySelector(`[name="hist_summary_${id}"]`)?.value.trim()||'0';const n=Number(raw.replace(',','.'));if(!Number.isFinite(n)||Math.abs(n)>100000||Math.abs(n*100-Math.round(n*100))>1e-6){$('histSummaryError').textContent='Bitte gültige Eurobeträge mit maximal zwei Nachkommastellen eingeben.';return}cents[id]=Math.round(n*100);sum+=cents[id];points[id]=cents[id]/100/db.settings.tack}
 if(sum!==0){$('histSummaryError').textContent='Gewinne und Verluste müssen zusammen 0,00 € ergeben. Differenz: '+euro(sum/100);return}
 e.rounds=[{id:e.rounds[0]?.id||uid(),at:Date.now(),historical:true,historicalSummaryCents:cents,points,playing:[...e.present],sitting:[],solo:false,historicalKind:'Endergebnisse'}];e.soloPlayers=[];save();render();
}

let historicalEditIndex=-1;
let historicalMode='rounds';let historicalActive=[];let historicalWinners=[];let historicalKind='Normal';let historicalBock=false;
function historicalEditor(e){
 const last=e.rounds.length?e.rounds[e.rounds.length-1].historicalCents||{}:{};
 const previous={};e.present.forEach(id=>previous[id]=Number(last[id]||0));
 const edit=historicalEditIndex>=0&&historicalEditIndex<e.rounds.length?historicalEditIndex:-1;
 const base=edit>=0?(edit?e.rounds[edit-1].historicalCents||{}:{}):previous;
 const values=edit>=0?e.rounds[edit].historicalCents||{}:{};
 const list=e.rounds.map((r,i)=>`<div class="hist-entry"><div class="hist-entry-head"><b>Zeile ${i+1}</b><span class="mini">${esc(r.historicalNote||'')}</span><button type="button" class="hist-small" onclick="editHistoricalRow(${i})">Bearbeiten</button></div><div class="hist-values">${e.present.map(id=>`<span><small>${esc(name(id))}</small><b>${euro(Number(r.historicalCents?.[id]||0)/100)}</b></span>`).join('')}</div></div>`).join('');
 return `<div class="card hist-card"><div class="row"><h3>Papierliste · ${e.rounds.length} Zeilen</h3><span class="pill">Ohne Kassenbuchung</span></div>
 <p class="mini">Laufende Eurostände vom Spielzettel übernehmen. 560 = 5,60 € · 5,60 = 5,60 €. Leere Felder behalten den vorherigen Stand.</p>
 ${isClosed(e)&&edit<0?'<p class="pill">Nachtrag abgeschlossen · Zeilen können zur Korrektur bearbeitet werden.</p>':''}
 ${(!isClosed(e)||edit>=0)?`<form onsubmit="saveHistoricalRow(event)"><div class="hist-form-head"><b>${edit>=0?'Zeile '+(edit+1)+' korrigieren':'Neue Zeile '+(e.rounds.length+1)}</b>${edit>=0?'<button type="button" onclick="cancelHistoricalEdit()">Abbrechen</button>':''}</div>
 <div class="hist-inputs">${e.present.map(id=>`<label class="hist-input"><span>${esc(name(id))}</span><input inputmode="decimal" aria-label="${esc(name(id))}" name="hist_${id}" placeholder="${String(Number(base[id]||0))}" value="${edit>=0?esc(String(Number(values[id]||0))):''}" autocomplete="off"><small>Vorher ${euro(Number(base[id]||0)/100)}</small></label>`).join('')}</div>
 <label>Notiz (optional)</label><input id="historicalNote" placeholder="Bock, Solo, Hochzeit …" value="${edit>=0?esc(e.rounds[edit].historicalNote||''):''}">
 <div class="hist-balance" id="histBalance">${edit>=0?'Korrektur':'Nächste Zeile'} · ${e.present.length} Spieler</div><p id="histError" class="bad" role="alert"></p>
 <button class="primary" style="width:100%">${edit>=0?'Korrektur speichern':'Zeile speichern & weiter'}</button>
 ${edit>=0?`<button type="button" class="hist-delete" onclick="deleteHistoricalRow(${edit})">Diese Zeile löschen</button>`:''}</form>`:''}
 <details class="hist-history" ${e.rounds.length<=3?'open':''}><summary>Übertragene Zeilen (${e.rounds.length})</summary>${list||'<p class="muted">Noch keine Zeilen erfasst.</p>'}</details>
 </div>`;
}
function editHistoricalRow(i){const e=current();if(!e?.historical||i<0||i>=e.rounds.length)return;historicalEditIndex=i;render();document.querySelector('.hist-form-head')?.scrollIntoView({block:'nearest'});}
function cancelHistoricalEdit(){historicalEditIndex=-1;render()}
function deleteHistoricalRow(i){const e=current();if(!e?.historical||i<0||i>=e.rounds.length)return;if(!confirm('Zeile '+(i+1)+' wirklich löschen? Die folgenden Zeilen bleiben als Eurostände erhalten.'))return;e.rounds.splice(i,1);rebuildHistoricalPoints(e);historicalEditIndex=-1;save();render()}
function rebuildHistoricalPoints(e){let previous={};for(const r of e.rounds){const points={};for(const id of e.present){const now=Number(r.historicalCents?.[id]||0);points[id]=(now-Number(previous[id]||0))/100/db.settings.tack;}r.points=points;previous=r.historicalCents||{};}}
function saveHistoricalRow(ev){ev.preventDefault();const e=current();if(!e?.historical)return;const edit=historicalEditIndex>=0&&historicalEditIndex<e.rounds.length?historicalEditIndex:-1;if(isClosed(e)&&edit<0)return;
 const prior=edit>=0?(edit?e.rounds[edit-1].historicalCents||{}:{}):(e.rounds.length?e.rounds[e.rounds.length-1].historicalCents||{}:{});
 const cents={};try{for(const id of e.present)cents[id]=parseHistoricalCents(document.querySelector(`[name="hist_${id}"]`)?.value,Number(prior[id]||0));}catch(err){$('histError').textContent=err.message;return}
 const note=$('historicalNote')?.value.trim()||'';
 if(edit>=0){Object.assign(e.rounds[edit],{historicalCents:cents,historicalNote:note,solo:/solo/i.test(note),soloType:note});}
 else e.rounds.push({id:uid(),at:Date.now()+e.rounds.length,points:{},playing:[...e.present],sitting:[],historicalCents:cents,historicalNote:note,historical:true,solo:/solo/i.test(note),soloType:note});
 rebuildHistoricalPoints(e);historicalEditIndex=-1;save();render();}
function parseHistoricalCents(value,previous){
 const raw=String(value||'').trim().replace(/\s/g,'');if(!raw||raw==='–'||raw==='—'||raw==='-')return previous;
 // Papierwerte ohne Komma sind Cent: 560 = 5,60 EUR; mit Komma Euro: 5,60 = 5,60 EUR.
 const n=raw.includes(',')||raw.includes('.')?Number(raw.replace(',','.'))*100:Number(raw);
 if(!Number.isFinite(n)||Math.abs(n)>10000000)throw Error('Ungültiger Eurostand: '+raw);
 return Math.round(n);
}
function addHistoricalRow(ev){return saveHistoricalRow(ev)}
function undoHistoricalLast(){const e=current();if(!e||!e.historical||isClosed(e)||!e.rounds.length)return;e.rounds.pop();historicalEditIndex=-1;save();render()}
function cashOpening(){return Number(db.cashOpening?.amount||0)}
function cashCorrection(id){
 const c=db.cash.find(x=>x.id===id);if(!c||c.reversalOf||db.cash.some(x=>x.reversalOf===id))return;
 if(!confirm('Diese Buchung durch eine Gegenbuchung stornieren? Der Verlauf bleibt erhalten.'))return;
 db.cash.push({id:uid(),at:Date.now(),text:'Storno: '+(c.text||'Buchung'),amount:-Number(c.amount||0),reversalOf:id});save();render();openCashSettings();
}
function reversePlayerPayment(eid,pid,paymentId){
 const e=db.evenings.find(x=>x.id===eid);const arr=e?.payments?.[pid];const p=arr?.find(x=>x.id===paymentId);
 if(!p||Number(p.amount)<=0||arr.some(x=>x.reversalOf===paymentId))return alert('Diese Zahlung ist bereits storniert oder nicht verfügbar.');
 if(!confirm('Zahlung von '+euro(p.amount)+' für '+name(pid)+' vom '+e.date+' stornieren? Der Kassenbestand wird angepasst, die Originalbuchung bleibt erhalten.'))return;
 arr.push({id:uid(),at:Date.now(),amount:-Number(p.amount),reversalOf:paymentId});save();render();openCashSettings();
}
function openCashSettings(){const groups=document.querySelectorAll('.settings-group');if(groups[2])groups[2].open=true}
function addCashAdjustment(ev){ev.preventDefault();const amount=Number($('adjustAmount')?.value);const kind=$('adjustKind')?.value;const note=$('adjustNote')?.value.trim();
 if(!cashOpeningConfigured())return alert('Bitte zuerst den Anfangsbestand in der Kasse festlegen.');
 if(!Number.isFinite(amount)||amount<=0||!note)return alert('Bitte einen positiven Betrag und einen Grund angeben.');
 const signed=Math.round(amount*100)/100*(kind==='minus'?-1:1);
 if(!confirm('Kassenkorrektur '+euro(signed)+' buchen?'))return;
 db.cash.push({id:uid(),at:Date.now(),text:'Kassenkorrektur: '+note,amount:signed,correction:true});save();render();openCashSettings();
}
function cashManagement(){
 const issues=[];const paymentEntries=[];
 for(const e of db.evenings.filter(x=>!x.historical))for(const r of dueRows(e)){
  const arr=e.payments?.[r.id]||[];const paid=paidAmount(e,r.id);
  if(paid>r.fee+0.009)issues.push({e,r,paid,diff:paid-r.fee,arr});
  for(const p of arr)paymentEntries.push({e,r,p});
 }
 const issueHtml=issues.length?issues.map(({e,r,paid,diff,arr})=>`<div class="audit-entry"><b class="bad">⚠ ${esc(name(r.id))} · ${esc(e.date)}</b><div class="mini">Soll ${euro(r.fee)} · bezahlt ${euro(paid)} · Überzahlung ${euro(diff)}</div>${arr.map(p=>`<div class="row"><span>${stamp(p.at)} · ${p.amount>=0?'+':''}${euro(p.amount)}${p.reversalOf?' (Storno)':''}</span>${p.amount>0&&!arr.some(x=>x.reversalOf===p.id)?button('Zahlung stornieren',`reversePlayerPayment('${e.id}','${r.id}','${p.id}')`):''}</div>`).join('')}</div>`).join(''):'<p class="good">Keine Überzahlungen erkannt.</p>';
 const sorted=paymentEntries.sort((a,b)=>(b.p.at||0)-(a.p.at||0));
 const paymentHtml=sorted.length?sorted.map(({e,r,p})=>{const arr=e.payments?.[r.id]||[];return `<div class="row"><div><b>${esc(name(r.id))}</b><div class="mini">${esc(e.date)} · ${stamp(p.at)}${p.reversalOf?' · Storno':''}</div></div><b class="${p.amount>=0?'good':'bad'}">${p.amount>0?'+':''}${euro(p.amount)}</b>${p.amount>0&&!arr.some(x=>x.reversalOf===p.id)?button('Storno',`reversePlayerPayment('${e.id}','${r.id}','${p.id}')`):''}</div>`}).join(''):'<p class="muted">Noch keine Spielerzahlungen.</p>';
 const free=[...db.cash].sort((a,b)=>(b.at||0)-(a.at||0));
 return `<h3>Kassenprüfung</h3><p class="muted">Prüfhinweise werden aus den vorhandenen Spielabenden und Zahlungen neu berechnet. Keine automatische Löschung.</p>${issueHtml}<details><summary>Spielerzahlungen prüfen und stornieren (${sorted.length})</summary>${paymentHtml}</details><hr><h3>Kassenkorrektur</h3><p class="muted">Nur hier lassen sich nach der einmaligen Einrichtung Bestandsabweichungen nachvollziehbar korrigieren. Keine rückwirkende Änderung des Anfangsbestands.</p><form onsubmit="addCashAdjustment(event)"><label>Grund der Korrektur</label><input id="adjustNote" maxlength="150" placeholder="z. B. Zählfehler" required><label>Betrag in €</label><input id="adjustAmount" type="number" min="0.01" step="0.01" required><label>Richtung</label><select id="adjustKind"><option value="plus">Geld hinzufügen (+)</option><option value="minus">Geld abziehen (−)</option></select><button class="primary">Korrektur buchen</button></form><details><summary>Kassenbuchungen korrigieren (${free.length})</summary>${free.map(c=>`<div class="row"><div><b>${esc(c.text||'Buchung')}</b><div class="mini">${stamp(c.at)}${c.reversalOf?' · Storno':''}</div></div><b>${euro(c.amount)}</b>${!c.reversalOf&&!db.cash.some(x=>x.reversalOf===c.id)?button('Storno',`cashCorrection('${c.id}')`):''}</div>`).join('')||'Keine Buchungen.'}</details><details><summary>Anfangsbestand · Historie</summary><p>Festgelegt: ${cashOpeningConfigured()?euro(cashOpening()):'Noch nicht festgelegt'}</p>${(db.cashOpening?.history||[]).map(h=>`<p class="mini">${stamp(h.at)} · ${euro(h.old)} → ${euro(h.amount)}</p>`).join('')}</details>`;
}
function cashAudit(){
 const issues=[];const seen=new Set();
 for(const t of cashTransactions()){
  if(t.id&&seen.has(t.id))issues.push('Doppelte Buchungs-ID');
  if(t.id)seen.add(t.id);
  if(!Number.isFinite(t.amount))issues.push('Ungültiger Buchungsbetrag');
 }
 for(const e of db.evenings.filter(x=>!x.historical))for(const r of dueRows(e)){
  if(paidAmount(e,r.id)>r.fee+0.009)issues.push('Überzahlung: '+name(r.id)+' ('+e.date+')');
 }
 return [...new Set(issues)];
}
function cashOpeningConfigured(){return !!(db.cashOpening&&(db.cashOpening.setAt||(db.cashOpening.history||[]).length))}
function updateCashOpening(ev){ev.preventDefault();const raw=$('openingAmount')?.value;const value=Number(raw);if(raw===''||!Number.isFinite(value)||value<0)return;
 if(cashOpeningConfigured())return alert('Der Anfangsbestand wurde bereits festgelegt. Änderungen bitte unter Mehr → Kasse & Beiträge als Kassenkorrektur buchen.');
 const old=cashOpening();db.cashOpening=db.cashOpening||{amount:0,history:[]};db.cashOpening.history=db.cashOpening.history||[];
 if(!db.cashOpening.setAt)db.cashOpening.setAt=Date.now();db.cashOpening.history.push({id:uid(),at:Date.now(),old,amount:Math.round(value*100)/100});db.cashOpening.amount=Math.round(value*100)/100;save();render();}
function cashTransactions(){
 const tx=db.cash.map(c=>({id:c.id,at:c.at||0,amount:Number(c.amount||0),text:c.text||'Freie Buchung',kind:'free',reversalOf:c.reversalOf}));
 db.evenings.filter(e=>!e.historical).forEach(e=>Object.entries(e.payments||{}).forEach(([id,arr])=>arr.forEach(p=>tx.push({id:p.id,at:p.at||0,amount:Number(p.amount||0),text:name(id)+' · Spielabend '+e.date,kind:'payment',player:id,evening:e.id}))));
 return tx.sort((a,b)=>b.at-a.at);
}
function cash(){
 const tx=cashTransactions(),years=[...new Set([new Date().getFullYear(),...tx.filter(t=>t.at).map(t=>new Date(t.at).getFullYear()),...db.evenings.map(e=>Number((e.date||'').slice(0,4)))].filter(Number.isFinite))].sort((a,b)=>b-a);
 const selected=window.cashYear||'all';
 const filtered=tx.filter(t=>selected==='all'||String(new Date(t.at||Date.now()).getFullYear())===selected);
 const income=filtered.filter(t=>t.amount>0).reduce((a,t)=>a+t.amount,0),expenses=-filtered.filter(t=>t.amount<0).reduce((a,t)=>a+t.amount,0);
 const balance=cashOpening()+tx.filter(t=>!db.cashOpening?.setAt||t.at>=db.cashOpening.setAt).reduce((a,t)=>a+t.amount,0);
 const dues=db.evenings.filter(e=>selected==='all'||String((e.date||'').slice(0,4))===selected).reduce((a,e)=>a+dueRows(e).reduce((b,r)=>b+Math.max(0,r.fee-paidAmount(e,r.id)),0),0);
 const debtors=outstandingByPlayer();
 const payments=filtered.filter(t=>t.kind==='payment');
 const e=current(),audit=cashAudit();
 return `<div class="card"><h2>Kasse</h2><p class="muted">Tatsächlicher Kassenbestand: Anfangsbestand plus Buchungen seit dessen Festlegung</p><div class="big">${euro(balance)}</div></div>
 ${!cashOpeningConfigured()?`<details class="card"><summary><b>Anfangsbestand einmalig festlegen</b></summary><p class="muted">Nur bei der ersten Einrichtung. Spätere Anpassungen unter Mehr → Kasse & Beiträge.</p><form onsubmit="updateCashOpening(event)"><label>Bestand in €</label><input id="openingAmount" type="number" min="0" step="0.01" value="0.00" required><button class="primary">Anfangsbestand festlegen</button></form></details>`:''}
 <div class="card"><h3>Jahresübersicht</h3><label>Zeitraum</label><select onchange="window.cashYear=this.value;render()"><option value="all" ${selected==='all'?'selected':''}>Alle Jahre</option>${years.map(y=>`<option value="${y}" ${selected===String(y)?'selected':''}>${y}</option>`).join('')}</select>
 <div class="row"><span>Einnahmen</span><b class="good">${euro(income)}</b></div><div class="row"><span>Ausgaben</span><b class="bad">${euro(expenses)}</b></div><div class="row"><span>Saldo im gewählten Zeitraum</span><b>${euro(income-expenses)}</b></div><div class="row"><span>Noch offene Spielabend-Beiträge</span><b>${euro(dues)}</b></div></div>
 <div class="card"><h3>Offene Spielerzahlungen</h3><p class="muted">Gesamtschulden aus allen Spielabenden · nur vollständig bezahlen.</p>${debtors.length?debtors.map(d=>`<div class="row"><div><b>${esc(name(d.id))}</b><div class="mini">Noch offen</div></div><div class="actions"><b class="bad">${euro(d.amount)}</b>${button('Bezahlen',`payAllPlayer('${d.id}')`,'primary')}</div></div>`).join(''):'Alle Spielerzahlungen sind beglichen.'}</div>
 ${e?`<div class="card"><h3>Zahlungen – ${esc(e.date)}</h3>${dueRows(e).map(x=>{const paid=paidAmount(e,x.id),rest=Math.max(0,x.fee-paid);return `<div class="row"><div><b>${esc(name(x.id))}</b><div class="mini">Soll ${euro(x.fee)} · Bezahlt ${euro(paid)} · Offen ${euro(rest)}</div></div>${rest>0?button('Bezahlen',`payEveningFull('${x.id}')`,'primary'):'✓ Bezahlt'}</div>`}).join('')}</div>`:''}
 <div class="card"><h3>Ein- oder Ausgabe buchen</h3><form onsubmit="addCash(event)"><label>Beschreibung</label><input id="ct" maxlength="150" placeholder="z. B. Getränke oder Spende" required><label>Betrag in €</label><input id="ca" type="number" step=".01" min="0.01" required><label>Art</label><select id="cashType"><option value="income">Einnahme (+)</option><option value="expense">Ausgabe (−)</option></select><button class="primary">Buchen</button></form><p class="muted">Spielerzahlungen bitte oben über „Bezahlen“ erfassen, damit keine doppelte Buchung entsteht.</p></div>
 <details class="card"><summary><b>Zahlungsverlauf der Spieler</b> · ${payments.length} Buchungen</summary>${payments.length?payments.map(t=>`<div class="row"><div><b>${esc(name(t.player))}</b><div class="mini">${stamp(t.at)} · Spielabend ${esc(db.evenings.find(e=>e.id===t.evening)?.date||'')}</div></div><b class="good">+${euro(t.amount)}</b></div>`).join(''):'Keine Spielerzahlungen im gewählten Zeitraum.'}</details>
 <details class="card"><summary><b>Kassenbuch</b> · ${filtered.length} Buchungen</summary>${filtered.length?filtered.map(t=>`<div class="row"><div><b>${esc(t.text)}</b><div class="mini">${stamp(t.at)} · ${t.kind==='payment'?'Spielerzahlung':'Freie Buchung'}</div></div><b class="${t.amount>=0?'good':'bad'}">${t.amount>0?'+':''}${euro(t.amount)}</b></div>`).join(''):'Noch keine Buchungen in diesem Zeitraum.'}</details>`;
}
function addCash(ev){
 ev.preventDefault();const label=$('ct').value.trim(),value=Number($('ca').value),type=$('cashType').value;
 if(!label||!Number.isFinite(value)||value<=0)return alert('Bitte einen gültigen positiven Betrag eingeben.');
 db.cash.push({id:uid(),at:Date.now(),text:label,amount:Math.round(value*100)/100*(type==='expense'?-1:1)});
 save();render();
}

function showResults(){go('resultsOverview')}
function startHistorical(){eveningId=null;historicalSetup=true;historicalMode='rounds';go('evening')}
function home(){
 const debts=outstandingByPlayer();
 const active=[...db.evenings].reverse().find(e=>!isClosed(e));
 const activeCard=active?`<div class="card"><div class="row"><h2 style="margin:0">♠ Laufender Spielabend</h2><span class="pill">${esc(active.date)}</span></div><div class="row"><span>Gastgeber</span><b>${esc(name(active.host))}</b></div><div class="row"><span>Gespielte Runden</span><b>${active.rounds.length}</b></div><div class="row"><span>Bockstand</span><b>${bockRemaining(active)>0?'BOCK · noch '+bockRemaining(active)+' Runden':'Kein Bock aktiv'}</b></div><div class="actions">${button('Spielabend fortsetzen',`openEvening('${active.id}')`,'primary')}</div></div>`:'';
 const debtCard=`<div class="card"><h2>Offene Zahlungen</h2>${debts.length?`<p class="muted">Offene Beträge · zum Bezahlen antippen.</p>${debts.map(d=>`<div class="debt-entry"><b class="debt-name">${esc(name(d.id))}</b><div class="debt-bottom"><b class="bad">${euro(d.amount)}</b>${button('Bezahlen',`payAllPlayer('${d.id}')`,'primary')}</div></div>`).join('')}`:'<p class="muted">Alles bezahlt ✓</p>'}</div>`;
 const recentEvenings=[...db.evenings].filter(e=>isClosed(e)).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))||Number(b.endedAt||b.startedAt||0)-Number(a.endedAt||a.startedAt||0)).slice(0,4);
 const recentCard=`<div class="card"><div class="recent-heading"><h2>Letzte Spielabende</h2><details class="recent-menu"><summary aria-label="Spielabend-Historie öffnen" title="Weitere Optionen">•••</summary><div class="recent-menu-content">${button('Gesamte Spielabend-Historie',"go('resultsOverview')")}</div></details></div>${recentEvenings.map(e=>`<div class="row"><span>${esc(e.date)} · ${esc(name(e.host))}</span>${button('Öffnen',`openEvening('${e.id}')`)}</div>`).join('')||'<p class="muted">Noch kein abgeschlossener Spielabend.</p>'}</div>`;
 return `<div class="tiles home-tiles">${button('<b>♠</b>Spielabend',"go('evening')",'tile')}${button('<b>♣</b>Spieler',"go('players')",'tile')}${button('<b>🏆</b>Ergebnisse','showResults()','tile')}${button('<b>€</b>Kasse',"go('cash')",'tile')}</div>
 ${activeCard}
 <div class="home-panels">${debtCard}${recentCard}</div>`;
}

let statisticsYear=String(new Date().getFullYear());
let statisticsPlayer=null;
function statistics(){
 const years=[...new Set(db.evenings.map(e=>String(e.date||'').slice(0,4)).filter(y=>/^\d{4}$/.test(y)))].sort().reverse();
 const selected=statisticsYear;
 const evenings=db.evenings.filter(e=>selected==='all'||String(e.date||'').startsWith(selected+'-'));
 const data=db.players.filter(p=>!p.guest).map(p=>{
  let nights=0,rounds=0,solos=0,wonSolos=0,lostSolos=0,damen=0,buben=0,stille=0,tacken=0;
  const history=[];
  for(const e of [...evenings].sort((a,b)=>String(a.date).localeCompare(String(b.date)))){
   if(!e.present.includes(p.id))continue;
   nights++;
   rounds+=e.rounds.filter(r=>r.playing?.includes(p.id)||Object.hasOwn(r.points||{},p.id)).length;
   const own=e.rounds.filter(r=>r.solo&&r.soloPlayer===p.id);
   solos+=own.length;
   wonSolos+=own.filter(r=>r.soloWon===true||r.won===true).length;
   lostSolos+=own.filter(r=>r.soloWon===false||r.won===false).length;
   damen+=own.filter(r=>/damen/i.test(String(r.soloType||''))).length;
   buben+=own.filter(r=>/buben/i.test(String(r.soloType||''))).length;
   stille+=own.filter(r=>/still/i.test(String(r.soloType||''))).length;
   const value=totals(e)[p.id]||0;
   tacken+=value;
   history.push({date:e.date,value:value*db.settings.tack});
  }
  return {p,nights,rounds,solos,wonSolos,lostSolos,damen,buben,stille,tacken,amount:tacken*db.settings.tack,history};
 }).sort((a,b)=>b.amount-a.amount||b.nights-a.nights||a.p.name.localeCompare(b.p.name,'de'));
 const active=data.filter(x=>x.nights>0);
 const totalRounds=evenings.reduce((n,e)=>n+e.rounds.length,0);
 const totalSolos=evenings.reduce((n,e)=>n+e.rounds.filter(r=>r.solo).length,0);
 const chosen=data.find(x=>x.p.id===statisticsPlayer);
 const formatAmount=n=>(n>0?'+':'')+euro(n);
 const playerDetails=chosen?`<div class="card"><div class="row"><h3>${esc(chosen.p.name)}</h3>${button('Schließen','statisticsPlayer=null;render()')}</div>
 <div class="row"><span>Gesamtergebnis</span><b class="${chosen.amount>=0?'good':'bad'}">${formatAmount(chosen.amount)}</b></div>
 <div class="row"><span>Spielabende</span><b>${chosen.nights}</b></div>
 <div class="row"><span>Gespielte Runden</span><b>${chosen.rounds}</b></div>
 <div class="row"><span>Soli insgesamt</span><b>${chosen.solos}</b></div>
 <div class="row"><span>Damen / Buben / Still</span><b>${chosen.damen} / ${chosen.buben} / ${chosen.stille}</b></div>
 <div class="row"><span>Soli gewonnen / verloren*</span><b>${chosen.wonSolos} / ${chosen.lostSolos}</b></div>
 <p class="mini">* Nur eindeutig gespeicherte Solo-Ergebnisse. Historische Notizen ohne Solospieler können nicht zugeordnet werden.</p>
 <h3>Entwicklung nach Spielabend</h3>${chosen.history.length?chosen.history.map((h,i)=>`<div class="row"><span>${esc(h.date)}</span><b class="${h.value>=0?'good':'bad'}">${formatAmount(h.value)}</b></div>`).join(''):'Noch keine Teilnahme erfasst.'}</div>`:'';
 return `<div class="card"><div class="actions">${button('← Ergebnisse',"go('resultsOverview')")}</div><h2>Jahresrangliste</h2>
 <label>Zeitraum</label><select onchange="statisticsYear=this.value;statisticsPlayer=null;render()"><option value="all" ${selected==='all'?'selected':''}>Alle Jahre</option>${years.map(y=>`<option value="${y}" ${selected===y?'selected':''}>${y}</option>`).join('')}</select>
 <div class="row"><span>Spielabende</span><b>${evenings.length}</b></div><div class="row"><span>Runden / Soli</span><b>${totalRounds} / ${totalSolos}</b></div>
 <p class="mini">Nur Stammspieler · Rangfolge nach Spielgewinn in Euro · Kasse und Gebühren bleiben getrennt.</p></div>
 <div class="card"><h3>🏆 Rangliste</h3><div class="scroll"><table class="stat-compact"><thead><tr><th>Platz</th><th>Spieler</th><th>Abende</th><th>Ergebnis</th></tr></thead><tbody>
 ${data.map((x,i)=>`<tr class="stat-tap" onclick="statisticsPlayer='${x.p.id}';render()"><td>${i+1}.</td><td><b>${esc(x.p.name)}</b></td><td>${x.nights}</td><td class="${x.amount>=0?'good':'bad'}"><b>${formatAmount(x.amount)}</b></td></tr>`).join('')}</tbody></table></div><p class="mini">Spieler antippen für Details.</p></div>${playerDetails}`;
}

let resultsYear=String(new Date().getFullYear());
function resultsOverview(){
 const years=[...new Set(db.evenings.map(e=>String(e.date||'').slice(0,4)).filter(y=>/^\d{4}$/.test(y)))].sort().reverse();
 if(!years.includes(resultsYear))resultsYear=years[0]||String(new Date().getFullYear());
 const chosen=[...db.evenings].filter(e=>String(e.date||'').startsWith(resultsYear+'-')).sort((a,b)=>String(b.date).localeCompare(String(a.date))||Number(b.startedAt||0)-Number(a.startedAt||0));
 const makeResultCard=e=>{
  const t=totals(e),rows=dueRows(e);
  const lines=rows.map(r=>{
   const game=r.present?(t[r.id]||0)*db.settings.tack:null;
   const solo=r.present?(e.historical?0:(soloCount(e,r.id)?0:db.settings.soloFee)):null;
   const paid=paidAmount(e,r.id),isPaid=e.historical||paid+0.005>=r.fee;
   return `<tr><td>${esc(name(r.id))}${r.present?'':'<span class="bill-absent">abwesend</span>'}</td><td class="${game===null?'':game>=0?'good':'bad'}">${game===null?'–':(game>0?'+':'')+euro(game)}</td><td>${solo===null?'–':euro(solo)}</td><td class="bill-total"><b>${euro(r.fee)}</b></td><td>${isPaid?'✓':'○'}</td></tr>`;
  }).join('');
  return `<div class="card"><div class="row"><div><h3 style="margin:0">${esc(e.date)}</h3><div class="mini">${esc(name(e.host))} · ${isClosed(e)?'Abgeschlossen':'Offen'}${e.historical?' · Nachtrag':''}</div></div>${button('Öffnen',`openResultsEvening('${e.id}')`)}</div><div class="bill-caption">Startgebühr ${euro(db.settings.startFee)} inklusive</div><div class="bill-wrap"><table class="bill-table"><tr><th>Spieler</th><th>Spiel +/−</th><th>Solo</th><th>Gesamt</th><th>✓</th></tr>${lines}</table></div></div>`;
 };
 const cards=chosen.slice(0,4).map(makeResultCard).join('');
 const older=chosen.length>4?`<details class="card"><summary>Ältere Spielabende anzeigen (${chosen.length-4})</summary><div style="margin-top:12px">${chosen.slice(4).map(makeResultCard).join('')}</div></details>`:'';
 return `<div class="card"><h2>Ergebnisse</h2><p class="muted">Alle Spielabende des ausgewählten Jahres.</p><div class="actions" style="align-items:end"><div style="flex:1;min-width:150px"><label>Jahr auswählen</label><select onchange="resultsYear=this.value;render()">${years.length?years.map(y=>`<option value="${y}" ${resultsYear===y?'selected':''}>${y}</option>`).join(''):`<option>${resultsYear}</option>`}</select></div>${button('▥ Jahresstatistik',`statisticsYear=resultsYear;go('statistics')`)}</div><div class="row"><span>Spielabende im Jahr</span><b>${chosen.length}</b></div></div>${cards||'<div class="card">Für dieses Jahr sind noch keine Spielabende vorhanden.</div>'}${older}`;
}
function openResultsEvening(id){eveningId=id;go('results')}

render();

function updateOfflineStatus(){const el=document.getElementById('offlineStatus');if(el)el.textContent=navigator.onLine?'● Online · Offline bereit nach Erstinstallation':'● Offline · Daten lokal gespeichert'}
window.addEventListener('online',updateOfflineStatus);window.addEventListener('offline',updateOfflineStatus);
updateOfflineStatus();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(err=>{console.warn('Offline-Installation nicht verfügbar',err)}))}
</script>

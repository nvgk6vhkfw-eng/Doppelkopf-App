
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17382e">
<title>Doppelkopf Club</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;background:#102c25;color:#f2e8d8}
*{box-sizing:border-box}
body{margin:0}
header{background:#17382e;border-bottom:2px solid #ae8155;padding:23px}
h1{color:#dfb47b;margin:0;font-size:26px}
header p{color:#c6b6a0;margin:6px 0}
main{max-width:1100px;margin:auto;padding:16px}
nav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:18px}
button{cursor:pointer;border:1px solid #8e704f;border-radius:11px;background:#28483b;color:#f4e8d6;padding:12px 9px;font:inherit}
button:hover,.active,.primary{background:#a8774d;color:#fff}
.card{background:#1d4033;border:1px solid #6e6249;border-radius:16px;padding:19px;margin-bottom:14px}
h2{color:#e3b782;font-size:20px;margin:0 0 14px}
input,select{width:100%;padding:12px;border:1px solid #97764e;border-radius:9px;background:#102e26;color:white;font:inherit;margin:6px 0 13px}
label{display:block;margin-top:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #526a56}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
.tile{min-height:115px;text-align:center;background:#244b3b}
.tile span{display:block;font-size:30px;margin-bottom:8px;color:#d7aa72}
.big{font-size:28px;font-weight:bold;color:#e3b782}
.muted{color:#c7b9a5;font-size:13px}
.good{color:#b4d8ae}
.bad{color:#efac9b}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 5px;text-align:left;border-bottom:1px solid #526a56}
.danger{background:#633a35}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.actions button{flex:1}
.check{display:flex;align-items:center;gap:10px;padding:9px 0}
.check input{width:auto;margin:0}
@media(min-width:700px){.tiles{grid-template-columns:repeat(4,1fr)}}
@media(max-width:550px){nav button{font-size:11px;padding:10px 2px}}
</style>
</head>
<body>
<header>
<h1>♠ Doppelkopf Club</h1>
<p>Spielabend · Tacken · Clubkasse</p>
</header>
<main>
<nav id="nav"></nav>
<section id="view"></section>
</main>
<script>
"use strict";
const KEY="doko-bronze-v1";
const STAMM=["Tom","Patrick","Manuel","Lukas E.","Lukas T.","Andre"];
const fresh=()=>({
players:STAMM.map((n,i)=>({id:"s"+i,name:n,guest:false})),
evenings:[],
cash:[],
settings:{tack:0.20,startFee:5,soloFee:5}
});
let db;
try{db=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{db=fresh()}
if(!db.players||!db.evenings||!db.cash)db=fresh();
db.settings={tack:.20,startFee:5,soloFee:5,...db.settings};
let page="home",eveningId=null;
const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const euro=n=>Number(n||0).toLocaleString("de-DE",{style:"currency",currency:"EUR"});
const pname=id=>db.players.find(p=>p.id===id)?.name||"Unbekannt";
const active=()=>db.evenings.find(e=>e.id===eveningId);
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert("Speichern fehlgeschlagen: "+e.message)}}
function go(p){page=p;render()}
function btn(t,fn,cls=""){return `<button class="${cls}" onclick="${fn}">${t}</button>`}
function render(){
const tabs=[["home","⌂ Start"],["evening","♠ Spiel"],["players","♣ Spieler"],["cash","€ Kasse"],["settings","⚙ Mehr"]];
$("nav").innerHTML=tabs.map(([p,t])=>btn(t,`go('${p}')`,page===p?"active":"")).join("");
$("view").innerHTML=({home,evening,players,cash,settings})[page]();
}
function totals(e){
const t={};
e.present.forEach(id=>t[id]=0);
e.rounds.forEach(r=>Object.entries(r.points).forEach(([id,n])=>t[id]=(t[id]||0)+n));
return t;
}
function home(){
return `<div class="tiles">
${btn("<span>♠</span>Spielabend","go('evening')","tile")}
${btn("<span>♣</span>Spieler","go('players')","tile")}
${btn("<span>🏆</span>Ergebnisse","showResults()","tile")}
${btn("<span>€</span>Clubkasse","go('cash')","tile")}
</div>
<div class="card"><h2>Willkommen im Kartenclub</h2>
<p>Alle Spielabende, Tacken und Zahlungen auf einem Gerät verwalten.</p>
<div class="row"><span>Stammspieler</span><b>${db.players.filter(p=>!p.guest).length}</b></div>
<div class="row"><span>Spielabende</span><b>${db.evenings.length}</b></div>
<div class="row"><span>Gespielte Runden</span><b>${db.evenings.reduce((n,e)=>n+e.rounds.length,0)}</b></div>
</div>
<div class="card"><h2>Letzte Spielabende</h2>
${db.evenings.length?[...db.evenings].reverse().slice(0,8).map(e=>`<div class="row"><span>${esc(e.date)} · ${e.rounds.length} Runden</span>${btn("Öffnen",`openEvening('${e.id}')`)}</div>`).join(""):"<p>Noch kein Spielabend vorhanden.</p>"}
</div>`;
}
function players(){
return `<div class="card"><h2>Unsere Spieler</h2>
${db.players.map(p=>`<div class="row"><span>${esc(p.name)} ${p.guest?"(Gast)":""}</span>${p.guest?btn("Entfernen",`removeGuest('${p.id}')`,"danger"):"<span class='muted'>Stammspieler</span>"}</div>`).join("")}
</div>
<div class="card"><h2>Gastspieler hinzufügen</h2>
<form onsubmit="addGuest(event)">
<label>Name</label><input id="guestName" maxlength="60" required>
<button class="primary">Gast hinzufügen</button>
</form></div>`;
}
function addGuest(e){
e.preventDefault();
const n=$("guestName").value.trim();
if(!n)return;
if(db.players.some(p=>p.name.toLowerCase()===n.toLowerCase()))return alert("Name bereits vorhanden.");
db.players.push({id:uid(),name:n,guest:true});save();render();
}
function removeGuest(id){
if(db.evenings.some(e=>e.present.includes(id)||e.rounds.some(r=>id in r.points)))return alert("Gast ist bereits in einem Spielabend gespeichert.");
if(confirm("Gast entfernen?")){db.players=db.players.filter(p=>p.id!==id);save();render()}
}
function evening(){
const e=active();
if(!e)return `<div class="card"><h2>Neuen Spielabend beginnen</h2>
<form onsubmit="createEvening(event)">
<label>Datum</label><input id="date" type="date" value="${new Date().toLocaleDateString('sv-SE')}" required>
<h2>Anwesende Spieler</h2>
${db.players.map(p=>`<label class="check"><input type="checkbox" name="present" value="${p.id}" ${!p.guest?"checked":""}>${esc(p.name)}</label>`).join("")}
<button class="primary">Spielabend starten</button>
</form></div>
<div class="card"><h2>Vergangene Abende</h2>
${db.evenings.map(x=>`<div class="row">${esc(x.date)} ${btn("Öffnen",`openEvening('${x.id}')`)}</div>`).join("")}</div>`;
const t=totals(e);
return `<div class="card"><div class="row"><h2>Spielabend ${esc(e.date)}</h2>${btn("Zurück","eveningId=null;render()")}</div>
<p class="muted">${e.rounds.length} Runden · ${e.present.length} Anwesende</p>
<div class="actions">${btn("Neue Runde","go('round')","primary")}${btn("Abrechnung","go('results')")}</div>
</div>
<div class="card"><h2>Aktueller Stand</h2>
<table><tr><th>Spieler</th><th>Tacken</th><th>Gewinn/Verlust</th></tr>
${e.present.map(id=>`<tr><td>${esc(pname(id))}</td><td>${t[id]}</td><td class="${t[id]>=0?"good":"bad"}">${euro(t[id]*db.settings.tack)}</td></tr>`).join("")}</table></div>
<div class="card"><h2>Spielverlauf</h2>
${[...e.rounds].reverse().map((r,i)=>`<div class="row"><div><b>Runde ${e.rounds.length-i}</b><div class="muted">${r.bock?"Bock ×2 · ":""}${r.solo?"Solo · ":""}${Object.entries(r.points).map(([id,n])=>esc(pname(id))+": "+n).join(" · ")}</div></div>${btn("✕",`removeRound('${r.id}')`,"danger")}</div>`).join("")||"Noch keine Runden."}
</div>`;
}
function createEvening(ev){
ev.preventDefault();
const present=[...document.querySelectorAll('input[name=present]:checked')].map(x=>x.value);
if(present.length<4)return alert("Mindestens vier Spieler auswählen.");
const e={id:uid(),date:$("date").value,present,rounds:[],payments:{},soloPlayers:[]};
db.evenings.push(e);eveningId=e.id;save();render();
}
function openEvening(id){eveningId=id;page="evening";render()}
function round(){
const e=active();if(!e)return go("evening");
const options=e.present.map(id=>`<option value="${id}">${esc(pname(id))}</option>`).join("");
return `<div class="card"><h2>Neue Spielrunde</h2>
<p class="muted">Vier Spieler auswählen. Gewinner erhalten positive Tacken, Verlierer negative. Bock verdoppelt die Wertung.</p>
<form onsubmit="addRound(event)">
${[0,1,2,3].map(i=>`<label>Spieler ${i+1}</label><select id="rp${i}" required><option value="">Auswählen</option>${options}</select><label>Tacken</label><input id="rv${i}" type="number" step="1" value="0" required>`).join("")}
<label class="check"><input id="bock" type="checkbox">Bockrunde ×2</label>
<label class="check"><input id="solo" type="checkbox">Solo gespielt</label>
<label>Solospieler (optional)</label><select id="soloPlayer"><option value="">Keiner</option>${options}</select>
<button class="primary">Runde speichern</button>
</form></div>
<div class="card">${btn("Abbrechen","go('evening')")}</div>`;
}
function addRound(ev){
ev.preventDefault();
const e=active();
const ids=[0,1,2,3].map(i=>$("rp"+i).value);
const vals=[0,1,2,3].map(i=>Number($("rv"+i).value));
if(ids.some(x=>!x)||new Set(ids).size!==4)return alert("Vier unterschiedliche Spieler auswählen.");
if(vals.some(x=>!Number.isInteger(x))||vals.reduce((a,b)=>a+b,0)!==0)return alert("Tacken müssen ganze Zahlen sein und zusammen null ergeben.");
const bock=$("bock").checked,solo=$("solo").checked,sp=$("soloPlayer").value;
if(solo&&!sp)return alert("Bitte Solospieler auswählen.");
const points={};ids.forEach((id,i)=>points[id]=vals[i]*(bock?2:1));
e.rounds.push({id:uid(),points,bock,solo,soloPlayer:solo?sp:null});
if(solo&&!e.soloPlayers.includes(sp))e.soloPlayers.push(sp);
save();page="evening";render();
}
function removeRound(id){
const e=active();if(!confirm("Runde löschen?"))return;
e.rounds=e.rounds.filter(r=>r.id!==id);
e.soloPlayers=[...new Set(e.rounds.filter(r=>r.solo&&r.soloPlayer).map(r=>r.soloPlayer))];
save();render();
}
function results(){
const e=active();if(!e)return evening();
const t=totals(e);
return `<div class="card"><h2>Abrechnung ${esc(e.date)}</h2>
<p class="muted">Startgebühr ${euro(db.settings.startFee)} pro Anwesendem. Solo-Strafe ${euro(db.settings.soloFee)} bei keinem Solo. Negative Spieler zahlen ihren Verlust.</p>
<table><tr><th>Spieler</th><th>Tacken</th><th>Zu zahlen</th></tr>
${e.present.map(id=>{
const fee=db.settings.startFee+(e.soloPlayers.includes(id)?0:db.settings.soloFee)+Math.max(0,-t[id]*db.settings.tack);
return `<tr><td>${esc(pname(id))}</td><td>${t[id]}</td><td>${euro(fee)}</td></tr>`;
}).join("")}</table>
<p class="muted">Vorläufige Berechnung ohne Abwesenheitsregel und Sonderzahlungen.</p>
${btn("Zurück","go('evening')")}</div>`;
}
function showResults(){if(db.evenings.length){openEvening(db.evenings[db.evenings.length-1].id);page="results";render()}else go("evening")}
function cash(){
const sum=db.cash.reduce((n,c)=>n+c.amount,0);
return `<div class="card"><h2>Clubkasse</h2><div class="big">${euro(sum)}</div><p class="muted">Tatsächlich erfasste Einnahmen und Ausgaben</p></div>
<div class="card"><h2>Buchung hinzufügen</h2><form onsubmit="addCash(event)">
<label>Beschreibung</label><input id="ct" required maxlength="150">
<label>Betrag in € (Ausgaben negativ)</label><input id="ca" type="number" step=".01" required>
<button class="primary">Buchen</button></form></div>
<div class="card"><h2>Kassenbuch</h2>${[...db.cash].reverse().map(c=>`<div class="row"><span>${esc(c.text)}</span><b>${euro(c.amount)}</b></div>`).join("")||"Noch keine Buchungen."}</div>`;
}
function addCash(ev){
ev.preventDefault();
const text=$("ct").value.trim(),amount=Number($("ca").value);
if(!text||!Number.isFinite(amount))return;
db.cash.push({id:uid(),text,amount});save();render();
}
function settings(){
return `<div class="card"><h2>Club-Einstellungen</h2>
<label>Euro pro Tacken</label><input id="tack" type="number" min="0" step=".01" value="${db.settings.tack}">
<label>Startgebühr €</label><input id="startFee" type="number" min="0" step=".01" value="${db.settings.startFee}">
<label>Solo-Strafe €</label><input id="soloFee" type="number" min="0" step=".01" value="${db.settings.soloFee}">
${btn("Einstellungen speichern","saveSettings()","primary")}</div>
<div class="card"><h2>Datensicherung</h2><p>Alle Daten werden lokal in diesem Browser gespeichert.</p>
${btn("Backup herunterladen","backup()","primary")}
<label>Backup importieren</label><input type="file" accept=".json" onchange="restore(event)">
</div>`;
}
function saveSettings(){
for(const k of ["tack","startFee","soloFee"]){
const n=Number($(k).value);
if(!Number.isFinite(n)||n<0)return alert("Ungültiger Betrag.");
db.settings[k]=n;
}
save();render();
}
function backup(){
const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
const url=URL.createObjectURL(blob),a=document.createElement("a");
a.href=url;a.download="doppelkopf-backup.json";a.click();
setTimeout(()=>URL.revokeObjectURL(url),2000);
}
async function restore(ev){
try{
const d=JSON.parse(await ev.target.files[0].text());
if(!Array.isArray(d.players)||!Array.isArray(d.evenings)||!Array.isArray(d.cash))throw Error("Ungültiges Backup");
if(confirm("Alle Daten ersetzen?")){db=d;db.settings={tack:.2,startFee:5,soloFee:5,...db.settings};eveningId=null;save();go("home")}
}catch(e){alert("Import fehlgeschlagen: "+e.message)}
}
const originalRender=render;
render=function(){
if(page==="round"){$("nav").innerHTML="";$("view").innerHTML=round();return}
if(page==="results"){$("nav").innerHTML="";$("view").innerHTML=results();return}
originalRender();
};
render();
</script>
</body>
</html>

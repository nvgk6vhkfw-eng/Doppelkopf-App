
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123429">

<title>Doppelkopf Club</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;background:#102d24;color:#f5eddf}
*{box-sizing:border-box}
body{margin:0}
header{padding:10px 16px;background:#183b2e;border-bottom:2px solid #b68b56;position:sticky;top:0;z-index:100;box-shadow:0 3px 12px #061c16aa}
.header-inner{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.header-brand{min-width:0}
.header-brand h1{font-size:clamp(17px,3.8vw,24px);overflow-wrap:anywhere}
.header-nav{display:flex;gap:7px;flex-shrink:0}
.header-nav button{padding:9px 12px;font-size:14px}
@media(max-width:450px){header{padding:9px 10px}.header-nav button{padding:8px 9px;font-size:13px}header small{font-size:10px}}
h1{margin:0;color:#e9bd82;font-size:25px}
header small{color:#d1bda0}
main{max-width:1100px;margin:auto;padding:14px}
nav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:15px}
button{background:#315342;color:#fff5e7;border:1px solid #9b805b;border-radius:11px;padding:12px 9px;font:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary,button.active{background:#a47748;color:white}
button.danger{background:#633c36}
.card{background:#1d3d30;border:1px solid #76674f;border-radius:16px;padding:16px;margin-bottom:15px}
h2,h3{color:#e9bd82;margin-top:0}
h2{font-size:21px}
p{line-height:1.5}
.muted{color:#cbbba4;font-size:13px}
input,select{width:100%;padding:12px;background:#102d24;color:white;border:1px solid #ab9067;border-radius:9px;font:inherit;margin:7px 0 13px}
label{display:block;margin-top:10px}
.check{display:flex;align-items:center;gap:10px;padding:8px 0}
.check input{width:auto;margin:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:9px;padding:11px 0;border-bottom:1px solid #536e59}
.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}
.actions button{flex:1}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tile{min-height:115px}
.tile b{display:block;color:#edc48d;font-size:30px}
.good{color:#b9e2b0}
.bad{color:#f4afa1}
.big{font-size:29px;color:#edc48d;font-weight:700}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:10px 5px;border-bottom:1px solid #526b58}
.scroll{overflow-x:auto}
.pill{background:#9d754b;border-radius:25px;padding:7px 12px;font-size:12px}
.name-pool{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}
.chip{background:#20513a;border:2px solid #aa885b;border-radius:11px;text-align:center;padding:13px 4px;font-weight:650;cursor:grab;touch-action:none;user-select:none}
.chip.chosen{background:#a47748}
.chip.used{opacity:.3;pointer-events:none}
.seat-drag-ghost{position:fixed;z-index:9999;pointer-events:none;transform:translate(-50%,-60%);background:#a47748;color:#fff8e8;border:2px solid #f0ca91;border-radius:12px;padding:13px 18px;font-weight:750;box-shadow:0 10px 28px #0009;white-space:nowrap}
.seat.drag-target{border:3px solid #8af0ce!important;background:#286a50!important;box-shadow:0 0 0 3px #8af0ce66}
.setup{background:#092c21;padding:10px;border-radius:17px}
.layout{display:grid;grid-template-columns:minmax(68px,1fr) minmax(0,3fr) minmax(68px,1fr);grid-template-rows:78px 180px 78px;gap:7px;align-items:center}
.top,.bottom{grid-column:2;display:flex;justify-content:center;gap:8px;height:100%}
.top{grid-row:1}.bottom{grid-row:3}
.left{grid-column:1;grid-row:2}
.right{grid-column:3;grid-row:2}
.top .seat,.bottom .seat{width:47%;height:100%}
.left .seat,.right .seat{width:100%;min-height:150px}
.seat{border:2px dashed #a9c9ad;background:#194332;border-radius:12px;padding:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;cursor:pointer;overflow-wrap:anywhere}
.seat .plus{font-size:27px}
.seat .name{font-weight:700;font-size:13px}
.seat .hint{font-size:10px}
.seat.first{border-color:#efbf7b}
.seat.filled{border-style:solid;background:#335c44}
.seat.out{opacity:.38;filter:saturate(.65);transform:scale(.94)}.seat.pickable:not(.out){box-shadow:inset 0 0 0 1px #a8d2b455}
.seat.mixer{background:#765536;border-color:#f4c583}
.seat.pickable{cursor:pointer;touch-action:manipulation}.seat.pickable.selected{background:#176b77;border:3px solid #80e5ee;box-shadow:0 0 0 2px #247f8b}.seat.pickable.selected .hint{color:#d0fbff}.seat.pickable.mixer:not(.selected){background:#765536;border-color:#f4c583}.seat.pickable .hint{color:#f9dfaf}.quick-tacken{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin:12px 0}.quick-tacken button{padding:14px 0;font-size:20px;font-weight:750;background:#335c44;color:#f5d6a4;border:1px solid #b48c58;border-radius:10px}.quick-tacken button:active{background:#a47748}.round-guide{font-size:13px;color:#e8c89a}
.felt{grid-column:2;grid-row:2;height:100%;background:linear-gradient(140deg,#087349,#06452f);border:8px solid #a66e3e;border-radius:30px;box-shadow:inset 0 0 0 3px #d5a66c;display:flex;flex-direction:column;align-items:center;justify-content:center}
.felt strong{font:700 clamp(14px,3vw,26px) Georgia,serif;color:#f0c88e}
.cards{font-size:35px;background:#fff8e8;color:#b23e36;border-radius:8px;padding:5px 10px;transform:rotate(-5deg);margin-bottom:12px}
.winners{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:14px 0}
.winner{min-height:70px;border:2px solid #819d7f}
.winner.selected{background:#a47748;border-color:#efc68d}
.preview{background:#102d24;border:1px solid #63836b;border-radius:12px;padding:14px;margin:15px 0}
.preview .row:last-child{border:0}
@media(min-width:700px){
 .tiles{grid-template-columns:repeat(4,1fr)}
 .name-pool{grid-template-columns:repeat(6,1fr)}
 .layout{grid-template-columns:155px minmax(0,1fr) 155px;grid-template-rows:95px 270px 95px;gap:14px}
 .top .seat,.bottom .seat{max-width:220px}
 .left .seat,.right .seat{min-height:170px}
}
@media(max-width:500px){
 nav button{font-size:11px;padding:10px 2px}
 .card{padding:12px}
 .setup{padding:6px}
 .layout{grid-template-columns:minmax(65px,1fr) minmax(0,2.5fr) minmax(65px,1fr);grid-template-rows:73px 155px 73px;gap:5px}
 .seat .name{font-size:11px}
 .seat .hint{font-size:9px}
 .felt{border-width:5px;border-radius:20px}
 .cards{font-size:23px}
}
 .bockbar{background:#493b27;border:1px solid #d2a66b;border-radius:12px;padding:13px;margin:12px 0;color:#f7d39c;text-align:center;font-weight:750}
 .bockbar.off{background:#244435;border-color:#6a8a70;color:#d1e1d1}
 .triggers{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}
 .triggers label{margin:0;display:flex;align-items:center;justify-content:center;text-align:center;gap:5px;min-height:70px;padding:7px;border:1px solid #a8895e;border-radius:10px;background:#284a38;font-size:12px}
 .triggers input{width:auto;margin:0}
 .mini{font-size:12px;color:#d1bda0}
 .locked{opacity:.8}
 
.header-stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:4px;color:#d1bda0;font-size:12px}
.header-stats b{color:#e9bd82;font-variant-numeric:tabular-nums}
.home-panels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
.home-panels .card{min-width:0;margin-bottom:0}
.home-panels .row{flex-wrap:wrap;align-items:start}
.home-panels .actions{margin-top:3px}
.home-panels .actions button{flex:0 0 auto;padding:8px}
.home-panels h2{font-size:clamp(15px,2.5vw,21px)}
.home-panels .muted{line-height:1.4}
.home-tiles{margin-bottom:16px}
@media(max-width:550px){
 .home-panels{gap:8px}
 .home-panels .card{padding:10px}
 .home-panels .row{gap:5px}
 .home-panels .row b{font-size:13px}
 .home-panels .actions button{font-size:12px;padding:7px 6px}
 .home-panels .muted{font-size:11px}
 .header-stats{font-size:11px;gap:9px}
}

/* V1.5.9: auf kleinen Displays gut lesbare Abrechnung und Zahlungen */
.debt-entry{padding:10px 0;border-bottom:1px solid #536e59;min-width:0}
.debt-entry:last-child{border-bottom:0}
.debt-name{display:block;overflow-wrap:anywhere;margin-bottom:7px}
.debt-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px}
.debt-bottom .bad{font-variant-numeric:tabular-nums;white-space:nowrap}
.debt-bottom button{flex:0 0 auto;padding:8px 10px}
.bill-caption{color:#d1bda0;font-size:12px;text-align:right;margin:10px 0}
.bill-wrap{width:100%;min-width:0}
.bill-table{table-layout:fixed;width:100%;font-variant-numeric:tabular-nums}
.bill-table th,.bill-table td{padding:11px 4px;font-size:clamp(10px,2.6vw,14px);vertical-align:middle;overflow-wrap:anywhere}
.bill-table th:nth-child(1){width:24%}.bill-table th:nth-child(2){width:23%}.bill-table th:nth-child(3){width:16%}.bill-table th:nth-child(4){width:25%}.bill-table th:nth-child(5){width:12%}
.bill-table td:not(:first-child),.bill-table th:not(:first-child){text-align:right}
.bill-table .bill-total{white-space:nowrap}
.bill-absent{display:block;color:#cbbba4;font-size:10px}
.paid-check{display:flex;justify-content:flex-end;margin:0;padding:0}
.paid-check input{width:19px;height:19px;margin:0;accent-color:#a47748}
@media(max-width:390px){.bill-table th,.bill-table td{padding:9px 2px;font-size:10px}.bill-table th:nth-child(1){width:22%}.bill-table th:nth-child(2){width:24%}.bill-table th:nth-child(3){width:16%}.bill-table th:nth-child(4){width:27%}.bill-table th:nth-child(5){width:11%}}
/* V1.6.0: kompakte Touch-Einrichtung und Verlaufstabellen */
.setup-date{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 10px}
.setup-date label{margin:0;flex:0 0 auto}
.setup-date input{width:min(185px,62%);max-width:100%;margin:0;min-width:0}
.setup-player{gap:8px;border-bottom:1px solid rgba(211,181,135,.14)}
.setup-player:last-of-type{border-bottom:0}
@media(max-width:550px){
 .setup-player{padding:5px 0!important}
 .setup-player .check{font-size:14px}
 .setup-date input{font-size:14px;padding:8px}
 .bill-table th,.bill-table td{overflow-wrap:normal;word-break:normal}
}

/* V1.6.1: einheitliche Bronze-Auswahl auf iPhone, Android und Desktop */
input[type="checkbox"],input[type="radio"]{accent-color:#b77b3d}
.setup-player input[type="checkbox"]{-webkit-appearance:none;appearance:none;flex:0 0 auto;width:24px;height:24px;margin:0;border:2px solid #d7b98c;border-radius:7px;background:#102d24;display:grid;place-content:center;cursor:pointer;touch-action:manipulation}
.setup-player input[name="present"]:checked{background:linear-gradient(145deg,#d69a55,#98602d);border-color:#eac28c}
.setup-player input[name="present"]:checked::after{content:"";width:12px;height:7px;border-left:3px solid #fff7e7;border-bottom:3px solid #fff7e7;transform:rotate(-45deg) translate(1px,-1px)}
.setup-player input[name="hostChoice"]{border-radius:50%;background:transparent;border-color:#e3c79d}
.setup-player input[name="hostChoice"]:checked::after{content:"";width:12px;height:12px;border-radius:50%;background:#d49a56}
.setup-player input[type="checkbox"]:focus-visible{outline:3px solid #f0ca91;outline-offset:3px}

/* Version 1.6.4: Kompakte Historienauswahl auf der Startseite */
.recent-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.recent-heading h2{margin:0}
.recent-menu{position:relative;flex-shrink:0}
.recent-menu summary{list-style:none;cursor:pointer;border:1px solid #6b765e;border-radius:9px;color:#dfb47f;padding:5px 10px;font-weight:800;letter-spacing:2px;line-height:1.2;min-width:42px;text-align:center;user-select:none}
.recent-menu summary::-webkit-details-marker{display:none}
.recent-menu-content{position:absolute;right:0;top:calc(100% + 5px);z-index:20;background:#263f31;border:1px solid #6b765e;border-radius:10px;padding:8px;min-width:210px;box-shadow:0 8px 20px #0005}
.recent-menu-content button{width:100%;white-space:normal;text-align:left}
.bock-extra{margin:14px 0;padding:12px;border:1px solid #99764d;border-radius:12px;background:#19372c}.bock-extra summary{cursor:pointer;color:#e4bd85;font-weight:650;list-style-position:inside}.bock-extra[open] summary{margin-bottom:12px}.special-actions{margin:12px 0 8px}.special-actions button{flex:1;min-height:46px}

/* V1.6.7 – klassische Tischoptik, kompakte Smartphone-Spielrunde */
.compact-evening{padding:11px 12px}
.compact-evening>.row:first-child{padding:3px 0 6px}
.compact-evening>.row:first-child h2{font-size:18px;margin:0}
.compact-evening>.mini{margin:4px 0;font-size:11px;line-height:1.25}
.compact-evening .game-meta{padding:5px 0;margin-bottom:6px;font-size:12px;color:#edc48d}
.compact-evening .compact-game-table{padding:6px}
.compact-game-table .layout{grid-template-rows:49px 115px 49px;gap:5px;grid-template-columns:minmax(57px,1fr) minmax(0,3fr) minmax(57px,1fr)}
.compact-game-table .left .seat,.compact-game-table .right .seat{min-height:105px}
.compact-game-table .seat{border-radius:9px;padding:3px;gap:1px}
.compact-game-table .seat .name{font-size:12px;line-height:1.1}
.compact-game-table .seat .hint{font-size:9px}
.compact-game-table .felt{border-width:6px;border-radius:22px;box-shadow:inset 0 0 0 2px #d5a66c}
.compact-game-table .table-bock{text-align:center;color:#f0c88e;font-size:clamp(12px,3.6vw,17px);font-weight:750;line-height:1.15}
.compact-game-table .table-bock small{display:block;font-size:10px;font-weight:500;margin-top:3px}
.compact-evening>.muted{font-size:11px;margin:6px 0 3px;line-height:1.25}
.compact-evening .round-guide{margin:4px 0;font-size:11px}
.compact-evening .special-actions{margin:7px 0 4px;gap:7px}
.compact-evening .special-actions button{padding:10px 5px}
.compact-evening .tacken-caption{color:#edc48d;font-size:12px;font-weight:700;margin:5px 0 2px}
.compact-evening .quick-tacken{margin:4px 0 7px;gap:4px}
.compact-evening .quick-tacken button{padding:10px 0;font-size:17px;min-height:43px}
.compact-evening .preview:empty{display:none}
.compact-evening .bock-extra{margin-top:10px}
@media(min-width:700px){.compact-game-table .layout{grid-template-columns:120px minmax(0,1fr) 120px;grid-template-rows:65px 190px 65px;gap:10px}.compact-game-table .left .seat,.compact-game-table .right .seat{min-height:165px}.compact-game-table .seat .name{font-size:15px}}
.stat-compact{width:100%;table-layout:auto}.stat-compact th,.stat-compact td{padding:10px 5px;white-space:nowrap;font-size:13px}.stat-compact th:last-child,.stat-compact td:last-child{text-align:right}.stat-tap{cursor:pointer}.stat-tap:active{background:#315c45}@media(max-width:390px){.stat-compact th,.stat-compact td{font-size:12px;padding:9px 3px}}
.settings-panel{padding:14px}.settings-group{border:1px solid #56725c;border-radius:12px;margin:9px 0;background:#173a2d;overflow:hidden}.settings-group>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 12px;cursor:pointer;min-height:60px}.settings-group>summary::-webkit-details-marker{display:none}.settings-icon{display:flex;align-items:center;justify-content:center;flex:0 0 34px;height:34px;border-radius:9px;background:#315a44;color:#efc58a;font-weight:700;font-size:19px}.settings-title{flex:1;min-width:0}.settings-title strong{display:block;color:#f1d1a1;font-size:15px}.settings-title small{display:block;color:#cbbba4;font-size:11px;margin-top:3px;line-height:1.3}.settings-arrow{color:#e4c28d;font-size:20px;transition:transform .15s}.settings-group[open] .settings-arrow{transform:rotate(180deg)}.settings-body{padding:3px 13px 15px;border-top:1px solid #56725c}.settings-body hr{border:0;border-top:1px solid #56725c;margin:20px 0}.member-edit{display:flex;gap:8px;align-items:center;margin:8px 0}.member-edit input{flex:1;min-width:0;margin:0}.member-edit button{flex:0 0 auto;padding:11px 9px}.settings-body>button{margin-top:8px}

/* V1.7.0: kompakte mobile Papierlisten */
.hist-card{min-width:0}.hist-form-head,.hist-entry-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0 8px}.hist-form-head button,.hist-small{padding:6px 9px;font-size:12px}.hist-inputs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.hist-input{min-width:0;margin:0;background:#1a3e2d;border:1px solid #58775c;border-radius:10px;padding:9px}.hist-input span{display:block;font-weight:700;margin-bottom:5px}.hist-input input{width:100%;min-width:0;margin:0;padding:10px 7px;font-size:17px}.hist-input small{display:block;color:#cdbb9e;margin-top:5px;font-size:11px}.hist-balance{font-size:12px;color:#ddc19c;margin:10px 0}.hist-history{margin-top:16px;border-top:1px solid #5c725c;padding-top:12px}.hist-history summary{cursor:pointer;font-weight:700;color:#e9c58e}.hist-entry{border-bottom:1px solid #4b6752;padding:8px 0}.hist-entry-head{margin:0 0 5px}.hist-entry-head .mini{flex:1;text-align:center;overflow-wrap:anywhere}.hist-values{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}.hist-values span{display:flex;justify-content:space-between;gap:5px;background:#254735;border-radius:5px;padding:5px 7px;font-size:12px}.hist-values small{font-size:11px;color:#d4c5ac}.hist-delete{margin-top:9px;width:100%;border-color:#c68c83;color:#f2b2a9}@media(min-width:700px){.hist-inputs,.hist-values{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* Designauswahl: klassische Vorlage bleibt unverändert. */
body[data-theme="modern"]{background:#10191c;color:#eef3f3}
body[data-theme="modern"] header{background:#172429;border-color:#4b8e88;box-shadow:none}
body[data-theme="modern"] .card{background:#1d2c30;border-color:#375257;border-radius:22px;box-shadow:0 8px 24px #0002}
body[data-theme="modern"] button{background:#294348;border-color:#4b7775;border-radius:13px}
body[data-theme="modern"] button.primary,body[data-theme="modern"] button.active{background:#167a76}
body[data-theme="modern"] h1,body[data-theme="modern"] h2,body[data-theme="modern"] h3,body[data-theme="modern"] .big{color:#92dfd2}
body[data-theme="modern"] input,body[data-theme="modern"] select{background:#142327;border-color:#4b7775}

body[data-theme="light"] .card{background:#fffdf8;border-color:#d6c9b6;box-shadow:0 4px 14px #0001}

<body>
<header><div class="header-inner"><div class="header-brand"><h1 id="appTitle">♠ Doppelkopf Club</h1><div id="headerStats" class="header-stats" aria-label="Clubstatistik"></div><div id="offlineStatus" class="offline-status" aria-live="polite"></div></div><nav id="nav" class="header-nav" aria-label="Hauptnavigation"></nav></div></header>
<main>
<div id="app"></div>
</main>
<script>
"use strict";
const KEY="doko-bronze-v3";
const STAMM=["Tom","Patrick","Manuel","Lukas E.","Lukas T.","Andre"];
const fresh=()=>({
 players:STAMM.map((name,i)=>({id:"s"+i,name,guest:false})),
 evenings:[],cash:[],
 settings:{tack:.2,startFee:5,soloFee:5,bockMultiplier:2,appName:"Doppelkopf Club"}
});
let db;
try{db=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{db=fresh()}
if(!Array.isArray(db.players)||!Array.isArray(db.evenings)||!Array.isArray(db.cash))db=fresh();
db.settings={tack:.2,startFee:5,soloFee:5,bockMultiplier:2,appName:"Doppelkopf Club",...db.settings};
db.evenings.forEach(e=>{
 if(!Array.isArray(e.specials))e.specials=[];
 if(!Array.isArray(e.soloPlayers))e.soloPlayers=[];
 if(!Array.isArray(e.rounds))e.rounds=[];
});
let page="home",eveningId=null,pending=null,selected=null;
let historicalSetup=false;
let winners=[],dragId=null,dragStart=null;
const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=v=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const euro=n=>Number(n||0).toLocaleString("de-DE",{style:"currency",currency:"EUR"});
const name=id=>db.players.find(p=>p.id===id)?.name||"Unbekannt";
const current=()=>db.evenings.find(e=>e.id===eveningId);
const button=(label,action,cls="")=>`<button class="${cls}" onclick="${action}">${label}</button>`;
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert("Speichern fehlgeschlagen: "+e.message)}}
function go(p){if(p==='evening'&&current()?.endedAt){eveningId=null;pending=null;}page=p;if(p==="round")winners=[];if(p==='home')historicalSetup=false;render()}
function render(){
 document.body.dataset.theme=["forest","modern","classic","light"].includes(db.settings.theme)?db.settings.theme:"forest";
 const tabs=[["home","⌂ Start"],["settings","⚙ Mehr"]];
 $("appTitle").textContent="♠ "+(db.settings.appName||"Doppelkopf Club");
 $("headerStats").innerHTML=`<span>Treffen <b>${db.evenings.length}</b></span><span>Spiele <b>${db.evenings.reduce((a,e)=>a+(e.rounds?.length||0),0)}</b></span>`;
 document.title=(db.settings.appName||"Doppelkopf Club")+" · Doppelkopf Club";
 $("nav").innerHTML=page==="seating"?"":tabs.map(([p,t])=>button(t,`go('${p}')`,page===p?"active":"")).join("");
 const views={home,evening,players,cash,settings,seating,round,hochzeit,results,solo,debt,statistics,resultsOverview};
 $("app").innerHTML=(views[page]||home)();
 if(page==="round")previewRound();if(page==="solo")previewSolo();
}

/* Tisch und Mischer */

function sequence(n){
 if(n===4)return["right","bottom1","left","top1"];
 if(n===5)return["right","bottom1","left","top1","top2"];
 return["right","bottom2","bottom1","left","top1","top2"];
}
function positions(n){
 if(n===4)return["top1","left","right","bottom1"];
 if(n===5)return["top1","top2","left","right","bottom1"];
 return["top1","top2","left","right","bottom1","bottom2"];
}
function orderOf(e){
 if(Array.isArray(e.seats)&&e.seats.length===e.present.length)return e.seats;
 if(Array.isArray(e.seatOrder)&&e.seatOrder.length===e.present.length)return e.seatOrder;
 return e.present;
}
function rotation(e){
 const order=orderOf(e),n=order.length;
 const first=Math.max(0,order.indexOf(e.firstMixer));
 const i=(first+e.rounds.length)%n;
 const mixer=order[i],sitting=[];
 if(n===5)sitting.push(mixer);
 if(n===6)sitting.push(mixer,order[(i+3)%n]);
 return{mixer,sitting,playing:order.filter(id=>!sitting.includes(id)),number:e.rounds.length+1};
}
function seat(pos,id,mode,rot){
 const out=rot?.sitting.includes(id),mix=rot?.mixer===id;
 const classes=["seat",pos==="right"?"first":"",id?"filled":"",out?"out":"",mix?"mixer":"",(mode==="round"||mode==="game"||mode==="solo"||mode==="hochzeit")&&!out?"pickable":"",(mode==="round"||mode==="game")&&winners.includes(id)||mode==="solo"&&chosenSolo===id?"selected":""].join(" ");
 const action=mode==="setup"?`onclick="seatTap('${pos}')"`:(mode==="round"||mode==="game")&&id&&!out?`onclick="toggleWinner('${id}')"`:mode==="solo"&&id&&!out?`onclick="chooseSolo('${id}')"`:mode==="hochzeit"&&id&&!out?`onclick="chooseHochzeit('${id}')"`:"";
 return `<div class="${classes}" data-pos="${pos}" ${action}>
 ${id?`<span class="name">${esc(name(id))}</span>`:`<span class="plus">＋</span><span class="hint">HIER ABLEGEN</span>`}
 ${mode==="setup"&&pos==="right"?'<span class="hint">★ 1. MISCHER</span>':""}
 ${(mode==="game"||mode==="round"||mode==="solo"||mode==="hochzeit")&&id?`<span class="hint">${mix?"★ MISCHER":out?"SETZT AUS":"SPIELT"}</span>`:""}
 </div>`;
}
function table(n,assigned,mode="setup",rot=null){
 const ps=positions(n),s=p=>ps.includes(p)?seat(p,assigned[p],mode,rot):"";
 return `<div class="setup ${(mode==="game"||mode==="solo")?"compact-game-table":""}"><div class="layout">
 <div class="top">${s("top1")}${s("top2")}</div>
 <div class="left">${s("left")}</div>
 <div class="felt">${(mode==="game"||mode==="solo")&&rot?`<div class="table-bock">${bockRemaining(editingBase(current()))?`BOCK<small>Noch ${bockRemaining(editingBase(current()))} Runden</small>`:`<span>♣ ♥ ♠ ♦</span>`}</div>`:`<div class="cards">♣ ♥ ♠ ♦</div><strong>Doppelkopf</strong>`}</div>
 <div class="right">${s("right")}</div>
 <div class="bottom">${s("bottom1")}${s("bottom2")}</div>
 </div></div>`;
}

/* Start und Spieler */

function home(){
 return `<div class="tiles">
 ${button("<b>♠</b>Spielabend","go('evening')","tile")}
 ${button("<b>♣</b>Spieler","go('players')","tile")}
 ${button("<b>🏆</b>Ergebnisse","showResults()","tile")}
 ${button("<b>€</b>Kasse","go('cash')","tile")}
 </div><div class="card"><h2>Willkommen im Kartenclub</h2>
 <div class="row"><span>Stammspieler</span><b>${db.players.filter(p=>!p.guest).length}</b></div>
 <div class="row"><span>Spielabende</span><b>${db.evenings.length}</b></div>
 <div class="row"><span>Gespielte Runden</span><b>${db.evenings.reduce((a,e)=>a+e.rounds.length,0)}</b></div>
 </div><div class="card"><h2>Letzte Spielabende</h2>
 ${[...db.evenings].reverse().slice(0,8).map(e=>`<div class="row"><span>${esc(e.date)} · ${e.rounds.length} Runden</span>${button("Öffnen",`openEvening('${e.id}')`)}</div>`).join("")||"Noch kein Spielabend."}
 </div>`;
}
function players(){
 return `<div class="card"><h2>Spieler</h2>${db.players.map(p=>`<div class="row"><span>${esc(p.name)} ${p.guest?"(Gast)":""}</span>${p.guest?button("Entfernen",`removeGuest('${p.id}')`,"danger"):"<small>Stammspieler</small>"}</div>`).join("")}</div>
 <div class="card"><h2>Gast hinzufügen</h2><form onsubmit="addGuest(event)">
 <input id="guestName" placeholder="Name" maxlength="60" required>
 <button class="primary">Hinzufügen</button></form></div>`;
}
function addGuest(ev){
 ev.preventDefault();const n=$("guestName").value.trim();
 if(!n)return;
 if(db.players.some(p=>p.name.toLowerCase()===n.toLowerCase()))return alert("Name existiert bereits.");
 db.players.push({id:uid(),name:n,guest:true});save();render();
}
function removeGuest(id){
 if(db.evenings.some(e=>e.present.includes(id)))return alert("Dieser Gast wird bereits in einem Spielabend verwendet.");
 if(confirm("Gast entfernen?")){db.players=db.players.filter(p=>p.id!==id);save();render()}
}

/* Spielabend erstellen */

function evening(){
 const e=current();
 if(!e)return `<div class="card"><h2>Neuer Spielabend</h2>
 <form onsubmit="createEvening(event)">
 <div class="setup-date"><label>Datum</label><input type="date" id="date" value="${new Date().toLocaleDateString("sv-SE")}" required>
 <h3>Anwesende Spieler</h3>
 ${db.players.map(p=>`<label class="check"><input type="checkbox" name="present" value="${p.id}" ${p.guest?"":"checked"}>${esc(p.name)}</label>`).join("")}
 <p id="setupError" role="alert" style="display:none;color:#ffe2a7;background:#603a2c;border:1px solid #d3a56d;border-radius:9px;padding:11px;margin:10px 0"></p><button class="primary">${historicalSetup?'Nachtrag beginnen':'Weiter zum Kartentisch'}</button></form></div>
 <div class="card"><h2>Vergangene Abende</h2>
 ${[...db.evenings].reverse().map(x=>`<div class="row"><span>${esc(x.date)}</span>${button("Öffnen",`openEvening('${x.id}')`)}</div>`).join("")||"Noch keine Spielabende."}</div>`;
 const rot=rotation(e),order=orderOf(e),assigned={};
 sequence(order.length).forEach((p,i)=>assigned[p]=order[i]);
 const t=totals(e);
 const events=[
 ...e.rounds.map((r,i)=>({kind:"round",r,i})),
 ...e.specials.map(s=>({kind:"special",s}))
 ].sort((a,b)=>(b.kind==="special"?b.s.at||0:b.r.at||0)-(a.kind==="special"?a.s.at||0:a.r.at||0));
 return `<div class="card">
 <div class="row"><h2>Spielabend ${esc(e.date)}</h2>${button("Zurück","eveningId=null;render()")}</div>
 <div class="row"><span class="pill">Runde ${rot.number}</span><b>★ ${esc(name(rot.mixer))} mischt</b></div>
 ${table(e.present.length,assigned,"game",rot)}
 <p class="muted">${rot.sitting.length?"Setzen aus: "+rot.sitting.map(id=>esc(name(id))).join(", "):"Alle vier spielen."}</p>
 <div class="actions">
 ${button("＋ Neue Runde","go('round')","primary")}
 ${button("♛ Hochzeit","go('hochzeit')")}
 ${button("Abrechnung","go('results')")}
 </div></div>
 <div class="card"><h2>Aktueller Stand</h2><div class="scroll"><table>
 <tr><th>Spieler</th><th>Tacken</th><th>€</th></tr>
 ${e.present.map(id=>`<tr><td>${esc(name(id))}</td><td>${t[id]>0?"+":""}${t[id]}</td><td class="${t[id]>=0?"good":"bad"}">${euro(t[id]*db.settings.tack)}</td></tr>`).join("")}
 </table></div></div>
 <div class="card"><h2>Spielverlauf</h2>
 ${events.map(x=>x.kind==="special"
 ?`<div class="row"><div><b>♛ Hochzeit – ${esc(name(x.s.player))}</b><div class="muted">+3 für ${esc(name(x.s.player))}, je −1 für die anderen · kein Mischerwechsel</div></div>${button("✕",`removeSpecial('${x.s.id}')`,"danger")}</div>`
 :`<div class="row"><div><b>Runde ${x.i+1}</b><div class="muted">${x.r.bock?"Bock ×2 · ":""}${x.r.solo?"Solo · ":""}${Object.entries(x.r.points||{}).map(([id,n])=>esc(name(id))+": "+n).join(" · ")}</div></div>${button("✕",`removeRound('${x.r.id}')`,"danger")}</div>`
 ).join("")||"Noch keine Einträge."}</div>`;
}
function createEvening(ev){
 ev.preventDefault();
 const present=[...document.querySelectorAll('input[name="present"]:checked')].map(x=>x.value);
 if(present.length<4||present.length>6)return alert("Bitte 4 bis 6 Spieler wählen.");
 pending={date:$("date").value,present,assigned:{}};selected=null;go("seating");
}
function seating(){
 if(!pending)return `<div class="card">Kein neuer Spielabend.</div>`;
 const used=Object.values(pending.assigned),n=pending.present.length;
 return `<div class="card"><h2>Sitzordnung festlegen</h2>
 <p class="muted">Namen mit dem Finger oder der Maus auf die Plätze ziehen. Alternativ Namen und Platz antippen.</p>
 <div class="name-pool">${pending.present.map(id=>`<div class="chip ${used.includes(id)?"used":""} ${selected===id?"chosen":""}" data-player="${id}" onclick="choose('${id}')">⠿ ${esc(name(id))}</div>`).join("")}</div>
 ${table(n,pending.assigned)}
 <div class="row"><span class="pill">${used.length} von ${n} Plätzen besetzt</span><span class="muted">Rechts: 1. Mischer</span></div>
 <div class="actions">${button("Zurück","pending=null;go('evening')")}${button("Leeren","resetSeats()")}
 <button class="primary" ${used.length===n?"":"disabled"} onclick="finishEvening()">Spielabend starten</button></div></div>`;
}
function choose(id){selected=selected===id?null:id;render()}
function seatTap(pos){
 if(!pending)return;
 if(selected){
  const old=Object.keys(pending.assigned).find(p=>pending.assigned[p]===selected);
  const displaced=pending.assigned[pos];
  if(old)delete pending.assigned[old];
  pending.assigned[pos]=selected;
  if(old&&displaced&&displaced!==selected)pending.assigned[old]=displaced;
  selected=null;render();
 }else if(pending.assigned[pos]){
  selected=pending.assigned[pos];delete pending.assigned[pos];render();
 }
}
function resetSeats(){if(confirm("Sitzplätze leeren?")){pending.assigned={};selected=null;render()}}
/* Touch- und Maus-Drag-and-Drop für die Sitzordnung */
let seatDrag=null;
function clearSeatDrag(){
 if(!seatDrag)return;
 seatDrag.ghost?.remove();
 document.querySelectorAll('.seat.drag-target').forEach(el=>el.classList.remove('drag-target'));
 seatDrag=null;
}
document.addEventListener('pointerdown',ev=>{
 if(page!=='seating'||ev.button>0)return;
 const chip=ev.target.closest('.name-pool .chip');
 if(!chip||chip.classList.contains('used'))return;
 seatDrag={id:chip.dataset.player,x:ev.clientX,y:ev.clientY,active:false,ghost:null};
});
document.addEventListener('pointermove',ev=>{
 if(!seatDrag||page!=='seating')return;
 const d=seatDrag;
 if(!d.active&&Math.hypot(ev.clientX-d.x,ev.clientY-d.y)<8)return;
 if(!d.active){
  d.active=true;
  const ghost=document.createElement('div');
  ghost.className='seat-drag-ghost';ghost.textContent=name(d.id);
  document.body.appendChild(ghost);d.ghost=ghost;
 }
 if(ev.cancelable)ev.preventDefault();
 d.ghost.style.left=ev.clientX+'px';d.ghost.style.top=ev.clientY+'px';
 document.querySelectorAll('.seat.drag-target').forEach(el=>el.classList.remove('drag-target'));
 const slot=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.seat');
 if(slot&&slot.dataset.pos)slot.classList.add('drag-target');
},{passive:false});
document.addEventListener('pointerup',ev=>{
 if(!seatDrag)return;
 const d=seatDrag;
 const slot=d.active?document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.seat'):null;
 const pos=slot?.dataset.pos;
 clearSeatDrag();
 if(page==='seating'&&d.active&&pos){selected=d.id;seatTap(pos)}
});
document.addEventListener('pointercancel',clearSeatDrag);
function finishEvening(){
 if(!pending)return;
 const seats=sequence(pending.present.length).map(p=>pending.assigned[p]);
 if(seats.some(x=>!x))return alert("Alle Plätze besetzen.");
 const e={id:uid(),date:pending.date,present:[...pending.present],seats,firstMixer:pending.assigned.right,rounds:[],specials:[],soloPlayers:[],payments:{}};
 db.evenings.push(e);eveningId=e.id;pending=null;save();go("evening");
}
function openEvening(id){historicalEditIndex=-1;eveningId=id;go(current()?.endedAt?"results":"evening")}

/* Punkte inklusive Sonderbuchungen */

function totals(e){
 const t={};e.present.forEach(id=>t[id]=0);
 e.rounds.forEach(r=>Object.entries(r.points||{}).forEach(([id,n])=>t[id]=(t[id]||0)+Number(n||0)));
 (e.specials||[]).forEach(s=>Object.entries(s.points||{}).forEach(([id,n])=>t[id]=(t[id]||0)+Number(n||0)));
 return t;
}

/* Normale Runde */

function round(){
 const e=current();if(!e)return "Kein Spielabend geöffnet.";
 const rot=rotation(e);
 return `<div class="card"><h2>Runde ${rot.number} erfassen</h2>
 <p>Mischer: <b>${esc(name(rot.mixer))}</b></p>
 <h3>Die zwei Gewinner auswählen</h3>
 <div class="winners">${rot.playing.map(id=>`<button class="winner" id="win_${id}" onclick="toggleWinner('${id}')">${esc(name(id))}</button>`).join("")}</div>
 <label>Gewonnene Tacken je Gewinner</label>
 <input id="points" type="number" min="0" step="1" value="1" oninput="previewRound()">
 <label class="check"><input id="bock" type="checkbox" onchange="previewRound()">Bockrunde ×2</label>
 <label class="check"><input id="solo" type="checkbox" onchange="toggleSolo()">Solo gespielt</label>
 <div id="soloFields" style="display:none">
 <label>Solospieler</label><select id="soloPlayer"><option value="">Bitte wählen</option>${rot.playing.map(id=>`<option value="${id}">${esc(name(id))}</option>`).join("")}</select>
 <p class="muted">Vorläufig werden bei Solo weiterhin vier Einzelwerte eingetragen.</p>
 ${rot.playing.map((id,i)=>`<label>${esc(name(id))}: Solo-Tacken</label><input type="number" step="1" id="sv${i}" value="0" oninput="previewRound()">`).join("")}
 </div>
 <div class="preview" id="preview"></div>
 <div class="actions">${button("Abbrechen","go('evening')")}${button("Runde speichern","saveRound()","primary")}</div>
 </div>`;
}
function toggleWinner(id){
 if(winners.includes(id))winners=winners.filter(x=>x!==id);
 else{if(winners.length===2)winners.shift();winners.push(id)}
 previewRound();
}
function toggleSolo(){
 $("soloFields").style.display=$("solo").checked?"block":"none";
 previewRound();
}
function calcRound(){
 const e=current(),ids=rotation(e).playing,points={};
 const bock=$("bock").checked,solo=$("solo").checked;
 let soloPlayer=null;
 if(solo){
  soloPlayer=$("soloPlayer").value;
  if(!ids.includes(soloPlayer))throw Error("Solospieler auswählen.");
  const values=ids.map((_,i)=>Number($("sv"+i).value));
  if(values.some(n=>!Number.isInteger(n))||values.reduce((a,b)=>a+b,0)!==0)throw Error("Solo-Werte müssen ganze Zahlen sein und zusammen 0 ergeben.");
  ids.forEach((id,i)=>points[id]=values[i]*(bock?2:1));
 }else{
  if(winners.length!==2)throw Error("Genau zwei Gewinner auswählen.");
  const n=Number($("points").value);
  if(!Number.isInteger(n)||n<0)throw Error("Gültige Tackenzahl eingeben.");
  ids.forEach(id=>points[id]=(winners.includes(id)?n:-n)*(bock?2:1));
 }
 return{points,bock,solo,soloPlayer};
}
function previewRound(){
 const e=current();if(!e||!$("preview"))return;
 rotation(e).playing.forEach(id=>{
  const el=$("win_"+id);
  if(el){el.classList.toggle("selected",winners.includes(id));el.textContent=(winners.includes(id)?"✓ ":"")+name(id)}
 });
 try{
  const r=calcRound();
  $("preview").innerHTML="<h3>Automatische Verteilung</h3>"+Object.entries(r.points).map(([id,n])=>`<div class="row"><span>${esc(name(id))}</span><b class="${n>=0?"good":"bad"}">${n>0?"+":""}${n} Tacken</b></div>`).join("");
 }catch(err){$("preview").innerHTML=`<p class="muted">${esc(err.message)}</p>`}
}
function saveRound(){
 const e=current();if(!e)return;
 let r;try{r=calcRound()}catch(err){return alert(err.message)}
 const rot=rotation(e);
 e.rounds.push({id:uid(),at:Date.now(),...r,mixer:rot.mixer,playing:[...rot.playing],sitting:[...rot.sitting]});
 e.soloPlayers=[...new Set(e.rounds.filter(x=>x.solo&&x.soloPlayer).map(x=>x.soloPlayer))];
 save();go("evening");
}
function removeRound(id){
 const e=current();if(!e||!confirm("Runde löschen?"))return;
 e.rounds=e.rounds.filter(r=>r.id!==id);
 e.soloPlayers=[...new Set(e.rounds.filter(x=>x.solo&&x.soloPlayer).map(x=>x.soloPlayer))];
 save();render();
}

/* Hochzeit: eigenständige Sonderbuchung */

function hochzeit(){

 const rot=rotation(e);
 return `<div class="card">
 <h2>♛ Hochzeit erfassen</h2>

 <div class="preview" id="hPreview"><p class="muted">Bitte Hochzeiter auswählen.</p></div>
 <div class="actions">
 ${button("Abbrechen","go('evening')")}

}
let hochzeiter=null;
function chooseHochzeit(id){
 const e=current(),rot=rotation(e);
 if(!rot.playing.includes(id))return;
 hochzeiter=id;
 rot.playing.forEach(p=>{
  const el=$("h_"+p);
  el.classList.toggle("selected",p===id);
  el.textContent=(p===id?"✓ ":"")+name(p);
 });
 $("hPreview").innerHTML="<h3>Sondertacken</h3>"+
 rot.playing.map(p=>{
  const n=p===id?3:-1;
  return `<div class="row"><span>${esc(name(p))}</span><b class="${n>0?"good":"bad"}">${n>0?"+":""}${n} Tacken</b></div>`;
 }).join("")+

function saveHochzeit(){

  playing:[...rot.playing],
  mixer:rot.mixer,
  beforeRound:rot.number
 });
 hochzeiter=null;
 save();go("evening");
}
function removeSpecial(id){

 e.specials=e.specials.filter(s=>s.id!==id);

}

function backup(){
 const payload={...db,backupMeta:{app:'Doppelkopf Club',version:APP_VERSION,createdAt:new Date().toISOString()}};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');
 const date=new Date().toISOString().slice(0,10);
 a.href=url;a.download='Doppelkopf-Backup-'+date+'.json';document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),10000);
}
function validateBackup(d){
 if(!d||typeof d!=='object'||!Array.isArray(d.players)||!Array.isArray(d.evenings)||!Array.isArray(d.cash))throw Error('Ungültige Backup-Datei.');
 if(!d.settings||typeof d.settings!=='object'||Array.isArray(d.settings))throw Error('Einstellungen fehlen.');
 if(d.players.some(p=>!p||typeof p.id!=='string'||typeof p.name!=='string'))throw Error('Spielerdaten sind ungültig.');
 if(d.evenings.some(e=>!e||!Array.isArray(e.rounds)||!Array.isArray(e.present)))throw Error('Spielabende sind unvollständig.');
 if(d.cash.some(c=>!c||typeof c!=='object'))throw Error('Kassenbuch ist ungültig.');
 if(new Set(d.players.map(p=>p.id)).size!==d.players.length)throw Error('Doppelte Spieler-IDs im Backup.');
}
async function restore(ev){
 try{
  const file=ev.target.files[0];if(!file)return;
  if(file.size>30*1024*1024)throw Error('Backup ist zu groß (max. 30 MB).');
  const d=JSON.parse(await file.text());validateBackup(d);
  const question='Backup mit '+d.players.length+' Spielern und '+d.evenings.length+' Spielabenden einspielen? Die aktuellen Daten werden ersetzt. Bitte vorher ein Backup herunterladen.';
  if(!confirm(question))return;
  db=d;db.settings={tack:.2,startFee:5,soloFee:5,bockMultiplier:2,appName:'Doppelkopf Club',...db.settings};
  db.evenings.forEach(e=>{if(!Array.isArray(e.specials))e.specials=[];if(!Array.isArray(e.soloPlayers))e.soloPlayers=[];if(!Array.isArray(e.rounds))e.rounds=[]});
  eveningId=null;pending=null;save();go('home');
  alert('Backup erfolgreich wiederhergestellt.');
 }catch(err){alert('Import fehlgeschlagen: '+err.message)}
 finally{if(ev.target)ev.target.value=''}
}

const oldRender=render;
function stamp(ms){return ms?new Date(ms).toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'}):'–'}
function isClosed(e){return !!e.endedAt}
function assertOpen(e){if(!e||isClosed(e)){alert('Dieser Spielabend ist abgeschlossen und kann nicht mehr verändert werden.');return false}return true}
function bockRemaining(e){let remain=e.present.length;for(const r of e.rounds){if(remain>0)remain--;if(r.triggers?.length)remain+=e.present.length;}return remain}
function bockBefore(e){return bockRemaining(e)>0}
function bockFactor(){return Number(db.settings.bockMultiplier)||2}
function bockBanner(e){let n=bockRemaining(e);return `<div class="bockbar ${n?'':'off'}">${n?'BOCK · noch '+n+' Runden':'Kein Bock'}</div>`}
function soloCount(e,id){return e.rounds.filter(r=>r.solo&&r.soloPlayer===id).length}
function allEvents(e){return [...e.rounds.map((r,i)=>({kind:'round',r,i,at:r.at||0})),...(e.specials||[]).map(s=>({kind:'special',s,at:s.at||0}))].sort((a,b)=>b.at-a.at)}
function dueRows(e){
 const t=totals(e),fees=e.present.map(id=>({id,fee:db.settings.startFee+(e.historical?0:(soloCount(e,id)?0:db.settings.soloFee))+Math.max(0,-t[id]*db.settings.tack),present:true}));
 const max=fees.length?Math.max(...fees.map(x=>x.fee)):0;
 for(const p of db.players.filter(p=>!p.guest&&!e.present.includes(p.id)))fees.push({id:p.id,fee:max,present:false});
 return fees;
}
function paidAmount(e,id){if(e.historical)return dueRows(e).find(x=>x.id===id)?.fee||0;return (e.payments?.[id]||[]).reduce((a,x)=>a+Number(x.amount||0),0)}

function chooseHost(id){
 const boxes=[...document.querySelectorAll('input[name="hostChoice"]')];
 const chosen=boxes.find(x=>x.value===id);
 if(!chosen)return;
 if(chosen.checked){
  boxes.forEach(x=>{if(x!==chosen)x.checked=false});
  const player=[...document.querySelectorAll('input[name="present"]')].find(x=>x.value===id);
  if(player)player.checked=true;
 }
}

 const present=[...document.querySelectorAll('input[name="present"]')].find(x=>x.value===id);
 if(present&&!present.checked){const host=[...document.querySelectorAll('input[name="hostChoice"]')].find(x=>x.value===id);if(host)host.checked=false;}
}

function createEvening(ev){ev.preventDefault();const present=[...document.querySelectorAll('input[name="present"]:checked')].map(x=>x.value);if(present.length<4||present.length>6)return setupError('Bitte 4 bis 6 Spieler wählen.');const hosts=[...document.querySelectorAll('input[name="hostChoice"]:checked')].map(x=>x.value);if(hosts.length!==1||!present.includes(hosts[0]))return setupError('Bitte einen anwesenden Gastgeber auswählen.');const host=hosts[0];pending={date:$('date').value,host,present,assigned:{},historical:historicalSetup,historicalMode};selected=null;if(historicalSetup){finishHistoricalEvening();return}go('seating')}
function finishEvening(){if(!pending)return;const seats=sequence(pending.present.length).map(p=>pending.assigned[p]);if(seats.some(x=>!x))return alert('Alle Plätze besetzen.');const e={id:uid(),date:pending.date,host:pending.host,startedAt:Date.now(),endedAt:null,present:[...pending.present],seats,firstMixer:pending.assigned.right,rounds:[],specials:[],soloPlayers:[],payments:{},historical:!!pending.historical};db.evenings.push(e);eveningId=e.id;pending=null;historicalSetup=false;save();go('evening')}

let editingLastRoundId=null;
function lastRound(e){return e?.rounds?.length?e.rounds[e.rounds.length-1]:null}
function undoLastRound(){const e=current();if(!assertOpen(e)||!lastRound(e))return;const r=e.rounds.pop();e.soloPlayers=[...new Set(e.rounds.filter(x=>x.solo).map(x=>x.soloPlayer))];editingLastRoundId=null;save();go('evening')}
function editLastRound(){const e=current();if(!assertOpen(e))return;const r=lastRound(e);if(!r)return;editingLastRoundId=r.id;const isSolo=!!r.solo;go(isSolo?'solo':'round');if(isSolo){chosenSolo=r.soloPlayer;document.querySelectorAll('input[name="soloKind"]').forEach(x=>x.checked=x.value===(r.soloType||'Damen-Solo'));$('soloLost').checked=!r.soloWon;$('soloPoints').value=Math.abs(r.points[r.soloPlayer]||0)/(r.bock?(r.bockFactor||2)*3:3);previewSolo()}else{winners=Object.entries(r.points).filter(([id,n])=>n>=0).map(([id])=>id).slice(0,2);$('points').value=Math.abs(Object.values(r.points)[0]||0)/(r.bock?(r.bockFactor||2):1);previewRound()}document.querySelectorAll('.trigger').forEach(el=>el.checked=(r.triggers||[]).includes(el.value));isSolo?previewSolo():previewRound()}

function saveCorrectedRound(r){const e=current();if(!assertOpen(e))return false;const old=lastRound(e);if(!old||old.id!==editingLastRoundId)return false;e.rounds[e.rounds.length-1]={...old,...r};e.soloPlayers=[...new Set(e.rounds.filter(x=>x.solo).map(x=>x.soloPlayer))];editingLastRoundId=null;winners=[];chosenSolo=null;save();go('evening');return true}
function triggersHtml(){return `<details class="bock-extra"><summary>Bockauslöser</summary><div class="triggers">${['120:120','Null Tacken','Herz-Doppelkopf'].map((t,i)=>`<label><input type="checkbox" class="trigger" value="${t}" onchange="${page==='solo'?'previewSolo()':'previewRound()'}">${t}</label>`).join('')}</div><p class="mini">Mehrere Auslöser in einer Runde starten zusammen nur eine neue Bockfolge.</p></details>`}

function round(){const e=current();if(!assertOpen(e))return '<div class="card">Abend abgeschlossen.</div>';const rot=rotation(editingBase(e)),order=orderOf(e),assigned={};sequence(order.length).forEach((p,i)=>assigned[p]=order[i]);return `<div class="card"><h2>Runde ${rot.number} auszählen</h2><p>★ Mischer: <b>${esc(name(rot.mixer))}</b></p>${bockBanner(editingBase(e))}<p class="round-guide">1. Zwei Gewinner direkt am Kartentisch antippen. 2. Tacken auswählen – die Runde wird sofort gebucht.</p>${table(e.present.length,assigned,'round',rot)}<p class="mini">${rot.sitting.length?'Setzen aus: '+rot.sitting.map(id=>esc(name(id))).join(', '):'Alle vier spielen.'}</p><p id="winnerStatus" class="round-guide">Noch keine Gewinner ausgewählt.</p>${triggersHtml()}<h3>Tacken je Gewinner</h3><div class="quick-tacken">${[1,2,3,4,5,6,7].map(n=>`<button type="button" onclick="quickSaveRound(${n})" aria-label="${n} Tacken und Runde beenden">${n}</button>`).join('')}</div><label for="points">Anderer Wert (auch 0 oder über 7)</label><div class="actions"><input id="points" type="number" min="0" step="1" inputmode="numeric" placeholder="Tacken" style="max-width:160px" oninput="previewRound()">${button('Wert buchen','saveRound()','primary')}</div><div id="roundError" class="preview" role="alert" style="display:none;color:#ffcfaa"></div><div class="preview" id="preview"></div><div class="actions">${button('Abbrechen',"editingLastRoundId=null;go('evening')")}</div></div>`}
function quickSaveRound(n){if(winners.length!==2)return roundError('Bitte zuerst genau zwei Gewinner am Kartentisch antippen.');$('points').value=n;saveRound()}
function previewRound(){const e=current();if(!e||!$('preview'))return;const status=$('winnerStatus');if(status)status.textContent=winners.length===2?'✓ Gewinner: '+winners.map(name).join(' & '):winners.length===1?'Noch einen Gewinner auswählen.':'Noch keine Gewinner ausgewählt.';document.querySelectorAll('.seat.pickable').forEach(el=>{const id=el.getAttribute('onclick')?.match(/toggleWinner\('([^']+)'\)/)?.[1];el.classList.toggle('selected',winners.includes(id))});const err=$('roundError');if(err&&winners.length===2)err.style.display='none';if(winners.length!==2){$('preview').innerHTML='<p class="muted">Zwei Gewinner auswählen.</p>';return}const raw=$('points').value;if(raw===''){$('preview').innerHTML='<p class="muted">Jetzt 1–7 Tacken antippen oder anderen Wert eingeben.</p>';return}try{const r=calcRound();$('preview').innerHTML='<h3>Automatische Verteilung</h3>'+Object.entries(r.points).map(([id,n])=>`<div class="row"><span>${esc(name(id))}</span><b class="${n>=0?'good':'bad'}">${n>0?'+':''}${n} Tacken</b></div>`).join('')}catch(err){$('preview').innerHTML=`<p class="muted">${esc(err.message)}</p>`}}

function calcRound(){const e=current(),ids=rotation(editingBase(e)).playing,points={},n=Number($('points').value),bock=editingBock(e);if(winners.length!==2)throw Error('Genau zwei Gewinner auswählen.');if($('points').value===''||!Number.isInteger(n)||n<0)throw Error('Gültige Tackenzahl eingeben.');ids.forEach(id=>points[id]=(winners.includes(id)?n:-n)*(bock?bockFactor():1));return {points,bock,bockFactor:bock?bockFactor():1,solo:false,soloPlayer:null,triggers:selectedTriggers()}}
function roundError(message){const el=$('roundError');if(el){el.textContent=message;el.style.display='block';el.scrollIntoView({block:'nearest'});}else alert(message)}
function saveRound(){const e=current();if(!assertOpen(e))return;let r;try{r=calcRound()}catch(err){return roundError(err.message)}if(editingLastRoundId){saveCorrectedRound(r);return}const rot=rotation(e);e.rounds.push({id:uid(),at:Date.now(),...r,mixer:rot.mixer,playing:[...rot.playing],sitting:[...rot.sitting]});winners=[];save();go('evening')}
function solo(){const e=current();if(!assertOpen(e))return '<div class="card">Abend abgeschlossen.</div>';const rot=rotation(editingBase(e)),order=orderOf(e),assigned={};sequence(order.length).forEach((p,i)=>assigned[p]=order[i]);return `<div class="card compact-evening compact-solo"><div class="row"><h2>♠ Solo · Runde ${rot.number}</h2>${button('Zurück',"editingLastRoundId=null;chosenSolo=null;go('evening')")}</div><div class="row game-meta"><span>★ ${esc(name(rot.mixer))} mischt</span><span>${bockRemaining(editingBase(e))?'BOCK · '+bockRemaining(editingBase(e))+' Runden':'Kein Bock'}</span></div>${table(e.present.length,assigned,'solo',rot)}<div id="soloStatus" class="round-guide">${chosenSolo?'✓ '+esc(name(chosenSolo))+' gewählt':'Solospieler am Tisch antippen'}</div><div class="solo-choices compact-solo-choices">
 <label class="check"><input type="checkbox" name="soloKind" value="Damen-Solo" checked onchange="chooseSoloKind(this)"> Damen</label>

 <div class="tacken-caption">Tacken</div><div class="quick-tacken">${[1,2,3,4,5,6,7].map(n=>`<button type="button" onclick="quickSaveSolo(${n})" aria-label="${n} Tacken und Solo buchen">${n}</button>`).join('')}</div><div class="actions"><input id="soloPoints" type="number" min="0" step="1" inputmode="numeric" placeholder="Andere Tacken" style="max-width:150px" oninput="previewSolo()">${button('Wert buchen','saveSolo()','primary')}</div><div id="roundError" class="preview" role="alert" style="display:none;color:#ffcfaa"></div><div class="preview" id="soloPreview"></div>${triggersHtml()}</div>`}

function calcSolo(){const e=current(),ids=rotation(editingBase(e)).playing;if(!ids.includes(chosenSolo))throw Error('Solospieler auswählen.');const n=Number($('soloPoints').value);if($('soloPoints').value===''||!Number.isInteger(n)||n<0)throw Error('Gültige Tackenzahl eingeben.');const bock=editingBock(e),won=!$('soloLost').checked,points={};ids.forEach(id=>points[id]=(id===chosenSolo?(won?3:-3):(won?-1:1))*n*(bock?bockFactor():1));return {points,bock,bockFactor:bock?bockFactor():1,solo:true,soloPlayer:chosenSolo,soloType:document.querySelector('input[name="soloKind"]:checked')?.value||'Damen-Solo',soloWon:won,triggers:selectedTriggers()}}

function hochzeit(){const e=current();if(!assertOpen(e))return '<div class="card">Abend abgeschlossen.</div>';const rot=rotation(e),order=orderOf(e),assigned={};sequence(order.length).forEach((p,i)=>assigned[p]=order[i]);return `<div class="card"><h2>♛ Hochzeit erfassen</h2><p class="round-guide">Hochzeiter direkt am Kartentisch antippen. Die Sondertacken werden sofort gebucht: +3 für den Hochzeiter, je −1 für die drei anderen Aktiven.</p><p>★ Mischer: <b>${esc(name(rot.mixer))}</b> · bleibt bei Hochzeit stehen</p>${table(e.present.length,assigned,'hochzeit',rot)}<p class="mini">${rot.sitting.length?'Setzen aus: '+rot.sitting.map(id=>esc(name(id))).join(', '):'Alle vier spielen.'}</p><div class="actions">${button('Abbrechen',"go('evening')")}</div></div>`}

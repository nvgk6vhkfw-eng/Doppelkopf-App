<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#193b2d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Doppelkopf"><title>Doppelkopf – Rundenmanager</title><style>
:root{--bg:#102a22;--panel:#1b3d30;--panel2:#294b3b;--bronze:#dfb37a;--cream:#f4eee1;--muted:#c7c2b1;--line:#476654;--red:#e5a49b;--green:#a9dbb5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--cream);font:16px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.app{max-width:1100px;margin:auto;padding:16px 14px 95px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}h1{font-size:23px;margin:0;color:var(--bronze)}h2{font-size:20px;margin:0 0 12px;color:var(--bronze)}h3{font-size:16px;margin:14px 0 9px;color:var(--bronze)}p{line-height:1.45}.muted,small{color:var(--muted)}.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:16px;margin-bottom:13px}.soft{background:var(--panel2);border-radius:12px;padding:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.stack{display:grid;gap:10px}.btn{border:1px solid #aa865a;background:#a87a4c;color:#fff;border-radius:11px;padding:11px 14px;font-weight:650}.btn.alt{background:var(--panel2);border-color:var(--line)}.btn.danger{background:#713e38;border-color:#a16c63}.btn.ghost{background:transparent;border-color:var(--line)}.btn.small{padding:7px 10px;font-size:13px}.btn.full{width:100%}.chip{background:var(--panel2);border:1px solid #587764;border-radius:11px;color:var(--cream);padding:10px 12px}.chip.on{background:#9e7044;border-color:#edc48d;color:white}.chip:disabled{opacity:.35}.chips{display:flex;gap:8px;flex-wrap:wrap}label{display:block;font-size:13px;color:var(--muted);margin:0 0 5px}input,select{width:100%;background:#2a4b3c;border:1px solid #6a8974;color:white;padding:12px;border-radius:10px;min-height:45px}input[type=checkbox]{width:auto;min-height:auto;accent-color:#bd8d53}input[type=number]{max-width:160px}.nav{position:fixed;bottom:0;left:0;right:0;background:#142f26;border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom));z-index:10}.nav button{border:0;background:none;color:var(--muted);padding:9px 13px;flex:1;max-width:150px;font-size:13px}.nav button.active{color:var(--bronze);font-weight:800}.pill{display:inline-block;border-radius:30px;padding:5px 10px;font-size:12px;background:#315944;color:#c7e6d1}.pill.warn{background:#65472d;color:#ffe2b5}.pill.red{background:#643b38;color:#ffd2c8}.stat{font-size:23px;font-weight:750;color:var(--bronze)}.table{width:100%;border-collapse:collapse}.table th,.table td{border-bottom:1px solid var(--line);padding:10px 6px;text-align:left}.table td:last-child,.table th:last-child{text-align:right}.plus{color:var(--green)}.minus{color:var(--red)}.tablewrap{overflow-x:auto}.timeline{border-left:2px solid #6e8d72;padding-left:14px;margin-left:6px}.event{position:relative;margin:0 0 16px}.event:before{content:'';position:absolute;width:10px;height:10px;border-radius:50%;background:var(--bronze);left:-20px;top:5px}.tabletop{background:radial-gradient(ellipse,#32664a,#1b4635);border:7px solid #785b3b;border-radius:44%;min-height:270px;position:relative;margin:16px auto;max-width:480px;box-shadow:inset 0 0 0 2px #b18c59;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);align-items:center;justify-items:center;padding:15px 7px}.seat{min-width:0;max-width:130px;width:100%;text-align:center;background:#214534;border:1px solid #8f7953;border-radius:13px;padding:9px 4px;font-size:12px}.seat.out{opacity:.4}.seat.dealer{border:2px solid var(--bronze)}.seat strong{display:block;font-size:13px}.seat span{font-size:11px;color:#e2c99d}.centerlogo{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#d1b182;opacity:.4;font-size:24px;pointer-events:none}.notice{padding:12px;border:1px solid #9c7948;background:#483c2d;border-radius:11px;color:#f7dbb4}.file{display:none}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(min-width:800px){.content2{display:grid;grid-template-columns:1.05fr .95fr;gap:15px;align-items:start}}@media(max-width:380px){.app{padding:10px 9px 92px}.card{padding:12px}.seat{font-size:11px;padding:8px 2px}.btn{padding:10px}}
</style></head><body><div id="app" class="app"></div><nav class="nav" id="nav"></nav><input type="file" id="restore" class="file" accept="application/json,.json"><script>
(()=>{'use strict';
const KEY='doko-bronze-v2',OLD='doko-bronze-v1',DEFAULT=['Tom','Patrick','Manuel','Lukas E.','Lukas T.','Andre'];
const $=id=>document.getElementById(id),now=()=>new Date().toISOString(),id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8),round2=n=>Math.round((Number(n)||0)*100)/100,money=n=>round2(n).toLocaleString('de-DE',{style:'currency',currency:'EUR'}),dt=s=>s?new Date(s).toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'}):'–',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state={players:DEFAULT.map(name=>({id:id(),name,regular:true})),evenings:[],settings:{tack:0.2,fee:5,soloFine:5,absentExtra:10},tab:'home',form:'normal',selectedWinners:[],selectedSolo:null,selectedWedding:null,selectedTriggers:[],seatDraft:[],attendanceDraft:[],guestDraft:[],hostDraft:'',modeDraft:'fehl',entryType:'normal',importNotice:''};
function save(){try{localStorage.setItem(KEY,JSON.stringify({players:state.players,evenings:state.evenings,settings:state.settings}))}catch(e){alert('Speichern fehlgeschlagen. Bitte Speicherplatz prüfen und eine Sicherung erstellen.')}}
function init(){try{let raw=localStorage.getItem(KEY);if(raw){let d=JSON.parse(raw);state.players=d.players||state.players;state.evenings=d.evenings||[];state.settings={...state.settings,...d.settings}}else if(localStorage.getItem(OLD)){state.importNotice='Es gibt Daten einer älteren App-Version. Diese werden aus Sicherheitsgründen nicht automatisch überschrieben. Bitte erst eine JSON-Sicherung der alten Version erstellen und die Datenmigration prüfen.'}}catch(e){state.importNotice='Gespeicherte Daten konnten nicht gelesen werden. Bitte keine alten Daten überschreiben.'}state.hostDraft=state.players[0]?.id||'';render()}
const player=pid=>state.players.find(p=>p.id===pid),name=pid=>player(pid)?.name||'Unbekannt',activeEvening=()=>state.evenings.find(e=>!e.endedAt),lastEvening=()=>activeEvening()||state.evenings.at(-1),attendance=e=>e.attendees||[],seat=e=>e.seats||[],dealerIndex=e=>e.rounds.length%seat(e).length,playersIn=e=>{let s=seat(e),n=s.length;if(n<4)return [];let i=dealerIndex(e);let out=new Set();if(n===5)out.add(i);if(n===6){out.add(i);out.add((i+3)%6)}return s.filter((_,j)=>!out.has(j))},isDealer=(e,pid)=>seat(e)[dealerIndex(e)]===pid;
function score(e){let scores={};for(let p of e.attendees)scores[p]=0;for(let r of e.rounds||[])for(let [pid,val] of Object.entries(r.delta||{}))scores[pid]=round2((scores[pid]||0)+val);for(let x of e.specials||[])for(let [pid,val] of Object.entries(x.delta||{}))scores[pid]=round2((scores[pid]||0)+val);return scores}
function solos(e){let c={};for(let p of e.attendees)c[p]=0;for(let r of e.rounds)if(r.type==='solo')c[r.soloist]=(c[r.soloist]||0)+1;return c}
function cash(e){let s=score(e),sol=solos(e),all=state.players.filter(p=>p.regular||e.attendees.includes(p.id)),present=e.attendees.map(pid=>{let loss=Math.max(0,-(s[pid]||0)*state.settings.tack);let due=round2(state.settings.fee+loss+(sol[pid]?0:state.settings.soloFine));return {pid,due,reason:'Anwesend'}});let max=Math.max(0,...present.map(x=>x.due));let absent=all.filter(p=>p.regular&&!e.attendees.includes(p.id)).map(p=>({pid:p.id,due:round2(max+state.settings.absentExtra),reason:'Abwesend'}));return [...present,...absent]}
function bockRemaining(e){return Math.max(0,(e.bockInitial??e.attendees.length)+(e.bockAdded||0)-(e.rounds||[]).length)}
function render(){let e=lastEvening(),a=activeEvening();$('app').innerHTML=`<header><div><h1>♣ Doppelkopf</h1><small>Rundenmanager · offline</small></div><span class="pill ${a?'warn':''}">${a?'● Spielabend läuft':'Kein Abend aktiv'}</span></header>${state.importNotice?`<div class="notice">${esc(state.importNotice)}</div>`:''}${state.tab==='home'?home():state.tab==='game'?game(e):state.tab==='players'?playersPage():state.tab==='cash'?cashPage(e):morePage(e)}`;$('nav').innerHTML=[['home','⌂','Start'],['game','♠','Spiel'],['players','♙','Spieler'],['cash','€','Kasse'],['more','☰','Mehr']].map(([t,i,l])=>`<button class="${state.tab===t?'active':''}" data-tab="${t}"><div style="font-size:21px">${i}</div>${l}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});bind()}
function home(){let a=activeEvening(),e=lastEvening();return `<div class="card"><h2>${a?'Aktueller Spielabend':'Spielabend starten'}</h2>${a?`<div class="grid"><div class="soft"><small>Gastgeber</small><div class="stat">${esc(name(a.host))}</div></div><div class="soft"><small>Start</small><strong>${dt(a.startedAt)}</strong></div><div class="soft"><small>Gespielte Runden</small><div class="stat">${a.rounds.length}</div></div><div class="soft"><small>Bockspiele offen</small><div class="stat">${bockRemaining(a)}</div></div></div><p><button class="btn full" data-go="game">Zum Kartentisch</button></p>`:newEveningForm()}</div>${e?`<div class="card"><h2>${a?'Zwischenstand':'Letzter Spielabend'}</h2><p class="muted">${dt(e.startedAt)} · Gastgeber ${esc(name(e.host))}${e.endedAt?' · Ende '+dt(e.endedAt):''}</p>${standings(e)}</div>`:''}<div class="card"><h2>Gesamtübersicht</h2>${totalStandings()}</div>`}
function newEveningForm(){let regular=state.players.filter(p=>p.regular);if(!state.attendanceDraft.length)state.attendanceDraft=regular.map(p=>p.id);if(!state.seatDraft.length)state.seatDraft=[...state.attendanceDraft];return `<div class="stack"><div><label>Gastgeber (manuell auswählen)</label><select id="host">${regular.map(p=>`<option value="${p.id}" ${state.hostDraft===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div><label>Anwesende Stammspieler (4–6 Spieler am Tisch, Gäste möglich)</label><div class="chips">${regular.map(p=>`<button class="chip ${state.attendanceDraft.includes(p.id)?'on':''}" data-attend="${p.id}">${esc(p.name)}</button>`).join('')}</div></div><div class="row"><label>Gast hinzufügen (nur für diesen Abend)</label><button class="btn alt small" data-action="addGuest">+ Gast</button></div>${state.guestDraft.length?`<div class="chips">${state.guestDraft.map(p=>`<span class="chip on">${esc(p.name)} <button class="btn small ghost" data-removeguest="${p.id}">×</button></span>`).join('')}</div>`:''}<div><label>Sitzreihenfolge – durch Tippen auf die Pfeile ändern (rechts beginnt der Geber)</label>${state.seatDraft.filter(pid=>state.attendanceDraft.includes(pid)||state.guestDraft.some(p=>p.id===pid)).map((pid,i)=>`<div class="row soft" style="margin-bottom:5px"><span>${i+1}. ${esc(nameDraft(pid))}</span><span><button class="btn alt small" data-seatmove="${pid}:-1">↑</button> <button class="btn alt small" data-seatmove="${pid}:1">↓</button></span></div>`).join('')}</div><div><label>Regel für den Abend</label><select id="mode"><option value="fehl" ${state.modeDraft==='fehl'?'selected':''}>Erster fremder Fehlstich</option><option value="kontra" ${state.modeDraft==='kontra'?'selected':''}>Kontrastich</option></select></div><button class="btn full" data-action="start">Spielabend starten</button><small>Die Start-Bockphase beginnt automatisch und läuft über so viele Spiele, wie Personen anwesend sind.</small></div>`}
function nameDraft(pid){return state.guestDraft.find(p=>p.id===pid)?.name||name(pid)}
function standings(e){let s=score(e),so=solos(e);return `<div class="tablewrap"><table class="table"><thead><tr><th>Spieler</th><th>Solo</th><th>Tacken</th><th>Gewinn/Verlust</th></tr></thead><tbody>${e.attendees.map(pid=>`<tr><td>${esc(name(pid))}</td><td>${so[pid]||0}${so[pid]?' ✓':' ✗'}</td><td class="${s[pid]>=0?'plus':'minus'}">${s[pid]>0?'+':''}${s[pid]||0}</td><td class="${s[pid]>=0?'plus':'minus'}">${money((s[pid]||0)*state.settings.tack)}</td></tr>`).join('')}</tbody></table></div>`}
function totalStandings(){let sums={};for(let e of state.evenings)for(let [pid,val] of Object.entries(score(e)))sums[pid]=round2((sums[pid]||0)+val);return `<div class="tablewrap"><table class="table"><tr><th>Spieler</th><th>Gesamt-Tacken</th><th>Wert</th></tr>${state.players.filter(p=>p.regular).map(p=>`<tr><td>${esc(p.name)}</td><td>${sums[p.id]||0}</td><td>${money((sums[p.id]||0)*state.settings.tack)}</td></tr>`).join('')}</table></div>`}
function game(e){if(!e)return `<div class="card"><h2>Kein Spielabend vorhanden</h2><button class="btn" data-go="home">Spielabend anlegen</button></div>`;let running=!e.endedAt,act=running?playersIn(e):[],remaining=bockRemaining(e),si=seat(e),di=running?dealerIndex(e):0,seatOrder=si.length===6?[4,5,3,0,2,1]:si.length===5?[3,4,2,0,1]:[2,3,1,0];return `<div class="card"><div class="row"><div><h2>Spielabend · ${esc(name(e.host))}</h2><small>Beginn ${dt(e.startedAt)}${e.endedAt?' · Ende '+dt(e.endedAt):''}</small></div><span class="pill ${running?'warn':''}">${running?'Offen':'Abgeschlossen'}</span></div>${running?`<div class="notice" style="margin-top:12px"><div class="row"><strong>${remaining?'🔥 Bock ×2':'Kein Bock aktiv – einfache Tacken'}</strong><strong>${remaining?'Noch '+remaining+' Bockspiele':'×1'}</strong></div></div>`:''}<div class="tabletop"><div class="centerlogo">♣ ♥ ♠ ♦</div>${seatOrder.map((j,k)=>{let pid=si[j],isout=running&&!act.includes(pid),pos=si.length===6?[[1,1],[1,3],[2,1],[2,3],[3,1],[3,3]][k]:si.length===5?[[1,1],[1,3],[2,1],[2,3],[3,2]][k]:[[1,1],[1,3],[3,1],[3,3]][k];return `<div class="seat ${isout?'out':''} ${running&&j===di?'dealer':''}" style="grid-row:${pos[0]};grid-column:${pos[1]}"><strong>${esc(name(pid))}</strong><span>${running&&j===di?'Mischt / setzt aus':isout?'Setzt aus':'Spielt'}</span></div>`}).join('')}</div>${running?`<p class="muted">Aktive Spieler: ${act.map(name).join(', ')}</p><div class="chips"><button class="btn ${state.form==='normal'?'':'alt'}" data-form="normal">Neue Runde</button><button class="btn ${state.form==='solo'?'':'alt'}" data-form="solo">Solo</button><button class="btn ${state.form==='wedding'?'':'alt'}" data-form="wedding">Hochzeit</button></div><div class="soft" style="margin-top:13px">${state.form==='normal'?normalForm(e,act):state.form==='solo'?soloForm(e,act):weddingForm(e,act)}</div>`:''}</div><div class="card"><div class="row"><h2>Spielprotokoll</h2><span class="pill">${e.rounds.length} Runden</span></div>${history(e)}</div><div class="card"><h2>Abendübersicht</h2>${standings(e)}${running?`<p><button class="btn danger full" data-action="close">Spielabend endgültig beenden</button></p>`:`<p class="notice">Spielabend abgeschlossen. ${e.expiredBock||0} offene Bockspiele sind verfallen. Änderungen sind nicht mehr möglich.</p>`}</div>`}
function normalForm(e,act){return `<h3>Normales Spiel</h3><label>Die beiden Gewinner auswählen</label><div class="chips">${act.map(pid=>`<button class="chip ${state.selectedWinners.includes(pid)?'on':''}" data-winner="${pid}">${esc(name(pid))}</button>`).join('')}</div><p><label>Grund-Tacken pro Gewinner (vor Bock)</label><input type="number" id="normalPoints" min="0" step="1" value="1"></p><label>Zusatzpunkte (Fuchs / Charly) je Spieler – optional, vor Bock</label><div class="grid">${act.map(pid=>`<div><label>${esc(name(pid))}</label><input type="number" id="extra_${pid}" step="1" value="0"></div>`).join('')}</div><h3>Bockauslöser</h3><div class="chips">${[['equal','120:120'],['zero','Null Tacken'],['heart','Herz-Doppelkopf']].map(([k,l])=>`<button class="chip ${state.selectedTriggers.includes(k)?'on':''}" data-trigger="${k}">${l}</button>`).join('')}</div><small>Auch mehrere Auslöser in derselben Runde erzeugen nur eine neue Bockphase.</small><p><button class="btn full" data-action="normal">Runde buchen</button></p>`}
function soloForm(e,act){return `<h3>Solo erfassen</h3><label>Solospieler</label><div class="chips">${act.map(pid=>`<button class="chip ${state.selectedSolo===pid?'on':''}" data-solo="${pid}">${esc(name(pid))}</button>`).join('')}</div><p><label>Soloart</label><select id="soloType"><option value="Damen-Solo">Damen-Solo</option><option value="Buben-Solo">Buben-Solo</option></select></p><p><label>Ausgang</label><select id="soloWon"><option value="won">Solo gewonnen</option><option value="lost">Solo verloren</option></select></p><p><label>Grund-Tacken pro Gegenspieler (vor Bock)</label><input type="number" id="soloPoints" min="0" step="1" value="1"></p><small>Soloist erhält den dreifachen Wert, jeder Gegenspieler den einfachen Gegenwert. Bock verdoppelt alle Werte.</small><p><button class="btn full" data-action="solo">Solo buchen</button></p>`}
function weddingForm(e,act){return `<h3>Hochzeit – Sonderbuchung</h3><p class="muted">Tippe direkt auf den Hochzeiter: +3 Tacken, die drei Mitspieler jeweils −1. Die Runde und der Geber wechseln dabei nicht.</p><div class="chips">${act.map(pid=>`<button class="chip" data-wedding="${pid}">${esc(name(pid))} · +3</button>`).join('')}</div>`}
function history(e){let events=[...(e.rounds||[]).map((r,i)=>({...r,kind:'round',number:i+1})),...(e.specials||[]).map(s=>({...s,kind:'special'}))].sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||''));if(!events.length)return '<p class="muted">Noch keine Einträge.</p>';return `<div class="timeline">${events.map(x=>`<div class="event"><div class="row"><strong>${x.kind==='special'?'Hochzeit · '+esc(name(x.wedding)):x.type==='solo'?'Runde '+x.number+' · '+esc(x.soloType):'Runde '+x.number+' · Normal'}</strong><small>${dt(x.createdAt)}</small></div><small>${Object.entries(x.delta||{}).map(([pid,v])=>esc(name(pid))+' '+(v>0?'+':'')+v).join(' · ')}</small>${x.bock?'<div><span class="pill warn">Bock ×2</span></div>':''}${x.triggers?.length?`<div><small>Bockauslöser: ${x.triggers.map(t=>({equal:'120:120',zero:'Null Tacken',heart:'Herz-Doppelkopf'}[t])).join(', ')}</small></div>`:''}${!e.endedAt&&x.kind==='special'?`<div style="margin-top:5px"><button class="btn ghost small" data-deletewedding="${x.id}">Hochzeit löschen</button></div>`:''}</div>`).join('')}</div>`}
function playersPage(){return `<div class="card"><h2>Stammspieler</h2><div class="stack">${state.players.filter(p=>p.regular).map(p=>`<div class="row soft"><strong>${esc(p.name)}</strong><span class="pill">Clubmitglied</span></div>`).join('')}</div><p class="muted">Gäste können beim Anlegen eines Abends hinzugefügt werden. Sie zählen nicht als dauerhaftes Clubmitglied.</p></div>`}
function cashPage(e){if(!e)return '<div class="card">Noch kein Spielabend vorhanden.</div>';let dues=cash(e),total=0,paid=0;for(let x of dues){total+=x.due;paid+=Math.min(x.due,Math.max(0,e.payments?.[x.pid]||0))}return `<div class="card"><h2>Kasse · ${dt(e.startedAt)}</h2><div class="grid"><div class="soft"><small>Soll</small><div class="stat">${money(total)}</div></div><div class="soft"><small>Eingegangen</small><div class="stat">${money(paid)}</div></div><div class="soft"><small>Offen</small><div class="stat">${money(total-paid)}</div></div></div><p class="muted">Anwesende: ${money(state.settings.fee)} Startgebühr, Verlust bei negativen Tacken und ${money(state.settings.soloFine)} ohne Solo. Abwesende Clubmitglieder: höchster Abendbeitrag + ${money(state.settings.absentExtra)}.</p><div class="tablewrap"><table class="table"><tr><th>Spieler</th><th>Soll</th><th>Bezahlt</th><th>Offen</th></tr>${dues.map(x=>{let v=Math.min(x.due,Math.max(0,e.payments?.[x.pid]||0));return `<tr><td>${esc(name(x.pid))}<br><small>${x.reason}</small></td><td>${money(x.due)}</td><td>${money(v)}</td><td>${money(x.due-v)}</td></tr>`}).join('')}</table></div>${`<h3>Zahlung erfassen</h3><div class="grid"><div><label>Spieler</label><select id="payPerson">${dues.map(x=>`<option value="${x.pid}">${esc(name(x.pid))}</option>`).join('')}</select></div><div><label>Betrag in Euro</label><input id="payAmount" type="number" min="0.01" step="0.01" value="5"></div></div><p><button class="btn" data-action="pay">Teilzahlung buchen</button> <button class="btn alt" data-action="payFull">Ausgewählten Spieler vollständig bezahlen</button></p>`}</div>`}
function morePage(e){return `<div class="card"><h2>Datensicherung</h2><p>Alle Daten bleiben auf diesem Gerät im Browser gespeichert. Sichere sie regelmäßig als JSON-Datei, besonders vor einem Gerätewechsel.</p><button class="btn" data-action="backup">JSON-Sicherung herunterladen</button> <button class="btn alt" data-action="restore">JSON-Sicherung importieren</button></div><div class="card"><h2>Spielabende</h2>${state.evenings.length?state.evenings.slice().reverse().map(x=>`<div class="soft" style="margin-bottom:9px"><div class="row"><strong>${dt(x.startedAt)} · ${esc(name(x.host))}</strong><span class="pill ${x.endedAt?'':'warn'}">${x.endedAt?'Abgeschlossen':'Offen'}</span></div><small>${x.rounds.length} Runden · ${x.specials.length} Hochzeiten${x.endedAt?' · Ende '+dt(x.endedAt):''}</small><p style="margin-bottom:0"><button class="btn small alt" data-evening="${x.id}">Ansehen</button></p></div>`).join(''):'<p class="muted">Noch keine Spielabende.</p>'}</div><div class="card"><h2>Regeln</h2><p class="muted">Tackenwert ${money(state.settings.tack)} · Startgeld ${money(state.settings.fee)} · Solo-Strafe ${money(state.settings.soloFine)} · Abwesenheit + ${money(state.settings.absentExtra)}. Eine Hochzeit verändert nicht den Geber. Bock läuft ausschließlich beim Abschluss des Abends aus.</p></div>`}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.go;render()});document.querySelectorAll('[data-form]').forEach(b=>b.onclick=()=>{state.form=b.dataset.form;render()});document.querySelectorAll('[data-attend]').forEach(b=>b.onclick=()=>{let pid=b.dataset.attend;state.attendanceDraft=state.attendanceDraft.includes(pid)?state.attendanceDraft.filter(x=>x!==pid):[...state.attendanceDraft,pid];state.seatDraft=[...state.seatDraft.filter(x=>state.attendanceDraft.includes(x)||state.guestDraft.some(g=>g.id===x)),...state.attendanceDraft.filter(x=>!state.seatDraft.includes(x))];render()});document.querySelectorAll('[data-removeguest]').forEach(b=>b.onclick=()=>{state.guestDraft=state.guestDraft.filter(g=>g.id!==b.dataset.removeguest);state.seatDraft=state.seatDraft.filter(x=>x!==b.dataset.removeguest);render()});document.querySelectorAll('[data-seatmove]').forEach(b=>b.onclick=()=>{let [pid,step]=b.dataset.seatmove.split(':'),i=state.seatDraft.indexOf(pid),j=i+Number(step);if(j>=0&&j<state.seatDraft.length){[state.seatDraft[i],state.seatDraft[j]]=[state.seatDraft[j],state.seatDraft[i]];render()}});document.querySelectorAll('[data-winner]').forEach(b=>b.onclick=()=>{let pid=b.dataset.winner;state.selectedWinners=state.selectedWinners.includes(pid)?state.selectedWinners.filter(x=>x!==pid):state.selectedWinners.length<2?[...state.selectedWinners,pid]:[state.selectedWinners[1],pid];render()});document.querySelectorAll('[data-solo]').forEach(b=>b.onclick=()=>{state.selectedSolo=b.dataset.solo;render()});document.querySelectorAll('[data-trigger]').forEach(b=>b.onclick=()=>{let k=b.dataset.trigger;state.selectedTriggers=state.selectedTriggers.includes(k)?state.selectedTriggers.filter(x=>x!==k):[...state.selectedTriggers,k];render()});document.querySelectorAll('[data-wedding]').forEach(b=>b.onclick=()=>bookWedding(b.dataset.wedding));document.querySelectorAll('[data-deletewedding]').forEach(b=>b.onclick=()=>deleteWedding(b.dataset.deletewedding));document.querySelectorAll('[data-evening]').forEach(b=>b.onclick=()=>{let target=state.evenings.find(x=>x.id===b.dataset.evening);if(target){state.evenings=state.evenings.filter(x=>x.id!==target.id).concat([target]);state.tab='game';render()}});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>actions(b.dataset.action))}
function actions(a){let e=activeEvening();if(a==='addGuest'){let n=prompt('Name des Gastspielers:')?.trim();if(!n)return;if([...state.players,...state.guestDraft].some(p=>p.name.toLowerCase()===n.toLowerCase()))return alert('Dieser Name ist bereits vorhanden.');let p={id:id(),name:n,regular:false};state.guestDraft.push(p);state.seatDraft.push(p.id);render();return}if(a==='start'){if(e)return alert('Bitte zuerst den laufenden Abend beenden.');let host=$('host')?.value,mode=$('mode')?.value,people=state.seatDraft.filter(pid=>state.attendanceDraft.includes(pid)||state.guestDraft.some(p=>p.id===pid));if(people.length<4||people.length>6)return alert('Bitte 4 bis 6 anwesende Spieler auswählen.');if(new Set(people).size!==people.length)return alert('Sitzordnung enthält doppelte Spieler.');state.players.push(...state.guestDraft);let t=now();state.evenings.push({id:id(),host,mode,startedAt:t,endedAt:null,attendees:people,seats:people,rounds:[],specials:[],payments:{},bockInitial:people.length,bockAdded:0,expiredBock:0});state.guestDraft=[];state.attendanceDraft=[];state.seatDraft=[];state.selectedWinners=[];state.selectedSolo=null;state.selectedTriggers=[];state.tab='game';save();render();return}if(a==='backup'){let blob=new Blob([JSON.stringify({format:'doko-bronze-v2',exportedAt:now(),players:state.players,evenings:state.evenings,settings:state.settings},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='doppelkopf-sicherung-'+new Date().toISOString().slice(0,10)+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}if(a==='restore'){$('restore').click();return}if(!e&&a!=='pay'&&a!=='payFull')return alert('Kein laufender Spielabend.');if(a==='normal'){let act=playersIn(e),w=state.selectedWinners.filter(p=>act.includes(p));if(w.length!==2)return alert('Bitte genau zwei Gewinner auswählen.');let n=Number($('normalPoints')?.value);if(!Number.isInteger(n)||n<0)return alert('Bitte eine gültige ganze Tackenzahl eingeben.');let m=bockRemaining(e)>0?2:1,delta={};for(let pid of act){let extra=Number($('extra_'+pid)?.value||0);if(!Number.isInteger(extra))return alert('Zusatzpunkte müssen ganze Zahlen sein.');delta[pid]=((w.includes(pid)?n:-n)+extra)*m}let tr=[...state.selectedTriggers];e.rounds.push({id:id(),type:'normal',createdAt:now(),winners:w,points:n,delta,bock:m===2,triggers:tr});if(tr.length)e.bockAdded+=e.attendees.length;state.selectedWinners=[];state.selectedTriggers=[];save();render();return}if(a==='solo'){let act=playersIn(e),pid=state.selectedSolo;if(!act.includes(pid))return alert('Bitte einen aktiven Solospieler auswählen.');let n=Number($('soloPoints')?.value);if(!Number.isInteger(n)||n<0)return alert('Bitte eine gültige ganze Tackenzahl eingeben.');let won=$('soloWon')?.value==='won',m=bockRemaining(e)>0?2:1,delta={};for(let p of act)delta[p]=(p===pid?(won?3:-3):(won?-1:1))*n*m;e.rounds.push({id:id(),type:'solo',soloist:pid,soloType:$('soloType')?.value||'Damen-Solo',won,points:n,createdAt:now(),delta,bock:m===2,triggers:[]});state.selectedSolo=null;save();render();return}if(a==='close'){let remaining=bockRemaining(e);if(!confirm(`Spielabend endgültig abschließen? ${remaining} offene Bockspiele verfallen. Danach sind keine Änderungen mehr möglich.`))return;e.expiredBock=remaining;e.endedAt=now();save();render();return}if(a==='pay'||a==='payFull'){let cashEvening=lastEvening();if(!cashEvening)return;let pid=$('payPerson')?.value,entry=cash(cashEvening).find(x=>x.pid===pid);if(!entry)return;let prev=cashEvening.payments?.[pid]||0,amount=a==='payFull'?round2(entry.due-prev):Number($('payAmount')?.value);if(!Number.isFinite(amount)||amount<=0)return alert('Bitte einen positiven Betrag eingeben.');if(round2(prev+amount)>entry.due)return alert('Die Zahlung übersteigt den offenen Betrag.');cashEvening.payments=cashEvening.payments||{};cashEvening.payments[pid]=round2(prev+amount);save();render();return}}
function bookWedding(pid){let e=activeEvening();if(!e)return;let act=playersIn(e);if(!act.includes(pid))return;let delta={};for(let p of act)delta[p]=p===pid?3:-1;e.specials.push({id:id(),type:'wedding',wedding:pid,createdAt:now(),delta,bock:false});save();render()}
function deleteWedding(sid){let e=activeEvening();if(!e)return;if(!confirm('Diese Hochzeit aus dem Protokoll entfernen?'))return;e.specials=e.specials.filter(x=>x.id!==sid);save();render()}
$('restore').addEventListener('change',async ev=>{let file=ev.target.files?.[0];if(!file)return;try{let d=JSON.parse(await file.text());if(!Array.isArray(d.players)||!Array.isArray(d.evenings))throw Error('Ungültige Sicherung.');if(!confirm('Die aktuellen Daten auf diesem Gerät werden durch die Sicherung ersetzt. Fortfahren?'))return;localStorage.setItem(KEY,JSON.stringify({players:d.players,evenings:d.evenings,settings:{...state.settings,...d.settings}}));location.reload()}catch(err){alert('Import fehlgeschlagen: '+err.message)}finally{ev.target.value=''}});
init();})();
</script></body></html>

 <div class="row"><span>Spielabende</span><b>${chosen.nights}</b></div>
 <div class="row"><span>Soli / Hochzeiten</span><b>${chosen.solos} / ${chosen.weddings}</b></div>
 ${chosen.unknown?`<p class="mini">Bei ${chosen.unknown} Abend(en) fehlen reine Ergebnisse oder persönliche Rundenzahlen. Diese zählen nicht zum Ø pro Runde.</p>`:''}
 <h3>Persönliche Rekorde</h3>${chosen.history.length?`<div class="row"><span>Bester Abend</span><b>${money(Math.max(...chosen.history.map(h=>h.amount)))}</b></div><div class="row"><span>Schlechtester Abend</span><b>${money(Math.min(...chosen.history.map(h=>h.amount)))}</b></div>`:'<p class="mini">Noch keine Ergebnisse.</p>'}
 <h3>Spielhistorie</h3>${chosen.history.sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(h=>`<div class="row"><span><b>${esc(dateDE(h.date))}</b><small class="mini" style="display:block">Bei ${esc(h.host)} · ${esc(h.source)}${h.rounds?' · '+h.rounds+' Runden':''}${h.solos!==null?' · '+h.solos+' Soli · '+h.weddings+' Hochzeiten':''}</small></span><b class="${h.amount>=0?'good':'bad'}">${money(h.amount)}</b></div>`).join('')||'<p class="muted">Noch keine Ergebnisse.</p>'}</div>`:'';
 if(page==='statisticsProfile'){
  if(!chosen)return `<div class="card">${button('← Zurück zur Statistik',"go('statistics')")}<p>Dieser Spieler ist nicht mehr vorhanden.</p></div>`;
  const yearSelect=`<div class="card"><label>Zeitraum</label><select onchange="statisticsYear=this.value;render()"><option value="all" ${selected==='all'?'selected':''}>Alle Jahre</option>${years.map(y=>`<option value="${y}" ${selected===y?'selected':''}>${y}</option>`).join('')}</select></div>`;
  return `<div class="profile-page"><div class="card profile-heading">${button('← Clubstatistik',"go('statistics')")}<h2>Persönliche Statistik</h2><p class="muted">${esc(chosen.p.name)}</p></div>${yearSelect}${playerDetails}</div>`;
 }
 const yearRows=years.map(y=>{const es=db.evenings.filter(e=>String(e.date||'').startsWith(y+'-'));const count=es.reduce((n,e)=>n+(e.historicalMode==='stats'?Number(e.historicalStats?.totalRounds||0):(e.rounds||[]).length),0);return `<tr><td>${y}</td><td>${es.length}</td><td>${count}</td></tr>`}).join('');
 return `<div class="card"><div class="actions">${button('← Ergebnisse',"go('resultsOverview')")}</div><h2>Clubstatistik</h2>
 <label>Zeitraum</label><select onchange="statisticsYear=this.value;statisticsPlayer=null;render()"><option value="all" ${selected==='all'?'selected':''}>Alle Jahre</option>${years.map(y=>`<option value="${y}" ${selected===y?'selected':''}>${y}</option>`).join('')}</select>
 <div class="row"><span>Spielabende</span><b>${evenings.length}</b></div><div class="row"><span>Runden insgesamt</span><b>${totalRounds}</b></div><div class="row"><span>Erfasste Soli</span><b>${totalSolos}</b></div><div class="row"><span>Erfasste Hochzeiten</span><b>${data.reduce((n,x)=>n+x.weddings,0)}</b></div></div>
 <div class="card"><h3>Jahresrangliste</h3><div class="scroll"><table class="stat-compact"><thead><tr><th>Platz</th><th>Spieler</th><th>Runden</th><th>Ø €/Runde</th></tr></thead><tbody>
 ${data.map((x,i)=>`<tr class="stat-tap" ><td>${x.avg===null?'–':data.slice(0,i+1).filter(z=>z.avg!==null).length+'.'}</td><td><button type="button" class="stat-player-button" onclick="openPlayerProfile('${x.p.id}')" aria-label="Persönliche Statistik von ${esc(x.p.name)} öffnen"><span>${esc(x.p.name)}</span><span aria-hidden="true">›</span></button></td><td>${x.rounds}</td><td class="${x.avg===null?'':x.avg>=0?'good':'bad'}"><b>${x.avg===null?'–':money(x.avg)}</b></td></tr>`).join('')}</tbody></table></div>
 <div class="historical-stat-note"><b>So funktioniert die Rangliste</b><p class="mini">Reines Spielergebnis in Euro geteilt durch tatsächlich gespielte persönliche Runden. Startgeld und Solo-Strafen zählen nicht. Keine Mindestanzahl. Abende ohne bekannte persönliche Rundenzahl bleiben aus diesem Durchschnitt heraus.</p></div><p class="mini">Spielernamen antippen, um Ergebnisse und Historie zu sehen.</p></div>
 <div class="card"><h3>${selected==='all'?'Clubrekorde · alle Jahre':'Clubrekorde · '+selected}</h3>${recordSet(evenings)}<p class="mini">Nur erfasste reine Spielergebnisse; Soli und Hochzeiten soweit dokumentiert.</p></div>
 ${selected==='all'?'':`<div class="card"><h3>Ewige Clubrekorde</h3>${recordSet(db.evenings)}</div>`}
 <div class="card"><h3>Jahresvergleich</h3><div class="scroll"><table class="stat-compact"><thead><tr><th>Jahr</th><th>Spielabende</th><th>Runden</th></tr></thead><tbody>${yearRows||'<tr><td colspan="3">Noch keine Daten</td></tr>'}</tbody></table></div><p class="mini">Schlichte Jahresübersicht ohne Diagramme.</p></div>`;
}

let resultsYear=String(new Date().getFullYear());
function resultsOverview(){
 const years=[...new Set(db.evenings.map(e=>String(e.date||'').slice(0,4)).filter(y=>/^\d{4}$/.test(y)))].sort().reverse();
 if(!years.includes(resultsYear))resultsYear=years[0]||String(new Date().getFullYear());
 const chosen=[...db.evenings].filter(e=>String(e.date||'').startsWith(resultsYear+'-')).sort((a,b)=>String(b.date).localeCompare(String(a.date))||Number(b.startedAt||0)-Number(a.startedAt||0));
 const makeResultCard=e=>{
  if(e.historicalMode==='stats')return historicalResultCard(e);
  const t=totals(e),rows=dueRows(e);
  const lines=rows.map(r=>{
   const game=r.present?(t[r.id]||0)*db.settings.tack:null;
   const solo=r.present?(e.historical?0:(soloCount(e,r.id)?0:db.settings.soloFee)):null;
   const paid=paidAmount(e,r.id),isPaid=e.historical||paid+0.005>=r.fee;
   return `<tr><td>${esc(name(r.id))}${r.present?'':'<small class="bill-absent">abwesend</small>'}</td><td class="${game===null?'':game>=0?'good':'bad'}">${game===null?'–':(game>0?'+':'')+euro(game)}</td><td><b>${euro(r.fee)}</b></td></tr>`;
  }).join('');
  return `<div class="card"><div class="row"><div><h3 style="margin:0">${esc(dateDE(e.date))}</h3><div class="mini">${esc(name(e.host))}${e.historical?' · Nachtrag':''}</div></div>${button('Öffnen',`openResultsEvening('${e.id}')`)}</div><div class="bill-caption">${e.historical&&e.historicalMode==='summary'?'Historische Endbeträge inkl. Gebühren':'Startgebühr '+euro(db.settings.startFee)+' inklusive'}</div><div class="bill-wrap"><table class="bill-table result-mini"><tr><th>Spieler</th><th>Spiel +/−</th><th>Zahlung</th></tr>${lines}</table></div></div>`;
 };
 const cards=chosen.slice(0,4).map(makeResultCard).join('');
 const older=chosen.length>4?`<details class="card"><summary>Ältere Spielabende anzeigen (${chosen.length-4})</summary><div style="margin-top:12px">${chosen.slice(4).map(makeResultCard).join('')}</div></details>`:'';
 return `<div class="card"><h2>Ergebnisse</h2><p class="muted">Alle Spielabende des ausgewählten Jahres.</p><div class="results-year"><div style="flex:1;min-width:150px"><label>Jahr auswählen</label><select onchange="resultsYear=this.value;render()">${years.length?years.map(y=>`<option value="${y}" ${resultsYear===y?'selected':''}>${y}</option>`).join(''):`<option>${resultsYear}</option>`}</select></div>${button('▥ Statistik',`statisticsYear=resultsYear;go('statistics')`,'primary')}</div><div class="row"><span>Spielabende im Jahr</span><b>${chosen.length}</b></div></div>${cards||'<div class="card">Für dieses Jahr sind noch keine Spielabende vorhanden.</div>'}${older}`;
}
function openResultsEvening(id){eveningId=id;go('results')}

// V1.8.11: Statistical-only historical entry. No payment/cash mutations.
let historicalDraft=null;
function initHistoricalDraft(){
 return {date:new Date().toLocaleDateString('sv-SE'),host:db.players.find(p=>!p.guest)?.id||'',totalRounds:'',players:Object.fromEntries(db.players.map(p=>[p.id,{present:!p.guest,tacken:'',solos:0,weddings:0,rounds:''}]))};
}
function historicalEntry(){
 if(!historicalDraft)historicalDraft=initHistoricalDraft();
 const d=historicalDraft,done=db.evenings.filter(e=>e.historicalMode==='stats').length;
 return `<div class="card"><div class="row"><h2>Spielabend nachtragen</h2>${button('Zurück',"go('settings');openSettingsSection('fees')")}</div>
 <p class="mini">Alte Papierzettel · nur Statistik · keine Kassenbuchungen</p><p class="mini">${done} historische Spielabende bereits mit der neuen Maske erfasst.</p>
 <label>Datum des Spielabends</label><input type="date" value="${esc(d.date)}" onchange="historicalDraft.date=this.value">
 <label>Bei wem wurde gespielt?</label><select onchange="historicalDraft.host=this.value">${db.players.map(p=>`<option value="${p.id}" ${d.host===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
 <label>Gespielte Runden des Abends (freiwillig)</label><input type="number" min="0" step="1" inputmode="numeric" value="${esc(d.totalRounds)}" oninput="historicalDraft.totalRounds=this.value" placeholder="z. B. 28">
 <h3>Spieler & Endstände</h3><p class="mini">Bitte den <b>letzten Tackenstand</b> aus jeder Spalte eingeben, z. B. −2200 oder +1320. Nicht die 5/10 € Gebühren aus der Kassenabrechnung.</p>
 ${db.players.map(p=>{const x=d.players[p.id]||{present:false,tacken:'',solos:0,weddings:0,rounds:''};return `<div class="historical-person"><div class="row"><b>${esc(p.name)}</b><label class="check"><input type="checkbox" ${x.present?'checked':''} onchange="historicalSet('${p.id}','present',this.checked);render()"> Dabei</label></div>${x.present?`<div class="historical-grid">
 <div><label>Tacken-Endstand (+/−)</label><input type="text" inputmode="text" value="${esc(x.tacken)}" oninput="historicalSet('${p.id}','tacken',this.value)" placeholder="z. B. −2200"></div>
 <div><label>Eigene gespielte Runden (freiwillig)</label><input type="number" min="0" step="1" inputmode="numeric" value="${esc(x.rounds)}" oninput="historicalSet('${p.id}','rounds',this.value)" placeholder="z. B. 19"></div>
 <div><label>Soli</label><div class="historical-counter"><button type="button" onclick="historicalCounter('${p.id}','solos',-1)">−</button><b>${x.solos}</b><button type="button" onclick="historicalCounter('${p.id}','solos',1)">+</button></div></div>
 <div><label>Hochzeiten</label><div class="historical-counter"><button type="button" onclick="historicalCounter('${p.id}','weddings',-1)">−</button><b>${x.weddings}</b><button type="button" onclick="historicalCounter('${p.id}','weddings',1)">+</button></div></div></div>`:''}</div>`}).join('')}
 <div class="historical-stat-note"><b>Statistik, keine Kasse</b><p class="mini">Reine Tacken-Endstände werden mit dem gültigen Tackenwert in Euro umgerechnet. Fehlende persönliche Rundenzahlen werden nicht geschätzt. Auch Abwesende erhalten keine Gebühren.</p></div>
 <p id="historicalEntryError" class="bad" role="alert"></p><div class="actions">${button('Spielabend speichern','saveHistoricalStats()','primary')}${button('Abbrechen',"historicalDraft=null;go('home')")}</div></div>`;
}
function historicalSet(id,key,value){if(!historicalDraft?.players[id])return;historicalDraft.players[id][key]=value}
function historicalCounter(id,key,delta){const x=historicalDraft?.players[id];if(!x)return;x[key]=Math.max(0,Number(x[key]||0)+delta);render()}
function historicalError(msg){const el=document.getElementById('historicalEntryError');if(el){el.textContent=msg;el.scrollIntoView({block:'center'})}else alert(msg)}
function saveHistoricalStats(){
 const d=historicalDraft;if(!d)return;
 if(!/^\d{4}-\d{2}-\d{2}$/.test(d.date)||Number.isNaN(Date.parse(d.date)))return historicalError('Bitte ein gültiges Datum eingeben.');
 const ids=Object.keys(d.players).filter(id=>d.players[id].present);
 if(ids.length<4||ids.length>6)return historicalError('Bitte 4 bis 6 anwesende Spieler auswählen.');
 if(!ids.includes(d.host))return historicalError('Der Gastgeber muss anwesend sein.');
 const total=d.totalRounds===''?null:Number(d.totalRounds);
 if(total!==null&&(!Number.isInteger(total)||total<1||total>1000))return historicalError('Bitte eine gültige Gesamtrundenzahl eingeben oder das Feld freilassen.');
 const players={};let sum=0,knownRounds=0,allKnown=true;
 for(const id of ids){
  const x=d.players[id],raw=String(x.tacken).trim().replace(/\s/g,'').replace('−','-').replace(/^\+/,'');
  if(!/^-?\d+$/.test(raw))return historicalError('Bitte für '+name(id)+' einen ganzen Tacken-Endstand mit Vorzeichen eingeben.');
  const tacken=Number(raw);if(!Number.isSafeInteger(tacken)||Math.abs(tacken)>1000000)return historicalError('Ungewöhnlicher Tackenstand bei '+name(id));
  const solos=Number(x.solos),weddings=Number(x.weddings);
  if(!Number.isInteger(solos)||solos<0||!Number.isInteger(weddings)||weddings<0)return historicalError('Soli und Hochzeiten müssen ganze Zahlen sein.');
  const r=x.rounds===''?null:Number(x.rounds);
  if(r!==null&&(!Number.isInteger(r)||r<1||r>1000||(total!==null&&r>total)))return historicalError('Ungültige persönliche Rundenzahl bei '+name(id));
  if(r===null)allKnown=false;else knownRounds+=r;
  players[id]={tacken,solos,weddings,rounds:r};sum+=tacken;
 }
 if(total!==null&&allKnown&&knownRounds!==4*total)return historicalError('Die Summe der persönlichen Runden ('+knownRounds+') muss bei vier Aktiven pro Runde genau '+(4*total)+' ergeben. Bitte die Rundenzahlen prüfen.');
 if(sum!==0)return historicalError('Die Tacken-Endstände ergeben zusammen '+sum+' statt 0. Bitte die Papierliste prüfen, bevor du speicherst.');
 const e={id:uid(),date:d.date,host:d.host,startedAt:Date.now(),endedAt:Date.now(),present:ids,seats:[],rounds:[],specials:[],soloPlayers:ids.filter(id=>players[id].solos>0),payments:{},historical:true,historicalMode:'stats',historicalStats:{totalRounds:total,players,tackRate:Number(db.settings.tack)}};
 db.evenings.push(e);save();historicalDraft=initHistoricalDraft();go('historicalEntry');alert('Spielabend für die Statistik gespeichert. Du kannst direkt den nächsten nachtragen.');
}
function historicalResultCard(e){
 const stats=e.historicalStats||{};
 return `<div class="card"><div class="row"><div><h3 style="margin:0">${esc(dateDE(e.date))}</h3><div class="mini">Bei ${esc(name(e.host))} · Statistik-Nachtrag</div></div>${button('Öffnen',`openResultsEvening('${e.id}')`)}</div><div class="bill-wrap"><table class="bill-table result-mini"><tr><th>Spieler</th><th>Tacken</th><th>Spiel +/−</th></tr>${e.present.map(id=>{const x=stats.players?.[id]||{},v=Number(x.tacken||0)*Number(stats.tackRate||db.settings.tack);return `<tr><td>${esc(name(id))}</td><td>${x.tacken>0?'+':''}${x.tacken||0}</td><td class="${v>=0?'good':'bad'}">${v>0?'+':''}${euro(v)}</td></tr>`}).join('')}</table></div></div>`;
}
function historicalResult(e){const stats=e.historicalStats||{};
 return `<div class="card"><h2>Statistik-Nachtrag · ${esc(dateDE(e.date))}</h2><p>Bei ${esc(name(e.host))} · ${stats.totalRounds||'–'} Runden insgesamt</p><p class="mini">Nur für die Statistik, keine Kassenabrechnung.</p>
 <div class="bill-wrap"><table class="bill-table"><tr><th>Spieler</th><th>Tacken</th><th>Euro</th><th>Runden</th><th>Solo</th><th>Hochzeit</th></tr>${e.present.map(id=>{const x=stats.players?.[id]||{},v=Number(x.tacken||0)*Number(stats.tackRate||db.settings.tack);return `<tr><td>${esc(name(id))}</td><td>${x.tacken||0}</td><td>${euro(v)}</td><td>${x.rounds??'–'}</td><td>${x.solos||0}</td><td>${x.weddings||0}</td></tr>`}).join('')}</table></div><div class="actions">${button('Zurück',"go('resultsOverview')")}</div></div>`;
}

render();

if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(err=>{console.warn('Offline-Installation nicht verfügbar',err)}))}
</script>
<div id="app-dialog" hidden role="dialog" aria-modal="true" aria-labelledby="app-dialog-title"><div class="app-dialog-box"><h3 id="app-dialog-title">Bestätigung</h3><p id="app-dialog-message"></p><div class="app-dialog-actions"><button id="app-dialog-cancel" type="button">Abbrechen</button><button id="app-dialog-ok" class="primary" type="button">Bestätigen</button></div></div></div></body>
